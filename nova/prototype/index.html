<!doctype html>
<html lang="fa" dir="rtl" data-nova-root="../">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="درس های داستانی انگلیسی Nova با مکالمه، شنیدن و تمرین های تعاملی.">
<meta name="theme-color" content="#5963f6">
<title>Nova — تمرین انگلیسی</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <header class="brandbar"><button id="homeBtn" class="brand" aria-label="خانه Nova">nova<span>•</span></button><span class="preview-label">پیش‌نمایش درس‌ها</span></header>
  <section id="homeScreen" class="home" hidden>
    <p class="eyebrow">دارم یاد می‌گیرم</p>
    <h1 id="languageTitle">انگلیسی</h1>
    <div class="session-progress"><div class="progress-heading"><span>پیشرفت این جلسه</span><strong id="homeCount"></strong></div><div class="track"><div id="homeProgress" class="bar"></div></div></div>
    <article class="next-lesson"><span class="eyebrow" id="nextLessonLabel">درس بعدی</span><h2 id="nextLessonTitle"></h2><p id="nextLessonSummary" class="sub"></p><button class="next" id="startBtn">شروع درس</button></article>
    <div class="section-heading"><h2>درس‌ها</h2><span id="lessonTotal"></span></div>
    <div id="lessonList" class="lesson-list"></div>
    <label class="review-mode"><input type="checkbox" id="reviewMode"><span>مرور بدون میکروفن</span></label>
    <p class="small-note">در حالت مرور می‌تونی از تمرین گفتاری عبور کنی. پیشرفت فقط تا وقتی این صفحه بازه نگه داشته می‌شه.</p>
  </section>
  <div class="top" id="lessonHeader" hidden>
    <select class="lesson-select" id="lessonSelect" aria-label="انتخاب درس"></select>
    <button class="back" id="backBtn" aria-label="مرحله قبلی">‹</button>
    <div class="track" role="progressbar" aria-label="پیشرفت درس" aria-valuemin="0" aria-valuemax="100" id="lessonProgress"><div class="bar" id="progressBar"></div></div>
    <div class="count" id="stepCount"></div>
  </div>
  <main id="screens" class="screen" aria-live="polite"><p class="sub">در حال دریافت درس‌ها...</p></main>
  <div class="bottom" id="bottomBar" hidden><button class="next" id="nextBtn" disabled>ادامه</button></div>
  <div class="feedback" id="feedbackPanel" role="alertdialog" aria-modal="true" aria-labelledby="feedbackTitle" aria-describedby="feedbackText" hidden><strong id="feedbackTitle"></strong><span id="feedbackText"></span><button id="feedbackContinue">ادامه</button></div>
</div>
<script src="app.js" defer></script>
</body>
</html>
