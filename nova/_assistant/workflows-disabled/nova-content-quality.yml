name: Nova Content Quality

on:
  push:
    branches: [main]
    paths: ["nova/**", ".github/workflows/nova-content-quality.yml"]
  pull_request:
    paths: ["nova/**", ".github/workflows/nova-content-quality.yml"]

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fresh v3.2 foundation gate
        run: python3 nova/validation/validate_migration_v3.py
      - name: Native v3.2 pedagogical gate
        run: python3 nova/validation/validate_content_v3.py
      - name: TTS parser unit tests
        run: python -m unittest discover -s nova/tts/tests -v

  mysql8:
    needs: foundation
    strategy:
      fail-fast: false
      matrix:
        include:
          - course: en-fa
            lang: en
          - course: de-fa
            lang: de
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: nova_qa_root
          MYSQL_DATABASE: nova_qa
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pnova_qa_root"
          --health-interval=10s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - name: Validate TTS sources when present
        shell: bash
        run: |
          set -euo pipefail
          if find "nova/courses/${{ matrix.course }}/staging" -name chapter.sql -type f 2>/dev/null | grep -q .; then
            NOVA_COURSE=${{ matrix.course }} python nova/tts/v3_tts_runner.py turn validate-sources
            NOVA_COURSE=${{ matrix.course }} python nova/tts/v3_tts_runner.py word validate-sources
          else
            echo "${{ matrix.course }}: no chapter SQL yet"
          fi
      - name: Compile clean v3.2 foundation on MySQL 8
        env: {MYSQL_PWD: nova_qa_root}
        run: |
          mysql --protocol=TCP -h 127.0.0.1 -uroot nova_qa < nova/database/reset_all_v10.sql
          mysql --protocol=TCP -h 127.0.0.1 -uroot nova_qa < nova/database/schema_v9.sql
          mysql --protocol=TCP -h 127.0.0.1 -uroot nova_qa < nova/database/semantic_layer_v10.sql
          mysql --protocol=TCP -h 127.0.0.1 -uroot nova_qa < nova/database/foundation_seed_v3.sql
      - name: Execute native v3.2 chapters
        env: {MYSQL_PWD: nova_qa_root}
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            mysql --protocol=TCP -h 127.0.0.1 -uroot nova_qa < "$file"
          done < <(find "nova/courses/${{ matrix.course }}/staging" -name chapter.sql -type f 2>/dev/null | sort)
      - name: Verify source rows own audio locators
        env: {MYSQL_PWD: nova_qa_root}
        run: |
          test "$(mysql --batch --skip-column-names --protocol=TCP -h 127.0.0.1 -uroot nova_qa -e "SELECT COUNT(*) FROM words w JOIN courses c ON c.id=w.course_id WHERE c.learning_language='${{ matrix.lang }}' AND c.base_language='fa' AND (w.audio_url IS NULL OR w.audio_url='');")" = "0"
          test "$(mysql --batch --skip-column-names --protocol=TCP -h 127.0.0.1 -uroot nova_qa -e "SELECT COUNT(*) FROM turns t JOIN lessons l ON l.id=t.lesson_id JOIN chapters ch ON ch.id=l.chapter_id JOIN modules m ON m.id=ch.module_id JOIN levels lv ON lv.id=m.level_id JOIN courses c ON c.id=lv.course_id WHERE c.learning_language='${{ matrix.lang }}' AND c.base_language='fa' AND (t.audio_url IS NULL OR t.audio_url='');")" = "0"
