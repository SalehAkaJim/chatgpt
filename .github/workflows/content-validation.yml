name: Content Validation

on:
  push:
    branches: [main]
    paths:
      - 'content/**'
      - 'audio/**'
      - 'database/import/**'
      - 'database/migrations/**'
      - 'scripts/**'
      - 'requirements.txt'
      - '.github/workflows/content-validation.yml'
  pull_request:
    paths:
      - 'content/**'
      - 'audio/**'
      - 'database/import/**'
      - 'database/migrations/**'
      - 'scripts/**'
      - 'requirements.txt'
      - '.github/workflows/content-validation.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pipeline dependencies
        run: pip install -r requirements.txt

      - name: Compile content and audio tooling
        run: |
          python -m py_compile \
            scripts/validate_content.py \
            scripts/materialize_level.py \
            scripts/sync_character_cast.py \
            scripts/build_audio_manifest.py \
            scripts/generate_audio.py \
            scripts/validate_audio_manifest.py \
            scripts/link_audio_assets.py \
            database/import/en/a1.py

      - name: Validate production batches
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find content/production -type f -name '*.json' | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo 'No production content batches found.'
            exit 1
          fi
          for file in "${files[@]}"; do
            echo "Validating $file"
            python scripts/validate_content.py "$file"
          done

      - name: Validate English A1 level import entrypoint
        run: python database/import/en/a1.py --dry-run

      - name: Build strict English A1 audio manifest
        run: |
          python scripts/build_audio_manifest.py content/production/en/A1 \
            --level A1 \
            --locale en-US \
            --strict-characters \
            --output /tmp/en-a1-audio-manifest.json

      - name: Validate English A1 audio manifest structure
        run: python scripts/validate_audio_manifest.py /tmp/en-a1-audio-manifest.json
