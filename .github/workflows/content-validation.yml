name: Content Validation

on:
  push:
    branches: [main]
    paths:
      - 'content/**'
      - 'audio/**'
      - 'database/import/**'
      - 'database/migrations/**'
      - 'scripts/**'
      - 'requirements.txt'
      - '.github/workflows/content-validation.yml'
  pull_request:
    paths:
      - 'content/**'
      - 'audio/**'
      - 'database/import/**'
      - 'database/migrations/**'
      - 'scripts/**'
      - 'requirements.txt'
      - '.github/workflows/content-validation.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pipeline dependencies
        run: pip install -r requirements.txt

      - name: Compile content and audio tooling
        run: |
          python -m py_compile \
            scripts/validate_content.py \
            scripts/materialize_level.py \
            scripts/sync_character_cast.py \
            scripts/build_audio_manifest.py \
            scripts/resolve_audio_voices.py \
            scripts/generate_audio.py \
            scripts/validate_audio_manifest.py \
            scripts/import_audio_manifest.py \
            database/import/en/pre_a1.py \
            database/import/en/a1.py \
            database/import/en/a2.py \
            database/import/en/b1.py \
            database/import/en/b2.py \
            database/import/en/c1.py \
            database/import/en/c2.py

      - name: Validate production batches
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find content/production -type f -name '*.json' | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo 'No production content batches found.'
            exit 1
          fi
          for file in "${files[@]}"; do
            echo "Validating $file"
            python scripts/validate_content.py "$file"
          done

      - name: Validate complete English level import entrypoints
        run: |
          python database/import/en/pre_a1.py --dry-run
          python database/import/en/a1.py --dry-run
          python database/import/en/a2.py --dry-run
          python database/import/en/b1.py --dry-run
          python database/import/en/b2.py --dry-run
          python database/import/en/c1.py --dry-run
          python database/import/en/c2.py --dry-run

      - name: Build strict English audio manifests
        run: |
          python scripts/build_audio_manifest.py content/production/en/Pre-A1 \
            --level Pre-A1 --locale en-US --strict-characters \
            --output /tmp/en-pre-a1-audio-manifest.json
          python scripts/build_audio_manifest.py content/production/en/A1 \
            --level A1 --locale en-US --strict-characters \
            --output /tmp/en-a1-audio-manifest.json
          python scripts/build_audio_manifest.py content/production/en/A2 \
            --level A2 --locale en-US --strict-characters \
            --output /tmp/en-a2-audio-manifest.json
          python scripts/build_audio_manifest.py content/production/en/B1 \
            --level B1 --locale en-US --strict-characters \
            --output /tmp/en-b1-audio-manifest.json
          python scripts/build_audio_manifest.py content/production/en/B2 \
            --level B2 --locale en-US --strict-characters \
            --output /tmp/en-b2-audio-manifest.json
          python scripts/build_audio_manifest.py content/production/en/C1 \
            --level C1 --locale en-US --strict-characters \
            --output /tmp/en-c1-audio-manifest.json
          python scripts/build_audio_manifest.py content/production/en/C2 \
            --level C2 --locale en-US --strict-characters \
            --output /tmp/en-c2-audio-manifest.json

      - name: Validate English audio manifest structure
        run: |
          python scripts/validate_audio_manifest.py /tmp/en-pre-a1-audio-manifest.json
          python scripts/validate_audio_manifest.py /tmp/en-a1-audio-manifest.json
          python scripts/validate_audio_manifest.py /tmp/en-a2-audio-manifest.json
          python scripts/validate_audio_manifest.py /tmp/en-b1-audio-manifest.json
          python scripts/validate_audio_manifest.py /tmp/en-b2-audio-manifest.json
          python scripts/validate_audio_manifest.py /tmp/en-c1-audio-manifest.json
          python scripts/validate_audio_manifest.py /tmp/en-c2-audio-manifest.json
