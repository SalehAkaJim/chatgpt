name: Generate Italian Pre-A1

on:
  push:
    branches: [main]
    paths: ['.github/italian-prea1-batch-trigger']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: italian-prea1-content-generation-v2
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt

      - name: Generate authored Italian Pre-A1 base
        run: python scripts/generate_italian_prea1_batch.py

      - name: Add audited real-world capabilities
        run: python scripts/upgrade_italian_prea1_cefr.py

      - name: Validate Italian Pre-A1 production
        run: |
          set -euo pipefail
          test -n "$(find content/production/it/Pre-A1 -maxdepth 1 -name '*.json' -print -quit)"
          for f in content/production/it/Pre-A1/*.json; do
            python scripts/validate_content.py "$f"
          done
          python scripts/audit_prea1_cefr_readiness.py
          python scripts/validate_character_cast.py --cast audio/cast/it-IT.json
          python database/import/it/pre_a1.py --dry-run

      - name: Dynamic educational summary
        run: |
          python - <<'PY'
          import collections, json
          from pathlib import Path

          paths = sorted(Path('content/production/it/Pre-A1').glob('*.json'))
          if not paths:
              raise SystemExit('No Italian Pre-A1 production files found')

          counts = collections.Counter()
          lessons = set()
          units = set()
          exercise_types = collections.Counter()
          duplicate_units = []

          for path in paths:
              batch = json.loads(path.read_text(encoding='utf-8'))
              unit = batch.get('curriculum_unit')
              if unit in units:
                  duplicate_units.append(unit)
              units.add(unit)
              for item in batch.get('items', []):
                  counts[item.get('kind')] += 1
                  data = item.get('data', {})
                  lesson_key = data.get('lesson_key')
                  if lesson_key:
                      lessons.add(lesson_key)
                  if item.get('kind') == 'exercise':
                      exercise_types[data.get('exercise_type')] += 1

          if duplicate_units:
              raise SystemExit(f'Duplicate curriculum units: {duplicate_units}')

          print(json.dumps({
              'policy': 'coverage-driven; no fixed target counts',
              'units_discovered': len(units),
              'lessons_discovered': len(lessons),
              'item_counts': dict(counts),
              'exercise_types': dict(exercise_types),
          }, ensure_ascii=False, indent=2))
          PY

      - name: Commit Italian Pre-A1 production content
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/specs/it/Pre-A1/batch-01.json content/production/it/Pre-A1
          if ! git diff --cached --quiet; then
            git commit -m 'Upgrade Italian Pre-A1 real-world readiness [skip ci]'
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then exit 0; fi
              sleep $((attempt * 2))
            done
            echo 'Unable to push Italian Pre-A1 content after 5 attempts.' >&2
            exit 1
          fi
