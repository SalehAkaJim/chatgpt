name: Generate Turkish A1 Batch

on:
  push:
    branches: [main]
    paths: ['.github/turkish-a1-batch-trigger']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: turkish-a1-content-generation-v3
  cancel-in-progress: false

jobs:
  generate-batch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Generate Turkish A1 batch 3
        run: python scripts/generate_turkish_a1_batch.py --spec content/specs/tr/A1/batch-03.json
      - name: Validate cumulative Turkish A1 production
        run: |
          set -euo pipefail
          test "$(find content/production/tr/A1 -maxdepth 1 -name '*.json' | wc -l)" -eq 30
          for f in content/production/tr/A1/*.json; do python scripts/validate_content.py "$f"; done
          python scripts/validate_character_cast.py --cast audio/cast/tr-TR.json
          python database/import/tr/a1.py --dry-run
      - name: Cumulative educational QA
        run: |
          python - <<'PY'
          import collections,json,re
          from pathlib import Path
          counts=collections.Counter(); lessons=set(); ordered=[]; seen_lesson_pairs=set(); unit_count=0
          dialogue_texts=[]
          for spec_path in sorted(Path('content/specs/tr/A1').glob('batch-*.json')):
              spec=json.loads(spec_path.read_text())
              for unit in spec['units']:
                  unit_count += 1
                  p=Path('content/production/tr/A1') / f"a1-tr-{unit['slug']}-v1.json"
                  b=json.loads(p.read_text())
                  dialogues=[]
                  for item in b['items']:
                      counts[item['kind']]+=1
                      lk=item.get('data',{}).get('lesson_key')
                      if lk: lessons.add(lk)
                      if item['kind']=='dialogue': dialogues.append(item)
                  for item in sorted(dialogues,key=lambda x:x['data']['lesson_key']):
                      lk=item['data']['lesson_key']; chars=tuple(item['data'].get('characters',[])[:2])
                      key=(lk,frozenset(chars))
                      assert key not in seen_lesson_pairs, f'duplicate dialogue pair in lesson: {lk} {chars}'
                      seen_lesson_pairs.add(key); ordered.append((lk,chars))
                      norm=' '.join(' '.join(re.sub(r'[^\w\s]',' ',t.get('text','').lower(),flags=re.UNICODE).split()) for t in item['data'].get('turns',[]))
                      dialogue_texts.append((lk,norm))
          assert unit_count==30, unit_count
          assert len(lessons)==60, len(lessons)
          for (plk,previous),(clk,current) in zip(ordered,ordered[1:]):
              assert set(previous)!=set(current), f'consecutive dialogue pair repeated: {plk} -> {clk}: {previous}'
          for (plk,prev),(clk,cur) in zip(dialogue_texts,dialogue_texts[1:]):
              assert prev != cur, f'consecutive normalized dialogue repeated: {plk} -> {clk}'
          assert counts['concept']==180 and counts['utterance']==120 and counts['dialogue']==60 and counts['exercise']==300, counts
          print(json.dumps({'units':unit_count,'lessons':len(lessons),'counts':dict(counts),'dialogues':len(ordered)},ensure_ascii=False,indent=2))
          PY
      - name: Commit Turkish A1 batch 3 production content
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/specs/tr/A1/batch-03.json content/production/tr/A1
          if git diff --cached --quiet; then echo 'No generated content changes.'; else
            git commit -m 'Generate Turkish A1 batch 3 production content [skip ci]'
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then exit 0; fi
              sleep $((attempt * 2))
            done
            exit 1
          fi
