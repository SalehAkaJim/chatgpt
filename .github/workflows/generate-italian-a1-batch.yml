name: Generate Italian C1 Batch
on:
  push:
    branches: [main]
    paths: ['.github/italian-c1-batch-trigger']
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: italian-c1-content-generation-v1, cancel-in-progress: false}
jobs:
  generate-batch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt
      - name: Generate Italian C1 batch 1
        run: python scripts/generate_italian_c1_batch.py
      - name: Validate complete Italian C1 batch
        run: |
          set -euo pipefail
          test "$(find content/production/it/C1 -maxdepth 1 -name '*.json' | wc -l)" -eq 10
          for f in content/production/it/C1/*.json; do python scripts/validate_content.py "$f"; done
          python scripts/validate_character_cast.py --cast audio/cast/it-IT.json
          python database/import/it/c1.py --dry-run
      - name: Educational batch summary
        run: |
          python - <<'PY'
          import collections,json
          from pathlib import Path
          counts=collections.Counter(); lessons=set(); ordered=[]; pairs=[]
          spec=json.loads(Path('content/specs/it/C1/batch-01.json').read_text())
          for unit in spec['units']:
              b=json.loads((Path('content/production/it/C1')/f"c1-it-{unit['slug']}-v1.json").read_text()); ds=[]
              for item in b['items']:
                  counts[item['kind']]+=1; lk=item.get('data',{}).get('lesson_key')
                  if lk: lessons.add(lk)
                  if item['kind']=='dialogue': ds.append(item)
              for item in sorted(ds,key=lambda x:x['data']['lesson_key']):
                  pair=tuple(item['data'].get('characters',[])[:2]); ordered.append(pair); pairs.append((item['data']['lesson_key'],pair))
          assert len(lessons)==20,len(lessons)
          assert len(set(pairs))==len(pairs)
          for p,c in zip(ordered,ordered[1:]): assert set(p)!=set(c),f'consecutive dialogue pair repeated: {p}'
          assert counts['concept']==60 and counts['lexeme']==60 and counts['word_form']==60 and counts['utterance']==40 and counts['dialogue']==20 and counts['exercise']==100,counts
          print(json.dumps({'units':10,'lessons':len(lessons),'counts':dict(counts)},ensure_ascii=False))
          PY
      - name: Commit production
        run: |
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'; git add content/production/it/C1
          if ! git diff --cached --quiet; then git commit -m 'Generate Italian C1 batch 1 production content [skip ci]'; git fetch origin main; git rebase origin/main; git push origin HEAD:main; fi
