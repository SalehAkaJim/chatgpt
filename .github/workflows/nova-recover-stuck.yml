name: Nova Recover Stuck Production

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nova-recover-stuck.yml'

permissions:
  actions: write
  contents: read

jobs:
  cancel-stuck-run:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel stale Nova production run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel 34375589687 --repo SalehAkaJim/chatgpt
