name: Upgrade completed Pre-A1 courses to real-world CEFR readiness

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/prea1-cefr-upgrade-trigger'

permissions:
  contents: write

concurrency:
  group: prea1-cefr-upgrade
  cancel-in-progress: false

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate CEFR real-world Pre-A1 upgrade
        run: |
          python scripts/upgrade_prea1_cefr.py
          # Normalize generated SQL formatting so the deterministic generator also
          # satisfies repository whitespace policy.
          sed -i 's/[[:space:]]\+$//' \
            database/seed/english-prea1-curriculum.sql \
            database/seed/german-prea1-curriculum.sql \
            database/seed/turkish-prea1-curriculum.sql \
            database/seed/korean-prea1-curriculum.sql

      - name: Validate every completed Pre-A1 batch
        run: |
          set -euo pipefail
          for lang in en de tr ko; do
            for f in content/production/${lang}/Pre-A1/*.json; do
              python scripts/validate_content.py "$f"
            done
          done
          python scripts/audit_prea1_cefr_readiness.py
          git diff --check

      - name: Verify new unit files exist
        run: |
          set -euo pipefail
          for lang in en de tr ko; do
            test -f "content/production/${lang}/Pre-A1/prea1-${lang}-about-me-v1.json"
            test -f "content/production/${lang}/Pre-A1/prea1-${lang}-real-life-numbers-v1.json"
            test -f "content/production/${lang}/Pre-A1/prea1-${lang}-forms-signs-v1.json"
            test -f "content/production/${lang}/Pre-A1/prea1-${lang}-real-world-gate-v1.json"
          done

      - name: Commit generated curriculum upgrade
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            content/production/en/Pre-A1 \
            content/production/de/Pre-A1 \
            content/production/tr/Pre-A1 \
            content/production/ko/Pre-A1 \
            database/seed/english-prea1-curriculum.sql \
            database/seed/german-prea1-curriculum.sql \
            database/seed/turkish-prea1-curriculum.sql \
            database/seed/korean-prea1-curriculum.sql
          if git diff --cached --quiet; then
            echo 'No generated Pre-A1 changes.'
            exit 0
          fi
          git commit -m 'Expand completed Pre-A1 courses to real-world CEFR readiness'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1
