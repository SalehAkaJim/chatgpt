name: Finalize German Pre-A1 and A1 Content

on:
  push:
    branches:
      - language/german-a1
    paths:
      - '.staging/german/finalize-v3-trigger'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout German branch
        uses: actions/checkout@v4
        with:
          ref: language/german-a1
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rebuild generator from staged bundle
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, bz2
          parts=sorted(Path('.staging/german').glob('v3.*'))
          if not parts:
              raise SystemExit('No v3 payload parts')
          encoded=''.join(p.read_text().strip() for p in parts)
          raw=bz2.decompress(base64.b64decode(encoded))
          out=Path('/tmp/generate_german_beginner.py')
          out.write_bytes(raw)
          print('parts=',len(parts),'generator_bytes=',len(raw))
          PY

      - name: Generate complete German beginner content
        run: python /tmp/generate_german_beginner.py --repo-root .

      - name: Install validation dependencies
        run: pip install -r requirements.txt

      - name: Validate all 40 German beginner units
        run: |
          set -euo pipefail
          python scripts/audit_german_beginner_content.py
          for f in content/production/de/Pre-A1/*.json content/production/de/A1/*.json; do
            echo "===== $f ====="
            python scripts/validate_content.py "$f"
          done
          python database/import/de/pre_a1.py --dry-run
          python database/import/de/a1.py --dry-run

      - name: Verify strict audio manifests can be built
        run: |
          mkdir -p /tmp/german-manifests
          python scripts/build_audio_manifest.py content/production/de/Pre-A1 \
            --level Pre-A1 --locale de-DE --strict-characters \
            --output /tmp/german-manifests/Pre-A1.json
          python scripts/build_audio_manifest.py content/production/de/A1 \
            --level A1 --locale de-DE --strict-characters \
            --output /tmp/german-manifests/A1.json
          python - <<'PY'
          import json
          from pathlib import Path
          for p in Path('/tmp/german-manifests').glob('*.json'):
              d=json.loads(p.read_text())
              print(p.name, 'audio_items=', len(d['items']), 'missing_profiles=', d['missing_character_profiles'])
              if d['missing_character_profiles']:
                  raise SystemExit(1)
          PY

      - name: Commit finalized source content
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+SalehAkaJim@users.noreply.github.com'
          git add \
            content/production/de/Pre-A1 \
            content/production/de/A1 \
            database/seed/german-prea1-curriculum.sql \
            database/import/de/pre_a1.py \
            scripts/audit_german_beginner_content.py \
            .github/workflows/mysql-german-a1-integration.yml \
            .github/workflows/generate-german-audio.yml
          git rm -r .staging/german
          git rm .github/workflows/finalize-german-beginner.yml
          git commit -m 'Complete German Pre-A1 and A1 production content'
          git fetch origin language/german-a1
          git rebase origin/language/german-a1
          git push origin HEAD:language/german-a1
