name: Finalize German Pre-A1 and A1 Content

on:
  push:
    branches:
      - language/german-a1
    paths:
      - '.staging/german/finalize-v3-trigger'

permissions:
  contents: write

concurrency:
  group: finalize-german-prea1-a1
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout German branch
        uses: actions/checkout@v4
        with:
          ref: language/german-a1
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Reconstruct verified generator
        shell: bash
        run: |
          set -euo pipefail
          cat .staging/german/genv3.00 > /tmp/generate_german_beginner.py
          base64 --decode .staging/german/genv3p1.b64 | bunzip2 >> /tmp/generate_german_beginner.py
          cat \
            .staging/german/genv3.02 \
            .staging/german/genv3.03 >> /tmp/generate_german_beginner.py
          cat \
            .staging/german/genv3r.00 \
            .staging/german/genv3r.01 \
            .staging/german/genv3r.02 \
            | base64 --decode | bunzip2 >> /tmp/generate_german_beginner.py
          actual=$(sha256sum /tmp/generate_german_beginner.py | awk '{print $1}')
          expected='4e26a45160464f7f5b7dcec33319419870d5a098ee2d8d1c7c648e9cc0f3d652'
          echo "generator sha256=$actual"
          test "$actual" = "$expected"

      - name: Generate complete German beginner content
        run: python /tmp/generate_german_beginner.py --repo-root .

      - name: Install validation dependencies
        run: pip install -r requirements.txt

      - name: Validate all 40 German beginner units
        shell: bash
        run: |
          set -euo pipefail
          python scripts/audit_german_beginner_content.py
          test "$(find content/production/de/Pre-A1 -maxdepth 1 -name '*.json' | wc -l)" -eq 10
          test "$(find content/production/de/A1 -maxdepth 1 -name '*.json' | wc -l)" -eq 30
          for f in content/production/de/Pre-A1/*.json content/production/de/A1/*.json; do
            echo "===== $f ====="
            python scripts/validate_content.py "$f"
          done
          python database/import/de/pre_a1.py --dry-run
          python database/import/de/a1.py --dry-run

      - name: Verify strict German audio manifests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/german-manifests
          python scripts/build_audio_manifest.py content/production/de/Pre-A1 \
            --level Pre-A1 --locale de-DE --strict-characters \
            --output /tmp/german-manifests/Pre-A1.json
          python scripts/build_audio_manifest.py content/production/de/A1 \
            --level A1 --locale de-DE --strict-characters \
            --output /tmp/german-manifests/A1.json
          python - <<'PY'
          import json
          from pathlib import Path
          total=0
          for p in sorted(Path('/tmp/german-manifests').glob('*.json')):
              d=json.loads(p.read_text())
              if d.get('missing_character_profiles'):
                  raise SystemExit(f"missing character profiles in {p}: {d['missing_character_profiles']}")
              total += len(d['items'])
              print(p.name, 'audio_items=', len(d['items']))
          print('total_audio_items=', total)
          PY

      - name: Commit finalized non-workflow files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+SalehAkaJim@users.noreply.github.com'
          git add \
            content/production/de/Pre-A1 \
            content/production/de/A1 \
            database/seed/german-prea1-curriculum.sql \
            database/import/de/pre_a1.py \
            scripts/audit_german_beginner_content.py
          git rm -r .staging/german
          git rm -f \
            content/specs/de/write-test.txt \
            content/specs/de/prea1-test.json \
            content/specs/de/fa-test.json \
            content/specs/de/blob-test.txt || true
          git commit -m 'Complete German Pre-A1 and A1 production content'
          git push origin HEAD:language/german-a1
