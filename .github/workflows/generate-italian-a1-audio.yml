name: Generate Italian B1 Audio
on:
  push:
    branches: [main]
    paths: ['.github/italian-b1-audio-trigger']
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: italian-b1-audio-generation-v1, cancel-in-progress: false}
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      CONTENT_TTS_CONCURRENCY: '2'
      ELEVENLABS_MODEL_ID: eleven_multilingual_v2
      ELEVENLABS_DIALOGUE_MODEL_ID: eleven_multilingual_v2
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt
      - name: Require ElevenLabs connection
        run: test -n "${ELEVENLABS_API_KEY:-}" || exit 2
      - name: Final Italian content validation before paid generation
        run: |
          set -euo pipefail; test "$(find content/production/it/B1 -maxdepth 1 -name '*.json' | wc -l)" -eq 10
          for f in content/production/it/B1/*.json; do python scripts/validate_content.py "$f"; done
          python scripts/validate_character_cast.py --cast audio/cast/it-IT.json
          python database/import/it/b1.py --dry-run
      - name: Build strict Italian B1 manifest
        run: |
          mkdir -p audio/manifests/it
          python scripts/build_audio_manifest.py content/production/it/B1 --level B1 --locale it-IT --strict-characters --output audio/manifests/it/B1.json
      - name: Resolve and lock every required Italian voice without TTS
        run: python scripts/resolve_audio_voices.py audio/manifests/it/B1.json --write-lock
      - name: Validate manifest and voice lock before paid generation
        run: |
          python scripts/validate_audio_manifest.py audio/manifests/it/B1.json
          python scripts/audit_voice_lock.py --lock audio/voices/it-IT.lock.json --registry audio/voices/it-IT.json --strict
      - name: Generate all Italian B1 production audio
        run: python scripts/generate_audio.py audio/manifests/it/B1.json --confirm-paid-generation --concurrency 2
      - name: Validate generated Italian audio and voice consistency
        run: |
          python scripts/validate_audio_manifest.py audio/manifests/it/B1.json --require-generated
          python scripts/audit_audio_voice_consistency.py audio/manifests/it/B1.json --lock-file audio/voices/it-IT.lock.json
      - name: Export database relative-path SQL
        run: python scripts/export_audio_sql.py audio/manifests/it/B1.json --status validated --output database/import/it/b1_audio.sql
      - name: Verify expected audio categories and files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('audio/manifests/it/B1.json').read_text()); counts={}
          for x in d['items']: counts[x['category']]=counts.get(x['category'],0)+1
          expected={'dialogues':80,'lexical':60,'utterances':40}
          if counts!=expected: raise SystemExit(f'Unexpected category counts: expected={expected}, actual={counts}')
          if len(d['items'])!=180: raise SystemExit(f'Expected 180 manifest items, found {len(d["items"])}')
          roots=[Path(x['relative_path']) for x in d['items']]
          missing=[str(p) for p in roots if not p.exists()]
          if missing: raise SystemExit(f'Missing generated files: {len(missing)}')
          if len(set(map(str,roots))) != 180: raise SystemExit('Manifest relative paths are not unique')
          print(json.dumps({'items':len(d['items']),'categories':counts,'files':len(roots)},ensure_ascii=False))
          PY
      - name: Commit generated Italian B1 audio and DB link files
        run: |
          set -euo pipefail; git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audio/generated/it-IT audio/manifests/it/B1.json audio/voices/it-IT.lock.json database/import/it/b1_audio.sql
          if ! git diff --cached --quiet; then git commit -m 'Generate Italian B1 production audio [skip ci]'; git fetch origin main; git rebase origin/main; git push origin HEAD:main; fi
