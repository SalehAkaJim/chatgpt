name: Build English B2 Batch

on:
  push:
    branches: [main]
    paths:
      - 'scripts/generate_b2_batch.py'
      - 'database/seed/english-b2-curriculum.sql'
      - '.github/workflows/build-b2-batch.yml'
      - '.github/b2-generation-trigger'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-english-b2-batch
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate B2 batch
        run: python scripts/generate_b2_batch.py

      - name: Validate all B2 production batches
        run: |
          for f in content/production/en/B2/*.json; do
            python scripts/validate_content.py "$f"
          done

      - name: Verify generated B2 coverage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('content/production/en/B2')
          expected = [
              'b2-catching-up-with-detail',
              'b2-detailed-personal-stories',
              'b2-causes-consequences',
              'b2-habits-trends-change',
              'b2-experiences-achievements',
          ]
          found = {}
          for f in p.glob('*.json'):
              d = json.loads(f.read_text(encoding='utf-8'))
              found[d['curriculum_unit']] = f.name
          missing = [u for u in expected if u not in found]
          if missing:
              raise SystemExit('Missing B2 production units: ' + ', '.join(missing))
          print(f'B2 production coverage: {len(found)}/45; first batch complete')
          PY

      - name: Commit generated production batches
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/production/en/B2
          if git diff --cached --quiet; then
            echo 'No B2 content changes to commit.'
            exit 0
          fi
          git commit -m 'Add English B2 units 01-05 [skip ci]'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
