name: Nova Content Factory Test

on:
  push:
    branches: [test/content-factory-from-lesson-1]
    paths:
      - '.github/workflows/nova-content-factory-test.yml'
      - 'nova/experiments/content-factory-from-lesson-1/**'
      - 'nova/courses/en-fa/lessons/**/lesson.source.json'
      - 'nova/_assistant/content-system-v1/04_language_data.md'
      - 'nova/_assistant/content-system-v1/lesson.source.schema.json'
      - 'nova/_assistant/content-system-v1/tools/compile_lesson_sql.py'
      - 'nova/_assistant/content-system-v1/tools/factory_probe.py'
      - 'nova/_assistant/content-system-v1/tools/generate_audio.py'
      - 'nova/_assistant/content-system-v1/tools/language_units.py'
      - 'nova/_assistant/content-system-v1/tools/migrate_word_units.py'
      - 'nova/_assistant/content-system-v1/tools/test_factory_design.py'
      - 'nova/_assistant/content-system-v1/tools/validate_factory_design.py'
      - 'nova/_assistant/content-system-v1/tools/validate_factory_prefix.py'
      - 'nova/_assistant/content-system-v1/tools/validate_lesson_reference.py'
      - 'nova/reference/en-fa/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nova-content-factory-test
  cancel-in-progress: false

jobs:
  test-prefix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/content-factory-from-lesson-1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validator dependencies
        run: pip install -r nova/_assistant/content-system-v1/tools/requirements.txt
      - name: Unit test word and factory design rules
        working-directory: nova/_assistant/content-system-v1/tools
        run: python -m unittest -v test_factory_design.py
      - name: Remove non-word teaching units from word layer
        run: |
          python nova/_assistant/content-system-v1/tools/migrate_word_units.py \
            --repo-root . \
            --config nova/experiments/content-factory-from-lesson-1/probe_config.json \
            --report nova/experiments/content-factory-from-lesson-1/word_unit_migration.json
      - name: Build compact A1 reference probe
        run: |
          python nova/_assistant/content-system-v1/tools/factory_probe.py \
            --repo-root . \
            --config nova/experiments/content-factory-from-lesson-1/probe_config.json \
            --output nova/experiments/content-factory-from-lesson-1/reference_probe.json
      - name: Validate generated factory prefix
        id: prefix
        continue-on-error: true
        run: |
          python nova/_assistant/content-system-v1/tools/validate_factory_prefix.py \
            --repo-root . \
            --config nova/experiments/content-factory-from-lesson-1/probe_config.json \
            --output nova/experiments/content-factory-from-lesson-1/prefix_validation.json
      - name: Compile every generated Lesson without audio
        run: |
          python - <<'PY'
          import json
          import pathlib
          import subprocess

          root = pathlib.Path('.')
          config = json.loads((root / 'nova/experiments/content-factory-from-lesson-1/probe_config.json').read_text())
          course = root / 'nova/courses/en-fa/course.source.json'
          out = pathlib.Path('/tmp/nova-factory-sql')
          out.mkdir(parents=True, exist_ok=True)
          for number in config['generatedLessons']:
              lesson = root / f'nova/courses/en-fa/lessons/{int(number):04d}/lesson.source.json'
              target = out / f'{int(number):04d}.sql'
              subprocess.run([
                  'python',
                  'nova/_assistant/content-system-v1/tools/compile_lesson_sql.py',
                  str(course), str(lesson), '-o', str(target)
              ], check=True)
          print(f'Compiled {len(config["generatedLessons"])} Lessons with strict word/lexeme semantics.')
          PY
      - name: Commit canonical cleanup and experiment evidence
        if: always()
        run: |
          git config user.name "nova-factory-test-bot"
          git config user.email "nova-factory-test-bot@users.noreply.github.com"
          git add nova/courses/en-fa/lessons/*/lesson.source.json nova/experiments/content-factory-from-lesson-1/
          if git diff --cached --quiet; then
            echo "No factory changes."
          else
            git commit -m "Apply Nova word-unit cleanup and refresh factory evidence"
            git fetch origin test/content-factory-from-lesson-1
            git rebase origin/test/content-factory-from-lesson-1
            git push origin HEAD:test/content-factory-from-lesson-1
          fi
      - name: Enforce factory prefix result
        if: steps.prefix.outcome == 'failure'
        run: |
          cat nova/experiments/content-factory-from-lesson-1/prefix_validation.json
          exit 2
