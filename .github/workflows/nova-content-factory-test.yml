name: Nova Production Promotion Test

on:
  push:
    branches: [test/content-factory-from-lesson-1]
    paths:
      - '.github/workflows/nova-content-factory-test.yml'
      - '.github/workflows/nova-pilot.yml'
      - '.github/workflows/nova-reference-sync.yml'
      - '.github/workflows/nova-language-reference-sync.yml'
      - 'nova/curriculum/**'
      - 'nova/courses/en-fa/lessons/**/lesson.source.json'
      - 'nova/courses/en-fa/lessons/**/language.plan.json'
      - 'nova/_assistant/content-system-v1/04_language_data.md'
      - 'nova/_assistant/content-system-v1/lesson.source.schema.json'
      - 'nova/_assistant/content-system-v1/tools/**'
      - 'nova/reference/en-fa/**'
      - 'nova/reference-snapshots/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nova-production-promotion-test
  cancel-in-progress: false

jobs:
  test-production-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/content-factory-from-lesson-1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validator dependencies
        run: pip install -r nova/_assistant/content-system-v1/tools/requirements.txt
      - name: Unit test word and factory design rules
        run: PYTHONPATH=nova/_assistant/content-system-v1/tools python -m unittest -v test_factory_design
      - name: Build production language plans and next curriculum spec
        run: |
          python nova/_assistant/content-system-v1/tools/run_curriculum_pipeline.py \
            --repo-root . \
            --course en-fa \
            --config nova/curriculum/en-fa/factory.config.json \
            --workspace-dir nova/curriculum/en-fa
      - name: Validate production canonical Lesson prefix
        id: prefix
        continue-on-error: true
        run: |
          python nova/_assistant/content-system-v1/tools/validate_factory_prefix.py \
            --repo-root . \
            --config nova/curriculum/en-fa/factory.config.json \
            --output nova/curriculum/en-fa/factory_validation.json
      - name: Compile every auto-discovered Lesson without audio
        run: |
          PYTHONPATH=nova/_assistant/content-system-v1/tools python - <<'PY'
          import pathlib, subprocess
          from factory_config import discover_lesson_numbers
          root = pathlib.Path('.').resolve()
          numbers = discover_lesson_numbers(root, 'en-fa')
          course = root / 'nova/courses/en-fa/course.source.json'
          out = pathlib.Path('/tmp/nova-production-sql')
          out.mkdir(parents=True, exist_ok=True)
          for number in numbers:
              lesson = root / f'nova/courses/en-fa/lessons/{number:04d}/lesson.source.json'
              target = out / f'{number:04d}.sql'
              subprocess.run([
                  'python', 'nova/_assistant/content-system-v1/tools/compile_lesson_sql.py',
                  str(course), str(lesson), '-o', str(target)
              ], check=True)
          print(f'Compiled {len(numbers)} production Lessons with strict word/lexeme semantics.')
          PY
      - name: Commit production curriculum evidence on promotion branch
        if: always()
        run: |
          git config user.name "nova-production-promotion-bot"
          git config user.email "nova-production-promotion-bot@users.noreply.github.com"
          git add nova/courses/en-fa/lessons/*/language.plan.json nova/curriculum/en-fa/
          if git diff --cached --quiet; then
            echo "No production curriculum evidence changes."
          else
            git commit -m "Refresh Nova production curriculum evidence"
            git fetch origin test/content-factory-from-lesson-1
            git rebase origin/test/content-factory-from-lesson-1
            git push origin HEAD:test/content-factory-from-lesson-1
          fi
      - name: Enforce production prefix result
        if: steps.prefix.outcome == 'failure'
        run: |
          cat nova/curriculum/en-fa/factory_validation.json
          exit 2
