name: Generate Turkish A2 Curriculum

on:
  push:
    branches: [main]
    paths: ['.github/turkish-a2-batch-trigger']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: turkish-a2-content-generation-v2
  cancel-in-progress: false

jobs:
  generate-curriculum:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate all authored Turkish A2 batches with legacy retrofits
        run: python scripts/generate_turkish_a2_with_retrofits.py

      - name: Validate cumulative Turkish A2 content
        run: |
          set -euo pipefail
          for f in content/production/tr/A2/*.json; do
            python scripts/validate_content.py "$f"
          done
          python scripts/validate_character_cast.py --cast audio/cast/tr-TR.json
          python database/import/tr/a2.py --dry-run

      - name: Coverage-driven educational checks
        run: |
          python - <<'PY'
          import collections, json
          from pathlib import Path

          specs=[]
          for p in sorted(Path('content/specs/tr/A2').glob('batch-*.json')):
              payload=json.loads(p.read_text(encoding='utf-8'))
              for u in payload.get('units',[]):
                  specs.append((int(payload['batch']),u))
          authored={f"a2-tr-{u['slug']}" for _,u in specs}
          if len(authored) != len(specs):
              raise SystemExit('duplicate authored Turkish A2 unit slug')

          files=sorted(Path('content/production/tr/A2').glob('*.json'))
          batches=[json.loads(p.read_text(encoding='utf-8')) for p in files]
          actual={b.get('curriculum_unit') for b in batches}
          if actual != authored:
              raise SystemExit(f'production/spec mismatch; missing={sorted(authored-actual)} extra={sorted(actual-authored)}')

          batch_ids=[b.get('batch_id') for b in batches]
          if len(batch_ids) != len(set(batch_ids)):
              raise SystemExit('duplicate Turkish A2 batch_id')

          report={}
          for b in batches:
              unit=b['curriculum_unit']
              lesson_counts={}
              dialogue_pairs={}
              for item in b.get('items',[]):
                  d=item.get('data',{})
                  lk=d.get('lesson_key')
                  if not lk:
                      continue
                  c=lesson_counts.setdefault(lk,collections.Counter())
                  c[item.get('kind')]+=1
                  if item.get('kind')=='exercise':
                      c['exercise:'+str(d.get('exercise_type'))]+=1
                      if d.get('answer',{}).get('evaluation_mode')=='rubric':
                          c['rubric_output']+=1
                      if d.get('exercise_type')=='writing' and d.get('answer',{}).get('evaluation_mode')=='rubric':
                          c['open_writing']+=1
                      if d.get('exercise_type')=='speaking' and d.get('prompt',{}).get('personalized') is True and d.get('answer',{}).get('evaluation_mode')=='rubric':
                          c['personalized_speaking']+=1
                  if item.get('kind')=='dialogue':
                      speakers=[]
                      for turn in d.get('turns',[]):
                          s=turn.get('speaker')
                          if s and s not in speakers:
                              speakers.append(s)
                      dialogue_pairs[lk]=tuple(sorted(speakers))

              ordered=sorted(lesson_counts)
              if len(ordered) != 3:
                  raise SystemExit(f'{unit}: A2 requires three substantive lessons; got {len(ordered)}')
              for lk in ordered:
                  c=lesson_counts[lk]
                  for required in ('dialogue','exercise:listening','exercise:speaking','exercise:multiple_choice'):
                      if c[required] < 1:
                          raise SystemExit(f'{unit}:{lk}: missing {required}')
              third=lesson_counts[ordered[-1]]
              if third['open_writing'] < 1 or third['personalized_speaking'] < 1 or third['rubric_output'] < 2:
                  raise SystemExit(f'{unit}:{ordered[-1]}: third lesson lacks genuine rubric-based independent production')
              for prev,cur in zip(ordered,ordered[1:]):
                  if dialogue_pairs.get(prev) and dialogue_pairs.get(prev)==dialogue_pairs.get(cur):
                      raise SystemExit(f'{unit}: repeated normalized dialogue pair in consecutive lessons {prev} and {cur}')
              report[unit]={
                  'lessons':len(ordered),
                  'items':len(b.get('items',[])),
                  'third_lesson_open_writing':third['open_writing'],
                  'third_lesson_personalized_speaking':third['personalized_speaking'],
              }
          print(json.dumps({'units':len(report),'details':report},ensure_ascii=False,indent=2))
          PY

      - name: Commit cumulative Turkish A2 production content
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/production/tr/A2
          if git diff --cached --quiet; then
            echo 'No generated content changes.'
          else
            git commit -m 'Generate cumulative Turkish A2 production content [skip ci]'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
