name: English Lexical Linking

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/english-lexical-linking-trigger'
      - 'scripts/build_english_lexical_annotations.py'
      - 'scripts/validate_english_lexical_annotations.py'
      - 'content/production/en/**'

permissions:
  contents: write

concurrency:
  group: english-lexical-linking-v1
  cancel-in-progress: false

jobs:
  build-and-validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Build English lexical span sidecars
        run: python scripts/build_english_lexical_annotations.py

      - name: Validate English lexical span sidecars
        run: python scripts/validate_english_lexical_annotations.py

      - name: Commit generated lexical sidecars and coverage report
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/lexical-links/en reports/english-lexical-linking.json
          if git diff --cached --quiet; then
            echo 'No English lexical annotation changes.'
            exit 0
          fi
          git commit -m 'Generate English lexical span annotations [skip ci]'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
