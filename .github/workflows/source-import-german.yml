name: Import German source content

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/import_coerll_deutsch_im_blick.py'
      - 'scripts/build_german_pre_a1.py'
      - 'sources/de/coerll-deutsch-im-blick/**'
      - 'content/batch.schema.json'
      - '.github/workflows/source-import-german.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install importer dependencies
        run: pip install 'requests>=2.32,<3' 'beautifulsoup4>=4.12,<5' 'jsonschema>=4.23,<5'
      - name: Import publisher-authored German content
        run: python scripts/import_coerll_deutsch_im_blick.py --chapters 1-10
      - name: Build Nova Pre-A1 and A1 mappings
        run: python scripts/build_german_pre_a1.py
      - name: Commit source snapshots and curriculum mappings
        run: |
          if git diff --quiet -- content/production/de/coerll-deutsch-im-blick content/production/de/pre-a1 content/production/de/a1; then
            echo 'No source or curriculum changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/production/de/coerll-deutsch-im-blick content/production/de/pre-a1 content/production/de/a1
          git commit -m 'content(de): build source-only Pre-A1 and A1 [skip ci]'
          git push
