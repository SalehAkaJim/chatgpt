name: Turkish B2 MySQL Integration
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/turkish-b2-mysql-trigger']
jobs:
  mysql-9-import:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:9.0.1
        env: {MYSQL_ROOT_PASSWORD: rootpass, MYSQL_DATABASE: language_learning}
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -prootpass" --health-interval=10s --health-timeout=5s --health-retries=10
    env: {DATABASE_URL: 'mysql://root:rootpass@127.0.0.1:3306/language_learning', MYSQL_PWD: rootpass}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          pip install -r requirements.txt
          sudo apt-get update -qq && sudo apt-get install -y default-mysql-client
      - name: Bootstrap schema and Turkish curriculum
        run: |
          set -euo pipefail
          DB="mysql -h127.0.0.1 -P3306 -uroot language_learning"
          for f in database/schema.sql database/migrations/001_curriculum.sql database/migrations/002_multilingual_core.sql database/migrations/003_lesson_item_lexemes.sql database/migrations/004_level_import_audio.sql database/migrations/005_writing_exercises.sql database/seed/cefr.sql database/seed/languages.sql database/seed/skills-topics.sql database/seed/english-a1-curriculum.sql database/seed/language-variants-courses.sql database/seed/turkish-prea1-curriculum.sql database/seed/turkish-a1-curriculum.sql database/seed/turkish-a2-curriculum.sql database/seed/turkish-b1-curriculum.sql database/seed/turkish-b2-curriculum.sql; do $DB < "$f"; done
      - name: Validate and dry-run Turkish B2
        run: |
          set -euo pipefail
          test "$(find content/production/tr/B2 -maxdepth 1 -name '*.json' | wc -l)" -eq 10
          for f in content/production/tr/B2/*.json; do python scripts/validate_content.py "$f"; done
          python database/import/tr/b2.py --dry-run
      - name: Import Turkish course through B2
        run: |
          python database/import/tr/pre_a1.py --allow-unreviewed
          python database/import/tr/a1.py --allow-unreviewed
          python database/import/tr/a2.py --allow-unreviewed
          python database/import/tr/b1.py --allow-unreviewed
          python database/import/tr/b2.py --allow-unreviewed
      - name: Verify Turkish B2 canonical counts
        run: |
          set -euo pipefail
          q(){ mysql -N -s -h127.0.0.1 -P3306 -uroot language_learning -e "$1"; }
          units=$(q "SELECT COUNT(*) FROM curriculum_units cu JOIN courses c ON c.id=cu.course_id AND c.slug='fa-tr-tr' JOIN cefr_levels lvl ON lvl.id=cu.cefr_level_id AND lvl.code='B2';")
          lessons=$(q "SELECT COUNT(*) FROM lessons le JOIN courses c ON c.id=le.course_id AND c.slug='fa-tr-tr' JOIN cefr_levels lvl ON lvl.id=le.cefr_level_id AND lvl.code='B2';")
          concepts=$(q "SELECT COUNT(DISTINCT li.concept_id) FROM lesson_items li JOIN lessons le ON le.id=li.lesson_id JOIN courses c ON c.id=le.course_id JOIN cefr_levels lvl ON lvl.id=le.cefr_level_id WHERE c.slug='fa-tr-tr' AND lvl.code='B2' AND li.concept_id IS NOT NULL;")
          lexemes=$(q "SELECT COUNT(DISTINCT li.lexeme_id) FROM lesson_items li JOIN lessons le ON le.id=li.lesson_id JOIN courses c ON c.id=le.course_id JOIN cefr_levels lvl ON lvl.id=le.cefr_level_id WHERE c.slug='fa-tr-tr' AND lvl.code='B2' AND li.lexeme_id IS NOT NULL;")
          utterances=$(q "SELECT COUNT(DISTINCT li.utterance_id) FROM lesson_items li JOIN lessons le ON le.id=li.lesson_id JOIN courses c ON c.id=le.course_id JOIN cefr_levels lvl ON lvl.id=le.cefr_level_id WHERE c.slug='fa-tr-tr' AND lvl.code='B2' AND li.utterance_id IS NOT NULL;")
          dialogues=$(q "SELECT COUNT(DISTINCT li.dialogue_id) FROM lesson_items li JOIN lessons le ON le.id=li.lesson_id JOIN courses c ON c.id=le.course_id JOIN cefr_levels lvl ON lvl.id=le.cefr_level_id WHERE c.slug='fa-tr-tr' AND lvl.code='B2' AND li.dialogue_id IS NOT NULL;")
          exercises=$(q "SELECT COUNT(*) FROM exercises e JOIN lessons le ON le.id=e.lesson_id JOIN courses c ON c.id=le.course_id JOIN cefr_levels lvl ON lvl.id=le.cefr_level_id WHERE c.slug='fa-tr-tr' AND lvl.code='B2';")
          echo "units=$units lessons=$lessons concepts=$concepts lexemes=$lexemes utterances=$utterances dialogues=$dialogues exercises=$exercises"
          test "$units" = 10; test "$lessons" = 20; test "$concepts" = 60; test "$lexemes" = 60; test "$utterances" = 40; test "$dialogues" = 20; test "$exercises" = 100
      - name: Verify B2 idempotency
        run: |
          q(){ mysql -N -s -h127.0.0.1 -P3306 -uroot language_learning -e "$1"; }
          snap(){ q "SELECT CONCAT((SELECT COUNT(*) FROM lessons le JOIN courses c ON c.id=le.course_id WHERE c.slug='fa-tr-tr'),'|',(SELECT COUNT(*) FROM exercises e JOIN lessons le ON le.id=e.lesson_id JOIN courses c ON c.id=le.course_id WHERE c.slug='fa-tr-tr'),'|',(SELECT COUNT(*) FROM lesson_items li JOIN lessons le ON le.id=li.lesson_id JOIN courses c ON c.id=le.course_id WHERE c.slug='fa-tr-tr'));"; }
          before=$(snap); python database/import/tr/b2.py --allow-unreviewed; after=$(snap); echo "before=$before after=$after"; test "$before" = "$after"
