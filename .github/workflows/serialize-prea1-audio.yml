name: Serialize Pre-A1 Audio Workflows

on:
  push:
    branches: [main]
    paths:
      - '.github/prea1-audio-serialization-trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  serialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/serialize_prea1_audio_workflows.py
      - name: Commit serialized audio workflows
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/generate-english-audio.yml .github/workflows/generate-german-audio.yml
          if git diff --cached --quiet; then echo 'Already serialized.'; exit 0; fi
          git commit -m 'Serialize English and German Pre-A1 TTS requests'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
