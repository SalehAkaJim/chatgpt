name: MySQL 9.0.1 schema test

on:
  push:
    branches: [main]
    paths:
      - 'database/**'
      - '.github/workflows/mysql-9-0-1.yml'
  workflow_dispatch:

jobs:
  mysql-schema-test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:9.0.1
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: language_app
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify exact MySQL version
        run: |
          set -euo pipefail
          version=$(docker run --rm --network host mysql:9.0.1 mysql -N -s -h127.0.0.1 -uroot -proot -e "SELECT VERSION();")
          echo "Server version: $version"
          test "$version" = "9.0.1"

      - name: Apply schema
        run: |
          set -euo pipefail
          docker run --rm --network host -i mysql:9.0.1 mysql --show-warnings -h127.0.0.1 -uroot -proot language_app < database/schema.sql

      - name: Apply migrations
        run: |
          set -euo pipefail
          shopt -s nullglob
          for f in database/migrations/*.sql; do
            echo "Applying $f"
            docker run --rm --network host -i mysql:9.0.1 mysql --show-warnings -h127.0.0.1 -uroot -proot language_app < "$f"
          done

      - name: Apply reference seed twice
        run: |
          set -euo pipefail
          for i in 1 2; do
            docker run --rm --network host -i mysql:9.0.1 mysql --show-warnings -h127.0.0.1 -uroot -proot language_app < database/seed_reference.sql
          done

      - name: Apply curriculum plans twice
        run: |
          set -euo pipefail
          shopt -s nullglob
          for i in 1 2; do
            for f in database/plans/*.sql; do
              echo "Applying $f"
              docker run --rm --network host -i mysql:9.0.1 mysql --show-warnings -h127.0.0.1 -uroot -proot language_app < "$f"
            done
          done

      - name: Apply content batches twice
        run: |
          set -euo pipefail
          shopt -s nullglob
          for i in 1 2; do
            for f in database/content/*.sql; do
              echo "Applying $f"
              docker run --rm --network host -i mysql:9.0.1 mysql --show-warnings -h127.0.0.1 -uroot -proot language_app < "$f"
            done
          done

      - name: Run QA queries
        run: |
          set -euo pipefail
          docker run --rm --network host -i mysql:9.0.1 mysql --show-warnings -h127.0.0.1 -uroot -proot language_app < database/qa_queries.sql > /tmp/qa-output.txt
          cat /tmp/qa-output.txt

      - name: Validate reference data
        run: |
          set -euo pipefail
          sql() { docker run --rm --network host mysql:9.0.1 mysql -N -s -h127.0.0.1 -uroot -proot language_app -e "$1"; }
          test "$(sql "SELECT COUNT(*) FROM cefr_levels;")" = "7"
          test "$(sql "SELECT COUNT(*) FROM languages;")" = "2"
          test "$(sql "SELECT COUNT(*) FROM language_levels;")" = "14"
          test "$(sql "SELECT COUNT(*) FROM activity_types;")" = "15"
          test "$(sql "SELECT COUNT(*) FROM activity_types WHERE code IN ('form_fill','guided_writing');")" = "2"
          sql "SELECT COUNT(*) FROM v_lesson_activity_counts; SELECT COUNT(*) FROM v_language_level_content_status;"

      - name: Validate German Pre-A1 curriculum map
        run: |
          set -euo pipefail
          sql() { docker run --rm --network host mysql:9.0.1 mysql -N -s -h127.0.0.1 -uroot -proot language_app -e "$1"; }
          test "$(sql "SELECT COUNT(*) FROM curriculum_targets ct JOIN language_levels ll ON ll.id=ct.language_level_id JOIN languages l ON l.id=ll.language_id JOIN cefr_levels c ON c.id=ll.cefr_level_id WHERE l.code='de' AND c.code='Pre-A1' AND ct.is_mandatory=1;")" = "30"
          test "$(sql "SELECT ll.planned_lesson_count FROM language_levels ll JOIN languages l ON l.id=ll.language_id JOIN cefr_levels c ON c.id=ll.cefr_level_id WHERE l.code='de' AND c.code='Pre-A1';")" = "30"
          test "$(sql "SELECT ll.lesson_count_status FROM language_levels ll JOIN languages l ON l.id=ll.language_id JOIN cefr_levels c ON c.id=ll.cefr_level_id WHERE l.code='de' AND c.code='Pre-A1';")" = "provisional"
          test "$(sql "SELECT ll.status FROM language_levels ll JOIN languages l ON l.id=ll.language_id JOIN cefr_levels c ON c.id=ll.cefr_level_id WHERE l.code='de' AND c.code='Pre-A1';")" = "review"
          test "$(sql "SELECT COUNT(*) FROM sources WHERE public_id IN ('src_cefr_2020','src_fsi_de_programmed_intro','src_dli_de_headstart','src_fsi_de_basic','src_tatoeba_de','src_fsi_de_fast','src_dli_de_solt');")" = "7"
          test "$(sql "SELECT COUNT(DISTINCT ct.id) FROM curriculum_targets ct JOIN language_levels ll ON ll.id=ct.language_level_id JOIN languages lang ON lang.id=ll.language_id JOIN cefr_levels c ON c.id=ll.cefr_level_id JOIN lesson_targets lt ON lt.curriculum_target_id=ct.id WHERE lang.code='de' AND c.code='Pre-A1' AND ct.is_mandatory=1;")" = "30"
          test "$(sql "SELECT COUNT(*) FROM curriculum_targets ct JOIN language_levels ll ON ll.id=ct.language_level_id JOIN languages lang ON lang.id=ll.language_id JOIN cefr_levels c ON c.id=ll.cefr_level_id WHERE lang.code='de' AND c.code='Pre-A1' AND ct.is_mandatory=1 AND ct.coverage_status='covered';")" = "30"
          test "$(sql "SELECT COUNT(*) FROM (SELECT l.id,SUM(lt.is_primary=1) n FROM lessons l JOIN language_levels ll ON ll.id=l.language_level_id JOIN languages lang ON lang.id=ll.language_id JOIN cefr_levels c ON c.id=ll.cefr_level_id LEFT JOIN lesson_targets lt ON lt.lesson_id=l.id WHERE lang.code='de' AND c.code='Pre-A1' GROUP BY l.id HAVING n<>1) q;")" = "0"

      - name: Validate complete German Pre-A1 source-backed draft
        run: |
          set -euo pipefail
          sql() { docker run --rm --network host mysql:9.0.1 mysql -N -s -h127.0.0.1 -uroot -proot language_app -e "$1"; }
          test "$(sql "SELECT COUNT(*) FROM lessons l JOIN language_levels ll ON ll.id=l.language_level_id JOIN languages lang ON lang.id=ll.language_id JOIN cefr_levels c ON c.id=ll.cefr_level_id WHERE lang.code='de' AND c.code='Pre-A1';")" = "30"
          test "$(sql "SELECT COUNT(*) FROM lessons l JOIN language_levels ll ON ll.id=l.language_level_id JOIN languages lang ON lang.id=ll.language_id JOIN cefr_levels c ON c.id=ll.cefr_level_id WHERE lang.code='de' AND c.code='Pre-A1' AND l.status='source_checked';")" = "30"
          test "$(sql "SELECT COUNT(DISTINCT l.id) FROM lessons l JOIN language_levels ll ON ll.id=l.language_level_id JOIN languages lang ON lang.id=ll.language_id JOIN cefr_levels c ON c.id=ll.cefr_level_id JOIN lesson_sources ls ON ls.lesson_id=l.id WHERE lang.code='de' AND c.code='Pre-A1';")" = "30"
          test "$(sql "SELECT COUNT(*) FROM activities a JOIN lessons l ON l.id=a.lesson_id JOIN language_levels ll ON ll.id=l.language_level_id JOIN languages lang ON lang.id=ll.language_id JOIN cefr_levels c ON c.id=ll.cefr_level_id WHERE lang.code='de' AND c.code='Pre-A1' AND a.position=1 AND a.type_code='conversation_speaking' AND a.dialogue_id IS NOT NULL;")" = "30"
          test "$(sql "SELECT COUNT(DISTINCT d.id) FROM dialogues d JOIN dialogue_turns dt ON dt.dialogue_id=d.id AND dt.learner_turn=1 WHERE d.public_id BETWEEN 'de_pre_a1_dlg_001' AND 'de_pre_a1_dlg_030';")" = "30"
          all_turns=$(sql "SELECT COUNT(*) FROM dialogue_turns dt JOIN dialogues d ON d.id=dt.dialogue_id WHERE d.public_id BETWEEN 'de_pre_a1_dlg_001' AND 'de_pre_a1_dlg_030';")
          sourced_turns=$(sql "SELECT COUNT(DISTINCT dt.id) FROM dialogue_turns dt JOIN dialogues d ON d.id=dt.dialogue_id JOIN dialogue_turn_sources dts ON dts.dialogue_turn_id=dt.id WHERE d.public_id BETWEEN 'de_pre_a1_dlg_001' AND 'de_pre_a1_dlg_030';")
          test "$sourced_turns" = "$all_turns"
          test "$(sql "SELECT COUNT(*) FROM dialogue_turns dt JOIN dialogues d ON d.id=dt.dialogue_id JOIN characters ch ON ch.id=dt.speaker_character_id WHERE d.public_id BETWEEN 'de_pre_a1_dlg_001' AND 'de_pre_a1_dlg_030' AND dt.speaker_gender_evidence IN ('female','male') AND ch.gender IN ('female','male') AND dt.speaker_gender_evidence<>ch.gender;")" = "0"
          test "$(sql "SELECT COUNT(*) FROM audio_files WHERE status IN ('generated','approved');")" = "0"
          test "$(sql "SELECT coverage_status FROM curriculum_targets WHERE public_id='de_pre_a1_ct_006';")" = "covered"
          test "$(sql "SELECT COUNT(*) FROM activities WHERE type_code='form_fill';")" -ge "1"
          test "$(sql "SELECT COUNT(*) FROM activities WHERE type_code='guided_writing';")" -ge "1"
          counts=$(sql "SELECT GROUP_CONCAT(cnt ORDER BY sequence_number SEPARATOR ',') FROM (SELECT l.sequence_number,COUNT(a.id) cnt FROM lessons l JOIN activities a ON a.lesson_id=l.id WHERE l.sequence_number BETWEEN 26 AND 30 AND l.public_id LIKE 'de_pre_a1_l%' GROUP BY l.id,l.sequence_number) q;")
          test "$counts" = "4,3,3,4,6"

      - name: Validate German Pre-A1 provenance completeness
        run: |
          set -euo pipefail
          sql() { docker run --rm --network host mysql:9.0.1 mysql -N -s -h127.0.0.1 -uroot -proot language_app -e "$1"; }
          activities_missing=$(sql "SELECT COUNT(*) FROM activities a JOIN lessons l ON l.id=a.lesson_id WHERE l.public_id LIKE 'de_pre_a1_l%' AND NOT EXISTS (SELECT 1 FROM activity_sources s WHERE s.activity_id=a.id);")
          items_missing=$(sql "SELECT COUNT(*) FROM activity_items ai JOIN activities a ON a.id=ai.activity_id JOIN lessons l ON l.id=a.lesson_id WHERE l.public_id LIKE 'de_pre_a1_l%' AND NOT EXISTS (SELECT 1 FROM activity_item_sources s WHERE s.activity_item_id=ai.id);")
          lexemes_missing=$(sql "SELECT COUNT(DISTINCT ll.lexeme_id) FROM lesson_lexemes ll JOIN lessons l ON l.id=ll.lesson_id WHERE l.public_id LIKE 'de_pre_a1_l%' AND NOT EXISTS (SELECT 1 FROM lexeme_sources s WHERE s.lexeme_id=ll.lexeme_id);")
          grammar_missing=$(sql "SELECT COUNT(DISTINCT lg.grammar_note_id) FROM lesson_grammar_notes lg JOIN lessons l ON l.id=lg.lesson_id WHERE l.public_id LIKE 'de_pre_a1_l%' AND NOT EXISTS (SELECT 1 FROM grammar_note_sources s WHERE s.grammar_note_id=lg.grammar_note_id);")
          echo "provenance missing activities=$activities_missing items=$items_missing lexemes=$lexemes_missing grammar_notes=$grammar_missing"
          test "$activities_missing" = "0"
          test "$items_missing" = "0"
          test "$lexemes_missing" = "0"
          test "$grammar_missing" = "0"

      - name: Validate conversation flow and activity variety
        run: |
          set -euo pipefail
          sql() { docker run --rm --network host mysql:9.0.1 mysql -N -s -h127.0.0.1 -uroot -proot language_app -e "$1"; }
          test "$(sql "SELECT COUNT(*) FROM activities a JOIN lessons l ON l.id=a.lesson_id JOIN dialogues d ON d.id=a.dialogue_id JOIN dialogue_turns dt ON dt.dialogue_id=d.id AND dt.position=1 WHERE l.public_id LIKE 'de_pre_a1_l%' AND a.position=1 AND dt.learner_turn=1;")" = "0"
          test "$(sql "SELECT COUNT(DISTINCT d.id) FROM activities a JOIN lessons l ON l.id=a.lesson_id JOIN dialogues d ON d.id=a.dialogue_id JOIN dialogue_turns dt ON dt.dialogue_id=d.id WHERE l.public_id LIKE 'de_pre_a1_l%' AND a.position=1 AND dt.learner_turn=1 AND dt.position>1;")" = "30"
          test "$(sql "SELECT COUNT(*) FROM lessons a JOIN lessons b ON b.language_level_id=a.language_level_id AND b.sequence_number=a.sequence_number+1 WHERE a.public_id LIKE 'de_pre_a1_l%' AND b.public_id LIKE 'de_pre_a1_l%' AND a.template_signature=b.template_signature;")" = "0"
          test "$(sql "SELECT COUNT(DISTINCT activity_count) FROM v_lesson_activity_counts WHERE public_id LIKE 'de_pre_a1_l%';")" -ge "4"
          test "$(sql "SELECT MIN(activity_count) FROM v_lesson_activity_counts WHERE public_id LIKE 'de_pre_a1_l%';")" -le "2"
          test "$(sql "SELECT MAX(activity_count) FROM v_lesson_activity_counts WHERE public_id LIKE 'de_pre_a1_l%';")" -ge "5"

      - name: Reject dated or pre-reform German in active Pre-A1 content
        run: |
          set -euo pipefail
          sql() { docker run --rm --network host mysql:9.0.1 mysql -N -s -h127.0.0.1 -uroot -proot language_app -e "$1"; }
          legacy_expr() {
            local value="$1"
            printf "%s" "LOCATE(HEX('fräulein'),HEX(LOWER($value)))>0 OR LOCATE(HEX('d-mark'),HEX(LOWER($value)))>0 OR REGEXP_LIKE($value,'(^|[^A-Za-z])DM([^A-Za-z]|$)','c') OR LOCATE(HEX('heisse'),HEX(LOWER($value)))>0 OR LOCATE(HEX('heissen'),HEX(LOWER($value)))>0 OR LOCATE(HEX('grosse'),HEX(LOWER($value)))>0 OR LOCATE(HEX('schloß'),HEX(LOWER($value)))>0 OR LOCATE(HEX('muß'),HEX(LOWER($value)))>0 OR LOCATE(HEX('daß'),HEX(LOWER($value)))>0 OR LOCATE(HEX('auf deutsch'),HEX($value))>0"
          }
          dialogue_pred=$(legacy_expr 'dt.text_target')
          item_pred=$(legacy_expr "COALESCE(ai.text_target,'')")
          payload_pred=$(legacy_expr 'CAST(COALESCE(a.payload,JSON_OBJECT()) AS CHAR)')
          lexeme_pred=$(legacy_expr 'lx.surface')
          dialogue_count=$(sql "SELECT COUNT(*) FROM dialogue_turns dt JOIN dialogues d ON d.id=dt.dialogue_id WHERE d.public_id LIKE 'de_pre_a1_dlg_%' AND ($dialogue_pred);")
          item_count=$(sql "SELECT COUNT(*) FROM activity_items ai JOIN activities a ON a.id=ai.activity_id JOIN lessons l ON l.id=a.lesson_id WHERE l.public_id LIKE 'de_pre_a1_l%' AND ($item_pred);")
          payload_count=$(sql "SELECT COUNT(*) FROM activities a JOIN lessons l ON l.id=a.lesson_id WHERE l.public_id LIKE 'de_pre_a1_l%' AND ($payload_pred);")
          lexeme_count=$(sql "SELECT COUNT(DISTINCT lx.id) FROM lexemes lx JOIN lesson_lexemes ll ON ll.lexeme_id=lx.id JOIN lessons l ON l.id=ll.lesson_id WHERE l.public_id LIKE 'de_pre_a1_l%' AND ($lexeme_pred);")
          echo "legacy dialogue=$dialogue_count items=$item_count payload=$payload_count active_lexemes=$lexeme_count"
          if [ "$dialogue_count" != "0" ]; then
            sql "SELECT d.public_id,dt.position,dt.text_target FROM dialogue_turns dt JOIN dialogues d ON d.id=dt.dialogue_id WHERE d.public_id LIKE 'de_pre_a1_dlg_%' AND ($dialogue_pred) ORDER BY d.public_id,dt.position;"
          fi
          if [ "$item_count" != "0" ]; then
            sql "SELECT l.public_id,a.public_id,ai.position,ai.text_target FROM activity_items ai JOIN activities a ON a.id=ai.activity_id JOIN lessons l ON l.id=a.lesson_id WHERE l.public_id LIKE 'de_pre_a1_l%' AND ($item_pred) ORDER BY l.sequence_number,a.position,ai.position;"
          fi
          if [ "$payload_count" != "0" ]; then
            sql "SELECT l.public_id,a.public_id,CAST(COALESCE(a.payload,JSON_OBJECT()) AS CHAR) FROM activities a JOIN lessons l ON l.id=a.lesson_id WHERE l.public_id LIKE 'de_pre_a1_l%' AND ($payload_pred) ORDER BY l.sequence_number,a.position;"
          fi
          if [ "$lexeme_count" != "0" ]; then
            sql "SELECT DISTINCT l.public_id,lx.public_id,lx.surface FROM lexemes lx JOIN lesson_lexemes ll ON ll.lexeme_id=lx.id JOIN lessons l ON l.id=ll.lesson_id WHERE l.public_id LIKE 'de_pre_a1_l%' AND ($lexeme_pred) ORDER BY l.public_id,lx.public_id;"
          fi
          test "$dialogue_count" = "0"
          test "$item_count" = "0"
          test "$payload_count" = "0"
          test "$lexeme_count" = "0"
          dated_source_count=$(sql "SELECT COUNT(*) FROM lesson_sources ls JOIN lessons l ON l.id=ls.lesson_id JOIN source_items si ON si.id=ls.source_item_id WHERE l.public_id IN ('de_pre_a1_l023','de_pre_a1_l024','de_pre_a1_l025','de_pre_a1_l026','de_pre_a1_l027') AND si.public_id IN ('srcitem_headstart_m3_u1_restaurant','srcitem_headstart_m6_u1_purchase','srcitem_headstart_m3_u1_menu_visual','srcitem_fast_l9_invitation');")
          echo "dated active source links=$dated_source_count"
          test "$dated_source_count" = "0"

      - name: Check all base tables
        run: |
          set -euo pipefail
          tables=$(docker run --rm --network host mysql:9.0.1 mysql -N -s -h127.0.0.1 -uroot -proot language_app -e "SELECT GROUP_CONCAT(TABLE_NAME SEPARATOR ' ') FROM information_schema.TABLES WHERE TABLE_SCHEMA='language_app' AND TABLE_TYPE='BASE TABLE';")
          test -n "$tables"
          for table in $tables; do
            docker run --rm --network host mysql:9.0.1 mysql -N -s -h127.0.0.1 -uroot -proot language_app -e "CHECK TABLE \`$table\`;" | tee -a /tmp/check-table.txt
          done
          if grep -E $'\terror\t|\tError\t' /tmp/check-table.txt; then
            exit 1
          fi
