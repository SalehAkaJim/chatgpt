name: MySQL 9.0.1 schema test

on:
  push:
    branches: [main]
    paths:
      - 'database/**'
      - '.github/workflows/mysql-9-0-1.yml'
  workflow_dispatch:

jobs:
  mysql-schema-test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:9.0.1
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: language_app
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify exact MySQL version
        run: |
          set -euo pipefail
          version=$(docker run --rm --network host mysql:9.0.1 mysql -N -s -h127.0.0.1 -uroot -proot -e "SELECT VERSION();")
          echo "Server version: $version"
          test "$version" = "9.0.1"

      - name: Apply schema
        run: |
          set -euo pipefail
          docker run --rm --network host -i mysql:9.0.1 mysql --show-warnings -h127.0.0.1 -uroot -proot language_app < database/schema.sql

      - name: Apply migrations
        run: |
          set -euo pipefail
          shopt -s nullglob
          for f in database/migrations/*.sql; do
            echo "Applying $f"
            docker run --rm --network host -i mysql:9.0.1 mysql --show-warnings -h127.0.0.1 -uroot -proot language_app < "$f"
          done

      - name: Apply reference seed twice
        run: |
          set -euo pipefail
          for i in 1 2; do
            docker run --rm --network host -i mysql:9.0.1 mysql --show-warnings -h127.0.0.1 -uroot -proot language_app < database/seed_reference.sql
          done

      - name: Apply curriculum plans twice
        run: |
          set -euo pipefail
          shopt -s nullglob
          for i in 1 2; do
            for f in database/plans/*.sql; do
              echo "Applying $f"
              docker run --rm --network host -i mysql:9.0.1 mysql --show-warnings -h127.0.0.1 -uroot -proot language_app < "$f"
            done
          done

      - name: Apply content batches twice
        run: |
          set -euo pipefail
          shopt -s nullglob
          for i in 1 2; do
            for f in database/content/*.sql; do
              echo "Applying $f"
              docker run --rm --network host -i mysql:9.0.1 mysql --show-warnings -h127.0.0.1 -uroot -proot language_app < "$f"
            done
          done

      - name: Run QA queries
        run: |
          set -euo pipefail
          docker run --rm --network host -i mysql:9.0.1 mysql --show-warnings -h127.0.0.1 -uroot -proot language_app < database/qa_queries.sql > /tmp/qa-output.txt
          cat /tmp/qa-output.txt

      - name: Validate reference data
        run: |
          set -euo pipefail
          sql() { docker run --rm --network host mysql:9.0.1 mysql -N -s -h127.0.0.1 -uroot -proot language_app -e "$1"; }
          test "$(sql "SELECT COUNT(*) FROM cefr_levels;")" = "7"
          test "$(sql "SELECT COUNT(*) FROM languages;")" = "2"
          test "$(sql "SELECT COUNT(*) FROM language_levels;")" = "14"
          test "$(sql "SELECT COUNT(*) FROM activity_types;")" = "15"
          test "$(sql "SELECT COUNT(*) FROM activity_types WHERE code IN ('form_fill','guided_writing');")" = "2"
          sql "SELECT COUNT(*) FROM v_lesson_activity_counts; SELECT COUNT(*) FROM v_language_level_content_status;"

      - name: Validate German Pre-A1 curriculum map
        run: |
          set -euo pipefail
          sql() { docker run --rm --network host mysql:9.0.1 mysql -N -s -h127.0.0.1 -uroot -proot language_app -e "$1"; }
          test "$(sql "SELECT COUNT(*) FROM curriculum_targets ct JOIN language_levels ll ON ll.id=ct.language_level_id JOIN languages l ON l.id=ll.language_id JOIN cefr_levels c ON c.id=ll.cefr_level_id WHERE l.code='de' AND c.code='Pre-A1' AND ct.is_mandatory=1;")" = "30"
          test "$(sql "SELECT ll.planned_lesson_count FROM language_levels ll JOIN languages l ON l.id=ll.language_id JOIN cefr_levels c ON c.id=ll.cefr_level_id WHERE l.code='de' AND c.code='Pre-A1';")" = "30"
          test "$(sql "SELECT ll.lesson_count_status FROM language_levels ll JOIN languages l ON l.id=ll.language_id JOIN cefr_levels c ON c.id=ll.cefr_level_id WHERE l.code='de' AND c.code='Pre-A1';")" = "provisional"
          test "$(sql "SELECT COUNT(*) FROM sources WHERE public_id IN ('src_cefr_2020','src_fsi_de_programmed_intro','src_dli_de_headstart','src_fsi_de_basic','src_tatoeba_de','src_fsi_de_fast','src_dli_de_solt');")" = "7"
          test "$(sql "SELECT COUNT(DISTINCT ct.id) FROM curriculum_targets ct JOIN language_levels ll ON ll.id=ct.language_level_id JOIN languages lang ON lang.id=ll.language_id JOIN cefr_levels c ON c.id=ll.cefr_level_id JOIN lesson_targets lt ON lt.curriculum_target_id=ct.id WHERE lang.code='de' AND c.code='Pre-A1' AND ct.is_mandatory=1;")" = "30"
          test "$(sql "SELECT COUNT(*) FROM (SELECT l.id,SUM(lt.is_primary=1) n FROM lessons l JOIN language_levels ll ON ll.id=l.language_level_id JOIN languages lang ON lang.id=ll.language_id JOIN cefr_levels c ON c.id=ll.cefr_level_id LEFT JOIN lesson_targets lt ON lt.lesson_id=l.id WHERE lang.code='de' AND c.code='Pre-A1' GROUP BY l.id HAVING n<>1) q;")" = "0"

      - name: Validate complete German Pre-A1 source-backed draft
        run: |
          set -euo pipefail
          sql() { docker run --rm --network host mysql:9.0.1 mysql -N -s -h127.0.0.1 -uroot -proot language_app -e "$1"; }
          test "$(sql "SELECT COUNT(*) FROM lessons l JOIN language_levels ll ON ll.id=l.language_level_id JOIN languages lang ON lang.id=ll.language_id JOIN cefr_levels c ON c.id=ll.cefr_level_id WHERE lang.code='de' AND c.code='Pre-A1';")" = "30"
          test "$(sql "SELECT COUNT(*) FROM lessons l JOIN language_levels ll ON ll.id=l.language_level_id JOIN languages lang ON lang.id=ll.language_id JOIN cefr_levels c ON c.id=ll.cefr_level_id WHERE lang.code='de' AND c.code='Pre-A1' AND l.status='source_checked';")" = "30"
          test "$(sql "SELECT COUNT(DISTINCT l.id) FROM lessons l JOIN language_levels ll ON ll.id=l.language_level_id JOIN languages lang ON lang.id=ll.language_id JOIN cefr_levels c ON c.id=ll.cefr_level_id JOIN lesson_sources ls ON ls.lesson_id=l.id WHERE lang.code='de' AND c.code='Pre-A1';")" = "30"
          test "$(sql "SELECT COUNT(*) FROM activities a JOIN lessons l ON l.id=a.lesson_id JOIN language_levels ll ON ll.id=l.language_level_id JOIN languages lang ON lang.id=ll.language_id JOIN cefr_levels c ON c.id=ll.cefr_level_id WHERE lang.code='de' AND c.code='Pre-A1' AND a.position=1 AND a.type_code='conversation_speaking' AND a.dialogue_id IS NOT NULL;")" = "30"
          test "$(sql "SELECT COUNT(DISTINCT d.id) FROM dialogues d JOIN dialogue_turns dt ON dt.dialogue_id=d.id AND dt.learner_turn=1 WHERE d.public_id BETWEEN 'de_pre_a1_dlg_001' AND 'de_pre_a1_dlg_030';")" = "30"
          all_turns=$(sql "SELECT COUNT(*) FROM dialogue_turns dt JOIN dialogues d ON d.id=dt.dialogue_id WHERE d.public_id BETWEEN 'de_pre_a1_dlg_001' AND 'de_pre_a1_dlg_030';")
          sourced_turns=$(sql "SELECT COUNT(DISTINCT dt.id) FROM dialogue_turns dt JOIN dialogues d ON d.id=dt.dialogue_id JOIN dialogue_turn_sources dts ON dts.dialogue_turn_id=dt.id WHERE d.public_id BETWEEN 'de_pre_a1_dlg_001' AND 'de_pre_a1_dlg_030';")
          test "$sourced_turns" = "$all_turns"
          test "$(sql "SELECT COUNT(*) FROM dialogue_turns dt JOIN dialogues d ON d.id=dt.dialogue_id JOIN characters ch ON ch.id=dt.speaker_character_id WHERE d.public_id BETWEEN 'de_pre_a1_dlg_001' AND 'de_pre_a1_dlg_030' AND dt.speaker_gender_evidence IN ('female','male') AND ch.gender IN ('female','male') AND dt.speaker_gender_evidence<>ch.gender;")" = "0"
          test "$(sql "SELECT COUNT(*) FROM audio_files WHERE status IN ('generated','approved');")" = "0"
          test "$(sql "SELECT coverage_status FROM curriculum_targets WHERE public_id='de_pre_a1_ct_006';")" = "covered"
          test "$(sql "SELECT COUNT(*) FROM activities WHERE type_code='form_fill';")" -ge "1"
          test "$(sql "SELECT COUNT(*) FROM activities WHERE type_code='guided_writing';")" -ge "1"
          counts=$(sql "SELECT GROUP_CONCAT(cnt ORDER BY sequence_number SEPARATOR ',') FROM (SELECT l.sequence_number,COUNT(a.id) cnt FROM lessons l JOIN activities a ON a.lesson_id=l.id WHERE l.sequence_number BETWEEN 26 AND 30 AND l.public_id LIKE 'de_pre_a1_l%' GROUP BY l.id,l.sequence_number) q;")
          test "$counts" = "4,3,3,4,6"

      - name: Check all base tables
        run: |
          set -euo pipefail
          tables=$(docker run --rm --network host mysql:9.0.1 mysql -N -s -h127.0.0.1 -uroot -proot language_app -e "SELECT GROUP_CONCAT(TABLE_NAME SEPARATOR ' ') FROM information_schema.TABLES WHERE TABLE_SCHEMA='language_app' AND TABLE_TYPE='BASE TABLE';")
          test -n "$tables"
          for table in $tables; do
            docker run --rm --network host mysql:9.0.1 mysql -N -s -h127.0.0.1 -uroot -proot language_app -e "CHECK TABLE \`$table\`;" | tee -a /tmp/check-table.txt
          done
          if grep -E $'\terror\t|\tError\t' /tmp/check-table.txt; then
            exit 1
          fi
