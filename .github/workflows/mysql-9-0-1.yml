name: MySQL 9.0.1 schema test

on:
  push:
    branches: [main]
    paths:
      - 'database/**'
      - '.github/workflows/mysql-9-0-1.yml'
  workflow_dispatch:

jobs:
  mysql-schema-test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:9.0.1
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: language_app
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify exact MySQL version
        run: |
          set -euo pipefail
          version=$(docker run --rm --network host mysql:9.0.1 mysql -N -s -h127.0.0.1 -uroot -proot -e "SELECT VERSION();")
          echo "Server version: $version"
          test "$version" = "9.0.1"

      - name: Apply schema
        run: |
          set -euo pipefail
          docker run --rm --network host -i mysql:9.0.1 mysql --show-warnings -h127.0.0.1 -uroot -proot language_app < database/schema.sql

      - name: Apply migrations
        run: |
          set -euo pipefail
          shopt -s nullglob
          for f in database/migrations/*.sql; do
            echo "Applying $f"
            docker run --rm --network host -i mysql:9.0.1 mysql --show-warnings -h127.0.0.1 -uroot -proot language_app < "$f"
          done

      - name: Apply reference seed twice to verify idempotency
        run: |
          set -euo pipefail
          for i in 1 2; do
            echo "Seed pass $i"
            docker run --rm --network host -i mysql:9.0.1 mysql --show-warnings -h127.0.0.1 -uroot -proot language_app < database/seed_reference.sql
          done

      - name: Apply curriculum plans twice to verify idempotency
        run: |
          set -euo pipefail
          shopt -s nullglob
          for i in 1 2; do
            echo "Plan pass $i"
            for f in database/plans/*.sql; do
              echo "Applying $f"
              docker run --rm --network host -i mysql:9.0.1 mysql --show-warnings -h127.0.0.1 -uroot -proot language_app < "$f"
            done
          done

      - name: Apply content batches twice to verify idempotency
        run: |
          set -euo pipefail
          shopt -s nullglob
          for i in 1 2; do
            echo "Content pass $i"
            for f in database/content/*.sql; do
              echo "Applying $f"
              docker run --rm --network host -i mysql:9.0.1 mysql --show-warnings -h127.0.0.1 -uroot -proot language_app < "$f"
            done
          done

      - name: Run QA queries for SQL compatibility
        run: |
          set -euo pipefail
          docker run --rm --network host -i mysql:9.0.1 mysql --show-warnings -h127.0.0.1 -uroot -proot language_app < database/qa_queries.sql > /tmp/qa-output.txt
          cat /tmp/qa-output.txt

      - name: Validate expected reference rows and views
        run: |
          set -euo pipefail
          docker run --rm --network host mysql:9.0.1 mysql -N -s -h127.0.0.1 -uroot -proot language_app -e "
            SELECT CASE WHEN COUNT(*) = 7 THEN 'OK' ELSE CONCAT('FAIL:', COUNT(*)) END FROM cefr_levels;
            SELECT CASE WHEN COUNT(*) = 2 THEN 'OK' ELSE CONCAT('FAIL:', COUNT(*)) END FROM languages;
            SELECT CASE WHEN COUNT(*) = 14 THEN 'OK' ELSE CONCAT('FAIL:', COUNT(*)) END FROM language_levels;
            SELECT CASE WHEN COUNT(*) = 13 THEN 'OK' ELSE CONCAT('FAIL:', COUNT(*)) END FROM activity_types;
            SELECT COUNT(*) FROM v_lesson_activity_counts;
            SELECT COUNT(*) FROM v_language_level_content_status;
          " | tee /tmp/assertions.txt
          test "$(sed -n '1p' /tmp/assertions.txt)" = "OK"
          test "$(sed -n '2p' /tmp/assertions.txt)" = "OK"
          test "$(sed -n '3p' /tmp/assertions.txt)" = "OK"
          test "$(sed -n '4p' /tmp/assertions.txt)" = "OK"

      - name: Validate German Pre-A1 plan
        run: |
          set -euo pipefail
          targets=$(docker run --rm --network host mysql:9.0.1 mysql -N -s -h127.0.0.1 -uroot -proot language_app -e "SELECT COUNT(*) FROM curriculum_targets ct JOIN language_levels ll ON ll.id=ct.language_level_id JOIN languages l ON l.id=ll.language_id JOIN cefr_levels c ON c.id=ll.cefr_level_id WHERE l.code='de' AND c.code='Pre-A1' AND ct.is_mandatory=1;")
          planned=$(docker run --rm --network host mysql:9.0.1 mysql -N -s -h127.0.0.1 -uroot -proot language_app -e "SELECT ll.planned_lesson_count FROM language_levels ll JOIN languages l ON l.id=ll.language_id JOIN cefr_levels c ON c.id=ll.cefr_level_id WHERE l.code='de' AND c.code='Pre-A1';")
          status=$(docker run --rm --network host mysql:9.0.1 mysql -N -s -h127.0.0.1 -uroot -proot language_app -e "SELECT ll.lesson_count_status FROM language_levels ll JOIN languages l ON l.id=ll.language_id JOIN cefr_levels c ON c.id=ll.cefr_level_id WHERE l.code='de' AND c.code='Pre-A1';")
          sources=$(docker run --rm --network host mysql:9.0.1 mysql -N -s -h127.0.0.1 -uroot -proot language_app -e "SELECT COUNT(*) FROM sources WHERE public_id IN ('src_cefr_2020','src_fsi_de_programmed_intro','src_dli_de_headstart','src_fsi_de_basic','src_tatoeba_de','src_fsi_de_fast');")
          lessons=$(docker run --rm --network host mysql:9.0.1 mysql -N -s -h127.0.0.1 -uroot -proot language_app -e "SELECT COUNT(*) FROM lessons l JOIN language_levels ll ON ll.id=l.language_level_id JOIN languages lang ON lang.id=ll.language_id JOIN cefr_levels c ON c.id=ll.cefr_level_id WHERE lang.code='de' AND c.code='Pre-A1';")
          sourced_lessons=$(docker run --rm --network host mysql:9.0.1 mysql -N -s -h127.0.0.1 -uroot -proot language_app -e "SELECT COUNT(DISTINCT l.id) FROM lessons l JOIN language_levels ll ON ll.id=l.language_level_id JOIN languages lang ON lang.id=ll.language_id JOIN cefr_levels c ON c.id=ll.cefr_level_id JOIN lesson_sources ls ON ls.lesson_id=l.id WHERE lang.code='de' AND c.code='Pre-A1';")
          targeted_lessons=$(docker run --rm --network host mysql:9.0.1 mysql -N -s -h127.0.0.1 -uroot -proot language_app -e "SELECT COUNT(DISTINCT l.id) FROM lessons l JOIN language_levels ll ON ll.id=l.language_level_id JOIN languages lang ON lang.id=ll.language_id JOIN cefr_levels c ON c.id=ll.cefr_level_id JOIN lesson_targets lt ON lt.lesson_id=l.id WHERE lang.code='de' AND c.code='Pre-A1';")
          final_lessons=$(docker run --rm --network host mysql:9.0.1 mysql -N -s -h127.0.0.1 -uroot -proot language_app -e "SELECT COUNT(*) FROM lessons l JOIN language_levels ll ON ll.id=l.language_level_id JOIN languages lang ON lang.id=ll.language_id JOIN cefr_levels c ON c.id=ll.cefr_level_id WHERE lang.code='de' AND c.code='Pre-A1' AND l.status='final';")
          bad_restaurant_fallback=$(docker run --rm --network host mysql:9.0.1 mysql -N -s -h127.0.0.1 -uroot -proot language_app -e "SELECT COUNT(*) FROM lesson_sources ls JOIN lessons l ON l.id=ls.lesson_id JOIN source_items si ON si.id=ls.source_item_id WHERE l.public_id='de_pre_a1_l023' AND si.public_id='srcitem_fast_l2_registration';")
          test "$targets" = "30"
          test "$planned" = "30"
          test "$status" = "provisional"
          test "$sources" = "6"
          test "$lessons" = "30"
          test "$sourced_lessons" = "30"
          test "$targeted_lessons" = "30"
          test "$final_lessons" = "0"
          test "$bad_restaurant_fallback" = "0"

      - name: Validate German Pre-A1 content batch 001
        run: |
          set -euo pipefail
          checked=$(docker run --rm --network host mysql:9.0.1 mysql -N -s -h127.0.0.1 -uroot -proot language_app -e "SELECT COUNT(*) FROM lessons WHERE public_id BETWEEN 'de_pre_a1_l001' AND 'de_pre_a1_l005' AND status='source_checked';")
          activities=$(docker run --rm --network host mysql:9.0.1 mysql -N -s -h127.0.0.1 -uroot -proot language_app -e "SELECT COUNT(*) FROM activities a JOIN lessons l ON l.id=a.lesson_id WHERE l.public_id BETWEEN 'de_pre_a1_l001' AND 'de_pre_a1_l005';")
          openings=$(docker run --rm --network host mysql:9.0.1 mysql -N -s -h127.0.0.1 -uroot -proot language_app -e "SELECT COUNT(*) FROM activities a JOIN lessons l ON l.id=a.lesson_id WHERE l.public_id BETWEEN 'de_pre_a1_l001' AND 'de_pre_a1_l005' AND a.position=1 AND a.type_code='conversation_speaking' AND a.dialogue_id IS NOT NULL;")
          dialogues=$(docker run --rm --network host mysql:9.0.1 mysql -N -s -h127.0.0.1 -uroot -proot language_app -e "SELECT COUNT(*) FROM dialogues WHERE public_id BETWEEN 'de_pre_a1_dlg_001' AND 'de_pre_a1_dlg_005' AND status='source_checked';")
          learner_dialogues=$(docker run --rm --network host mysql:9.0.1 mysql -N -s -h127.0.0.1 -uroot -proot language_app -e "SELECT COUNT(DISTINCT d.id) FROM dialogues d JOIN dialogue_turns dt ON dt.dialogue_id=d.id AND dt.learner_turn=1 WHERE d.public_id BETWEEN 'de_pre_a1_dlg_001' AND 'de_pre_a1_dlg_005';")
          sourced_turns=$(docker run --rm --network host mysql:9.0.1 mysql -N -s -h127.0.0.1 -uroot -proot language_app -e "SELECT COUNT(DISTINCT dt.id) FROM dialogue_turns dt JOIN dialogues d ON d.id=dt.dialogue_id JOIN dialogue_turn_sources dts ON dts.dialogue_turn_id=dt.id WHERE d.public_id BETWEEN 'de_pre_a1_dlg_001' AND 'de_pre_a1_dlg_005';")
          all_turns=$(docker run --rm --network host mysql:9.0.1 mysql -N -s -h127.0.0.1 -uroot -proot language_app -e "SELECT COUNT(*) FROM dialogue_turns dt JOIN dialogues d ON d.id=dt.dialogue_id WHERE d.public_id BETWEEN 'de_pre_a1_dlg_001' AND 'de_pre_a1_dlg_005';")
          gender_conflicts=$(docker run --rm --network host mysql:9.0.1 mysql -N -s -h127.0.0.1 -uroot -proot language_app -e "SELECT COUNT(*) FROM dialogue_turns dt JOIN dialogues d ON d.id=dt.dialogue_id JOIN characters ch ON ch.id=dt.speaker_character_id WHERE d.public_id BETWEEN 'de_pre_a1_dlg_001' AND 'de_pre_a1_dlg_005' AND dt.speaker_gender_evidence IN ('female','male') AND ch.gender IN ('female','male') AND dt.speaker_gender_evidence<>ch.gender;")
          lexemes=$(docker run --rm --network host mysql:9.0.1 mysql -N -s -h127.0.0.1 -uroot -proot language_app -e "SELECT COUNT(*) FROM lexemes WHERE public_id IN ('de_lex_guten_tag','de_lex_guten_morgen','de_lex_guten_abend','de_lex_gute_nacht','de_lex_auf_wiedersehen','de_lex_bis_montag','de_lex_danke','de_lex_bitte','de_lex_wie_geht_es_ihnen','de_lex_heissen');")
          generated_audio=$(docker run --rm --network host mysql:9.0.1 mysql -N -s -h127.0.0.1 -uroot -proot language_app -e "SELECT COUNT(*) FROM audio_files WHERE status IN ('generated','approved');")
          test "$checked" = "5"
          test "$activities" = "14"
          test "$openings" = "5"
          test "$dialogues" = "5"
          test "$learner_dialogues" = "5"
          test "$sourced_turns" = "$all_turns"
          test "$gender_conflicts" = "0"
          test "$lexemes" = "10"
          test "$generated_audio" = "0"
          counts=$(docker run --rm --network host mysql:9.0.1 mysql -N -s -h127.0.0.1 -uroot -proot language_app -e "SELECT GROUP_CONCAT(cnt ORDER BY sequence_number SEPARATOR ',') FROM (SELECT l.sequence_number,COUNT(a.id) cnt FROM lessons l JOIN activities a ON a.lesson_id=l.id WHERE l.public_id BETWEEN 'de_pre_a1_l001' AND 'de_pre_a1_l005' GROUP BY l.id,l.sequence_number) q;")
          test "$counts" = "3,3,2,3,3"

      - name: Check all base tables
        run: |
          set -euo pipefail
          tables=$(docker run --rm --network host mysql:9.0.1 mysql -N -s -h127.0.0.1 -uroot -proot language_app -e "SELECT GROUP_CONCAT(TABLE_NAME SEPARATOR ' ') FROM information_schema.TABLES WHERE TABLE_SCHEMA='language_app' AND TABLE_TYPE='BASE TABLE';")
          test -n "$tables"
          for table in $tables; do
            docker run --rm --network host mysql:9.0.1 mysql -N -s -h127.0.0.1 -uroot -proot language_app -e "CHECK TABLE \`$table\`;" | tee -a /tmp/check-table.txt
          done
          if grep -E $'\terror\t|\tError\t' /tmp/check-table.txt; then
            exit 1
          fi