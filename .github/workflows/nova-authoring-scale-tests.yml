name: Nova Authoring Scale Tests

on:
  pull_request:
    paths:
      - 'nova/_assistant/content-system-v1/tools/factory_wave.py'
      - 'nova/_assistant/content-system-v1/tools/test_factory_wave_reconciliation.py'
      - 'nova/_assistant/content-system-v1/tools/test_factory_wave_scaling.py'
      - 'nova/_assistant/content-system-v1/tools/test_factory_wave_open_corpus_wiring.py'
      - 'nova/curriculum/en-fa/factory.config.json'
      - '.github/workflows/nova-authoring-scale-tests.yml'
  push:
    branches: [main]
    paths:
      - 'nova/_assistant/content-system-v1/tools/factory_wave.py'
      - 'nova/_assistant/content-system-v1/tools/test_factory_wave_reconciliation.py'
      - 'nova/_assistant/content-system-v1/tools/test_factory_wave_scaling.py'
      - 'nova/_assistant/content-system-v1/tools/test_factory_wave_open_corpus_wiring.py'
      - 'nova/curriculum/en-fa/factory.config.json'
      - '.github/workflows/nova-authoring-scale-tests.yml'

permissions:
  contents: read

jobs:
  scale-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile scaling tools
        run: |
          python -m py_compile \
            nova/_assistant/content-system-v1/tools/factory_wave.py \
            nova/_assistant/content-system-v1/tools/test_factory_wave_reconciliation.py \
            nova/_assistant/content-system-v1/tools/test_factory_wave_scaling.py \
            nova/_assistant/content-system-v1/tools/test_factory_wave_open_corpus_wiring.py
      - name: Run reconciliation regression tests
        env:
          PYTHONPATH: nova/_assistant/content-system-v1/tools
        run: python -m unittest nova/_assistant/content-system-v1/tools/test_factory_wave_reconciliation.py
      - name: Run 50-worker regression tests
        env:
          PYTHONPATH: nova/_assistant/content-system-v1/tools
        run: python -m unittest nova/_assistant/content-system-v1/tools/test_factory_wave_scaling.py
      - name: Verify open-corpus production routing
        env:
          PYTHONPATH: nova/_assistant/content-system-v1/tools
        run: python -m unittest nova/_assistant/content-system-v1/tools/test_factory_wave_open_corpus_wiring.py
      - name: Verify production defaults
        run: |
          python - <<'PY'
          import json
          config = json.load(open('nova/curriculum/en-fa/factory.config.json', encoding='utf-8'))
          assert config['waveSize'] == 20, config
          assert config['maxParallelWaveSize'] == 50, config
          assert config['parallelPodSize'] == 10, config
          assert config['openCorpusAuthoring'] is True, config
          assert config['openCorpusCandidateCount'] >= 6, config
          assert config['openCorpusAllowShareAlike'] is True, config
          print({
              'waveSize': config['waveSize'],
              'maxParallelWaveSize': config['maxParallelWaveSize'],
              'parallelPodSize': config['parallelPodSize'],
              'openCorpusAuthoring': config['openCorpusAuthoring'],
              'openCorpusCandidateCount': config['openCorpusCandidateCount'],
          })
          PY
