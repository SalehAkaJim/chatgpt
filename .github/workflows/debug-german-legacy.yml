name: German Pre-A1 legacy diagnostics

on:
  push:
    branches: [main]
    paths:
      - 'database/**'
      - '.github/workflows/debug-german-legacy.yml'
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:9.0.1
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: language_app
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    steps:
      - uses: actions/checkout@v4

      - name: Build final database state
        run: |
          set -euo pipefail
          mysql_cmd='docker run --rm --network host -i mysql:9.0.1 mysql --show-warnings -h127.0.0.1 -uroot -proot language_app'
          $mysql_cmd < database/schema.sql
          shopt -s nullglob
          for f in database/migrations/*.sql; do $mysql_cmd < "$f"; done
          for i in 1 2; do
            $mysql_cmd < database/seed_reference.sql
            for f in database/plans/*.sql; do $mysql_cmd < "$f"; done
            for f in database/content/*.sql; do $mysql_cmd < "$f"; done
          done

      - name: Capture exact legacy offenders
        run: |
          set -euo pipefail
          sql() { docker run --rm --network host mysql:9.0.1 mysql -N -s -h127.0.0.1 -uroot -proot language_app -e "$1"; }
          legacy='Fräulein|D-Mark|(^|[^A-Za-z])DM([^A-Za-z]|$)|heisse|heissen|grosse|Schloß|muß|daß'
          lowercase_legacy='auf deutsch'
          {
            echo '=== DIALOGUE_TURNS ==='
            sql "SELECT d.public_id,dt.position,dt.text_target FROM dialogue_turns dt JOIN dialogues d ON d.id=dt.dialogue_id WHERE d.public_id LIKE 'de_pre_a1_dlg_%' AND (dt.text_target REGEXP '$legacy' OR REGEXP_LIKE(dt.text_target, '$lowercase_legacy', 'c')) ORDER BY d.public_id,dt.position;"
            echo '=== ACTIVITY_ITEMS ==='
            sql "SELECT l.public_id,a.id,ai.id,COALESCE(ai.text_target,'') FROM activity_items ai JOIN activities a ON a.id=ai.activity_id JOIN lessons l ON l.id=a.lesson_id WHERE l.public_id LIKE 'de_pre_a1_l%' AND (COALESCE(ai.text_target,'') REGEXP '$legacy' OR REGEXP_LIKE(COALESCE(ai.text_target,''), '$lowercase_legacy', 'c')) ORDER BY l.sequence_number,a.position,ai.position;"
            echo '=== ACTIVITY_PAYLOADS ==='
            sql "SELECT l.public_id,a.id,CAST(COALESCE(a.payload,JSON_OBJECT()) AS CHAR) FROM activities a JOIN lessons l ON l.id=a.lesson_id WHERE l.public_id LIKE 'de_pre_a1_l%' AND (CAST(COALESCE(a.payload,JSON_OBJECT()) AS CHAR) REGEXP '$legacy' OR REGEXP_LIKE(CAST(COALESCE(a.payload,JSON_OBJECT()) AS CHAR), '$lowercase_legacy', 'c')) ORDER BY l.sequence_number,a.position;"
            echo '=== ACTIVE_LEXEMES ==='
            sql "SELECT DISTINCT l.public_id,lx.id,lx.surface FROM lexemes lx JOIN lesson_lexemes ll ON ll.lexeme_id=lx.id JOIN lessons l ON l.id=ll.lesson_id WHERE l.public_id LIKE 'de_pre_a1_l%' AND (lx.surface REGEXP '$legacy' OR REGEXP_LIKE(lx.surface, '$lowercase_legacy', 'c')) ORDER BY l.public_id,lx.surface;"
          } | tee /tmp/german-legacy-offenders.txt

      - name: Upload diagnostic artifact
        uses: actions/upload-artifact@v4
        with:
          name: german-legacy-offenders
          path: /tmp/german-legacy-offenders.txt
          retention-days: 1
