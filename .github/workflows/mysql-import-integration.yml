name: MySQL Level Import Integration

on:
  push:
    paths:
      - 'database/**'
      - 'scripts/materialize_level.py'
      - 'scripts/audit_prea1_cefr_readiness.py'
      - 'content/production/en/Pre-A1/**'
      - 'content/production/en/A1/**'
      - 'content/production/en/A2/**'
      - 'content/production/en/B1/**'
      - 'content/production/en/B2/**'
      - 'content/production/en/C1/**'
      - 'content/production/en/C2/**'
      - '.github/workflows/mysql-import-integration.yml'
      - 'requirements.txt'
  pull_request:
    paths:
      - 'database/**'
      - 'scripts/materialize_level.py'
      - 'scripts/audit_prea1_cefr_readiness.py'
      - 'content/production/en/Pre-A1/**'
      - 'content/production/en/A1/**'
      - 'content/production/en/A2/**'
      - 'content/production/en/B1/**'
      - 'content/production/en/B2/**'
      - 'content/production/en/C1/**'
      - 'content/production/en/C2/**'
      - '.github/workflows/mysql-import-integration.yml'
      - 'requirements.txt'

jobs:
  mysql-9-import:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:9.0.1
        env:
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_DATABASE: language_learning
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -prootpass"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: mysql://root:rootpass@127.0.0.1:3306/language_learning
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y default-mysql-client
      - name: Bootstrap MySQL 9.0.1 schema and curricula
        env:
          MYSQL_PWD: rootpass
        run: |
          DB="mysql -h127.0.0.1 -P3306 -uroot language_learning"
          $DB < database/schema.sql
          $DB < database/migrations/001_curriculum.sql
          $DB < database/migrations/002_multilingual_core.sql
          $DB < database/migrations/003_lesson_item_lexemes.sql
          $DB < database/migrations/004_level_import_audio.sql
          $DB < database/migrations/005_writing_exercises.sql
          $DB < database/seed/cefr.sql
          $DB < database/seed/languages.sql
          $DB < database/seed/skills-topics.sql
          $DB < database/seed/english-a1-curriculum.sql
          $DB < database/seed/language-variants-courses.sql
          $DB < database/seed/english-prea1-curriculum.sql
          $DB < database/seed/english-a2-curriculum.sql
          $DB < database/seed/english-b1-curriculum.sql
          $DB < database/seed/english-b2-curriculum.sql
          $DB < database/seed/english-c1-curriculum.sql
          $DB < database/seed/english-c2-curriculum.sql
          $DB < database/seed/turkish-prea1-curriculum.sql
      - name: Verify expanded Pre-A1 foundations
        env:
          MYSQL_PWD: rootpass
        run: |
          python scripts/audit_prea1_cefr_readiness.py
          english=$(mysql -N -s -h127.0.0.1 -P3306 -uroot language_learning -e "SELECT COUNT(*) FROM curriculum_units cu JOIN courses c ON c.id=cu.course_id AND c.slug='fa-en-us' JOIN cefr_levels lvl ON lvl.id=cu.cefr_level_id AND lvl.code='Pre-A1';")
          turkish=$(mysql -N -s -h127.0.0.1 -P3306 -uroot language_learning -e "SELECT COUNT(*) FROM curriculum_units cu JOIN courses c ON c.id=cu.course_id AND c.slug='fa-tr-tr' JOIN cefr_levels lvl ON lvl.id=cu.cefr_level_id AND lvl.code='Pre-A1';")
          echo "English Pre-A1 units=$english Turkish Pre-A1 units=$turkish"
          test "$english" = "17"
          test "$turkish" = "18"
      - name: Import complete English Pre-A1 through C2
        run: |
          python database/import/en/pre_a1.py --allow-unreviewed
          python database/import/en/a1.py --allow-unreviewed
          python database/import/en/a2.py --allow-unreviewed
          python database/import/en/b1.py --allow-unreviewed
          python database/import/en/b2.py --allow-unreviewed
          python database/import/en/c1.py --allow-unreviewed
          python database/import/en/c2.py --allow-unreviewed
      - name: Apply educational corrections twice and verify persisted feedback
        env:
          MYSQL_PWD: rootpass
        run: |
          python scripts/test_english_database_fixes.py --seed-stale-fixture
          python scripts/export_english_content_updates.py
          python scripts/export_english_quality_updates.py
          mysql -h127.0.0.1 -P3306 -uroot language_learning < database/import/en/educational_content_updates.sql
          mysql -h127.0.0.1 -P3306 -uroot language_learning < database/import/en/educational_content_updates.sql
          mysql -h127.0.0.1 -P3306 -uroot language_learning < database/import/en/educational_quality_updates.sql
          mysql -h127.0.0.1 -P3306 -uroot language_learning < database/import/en/educational_quality_updates.sql
          python scripts/test_english_database_fixes.py
      - name: Verify canonical rows and idempotency through C2
        env:
          MYSQL_PWD: rootpass
        run: |
          python database/import/en/pre_a1.py --allow-unreviewed
          python database/import/en/a1.py --allow-unreviewed
          python database/import/en/a2.py --allow-unreviewed
          python database/import/en/b1.py --allow-unreviewed
          python database/import/en/b2.py --allow-unreviewed
          python database/import/en/c1.py --allow-unreviewed
          python database/import/en/c2.py --allow-unreviewed
          mysql -h127.0.0.1 -P3306 -uroot language_learning -e "
            SELECT COUNT(*) AS lessons FROM lessons;
            SELECT COUNT(*) AS concepts FROM concepts;
            SELECT COUNT(*) AS lexemes FROM lexemes;
            SELECT COUNT(*) AS utterances FROM utterances;
            SELECT COUNT(*) AS dialogues FROM dialogues;
            SELECT COUNT(*) AS dialogue_turns FROM dialogue_turns;
            SELECT COUNT(*) AS exercises FROM exercises;
          "
