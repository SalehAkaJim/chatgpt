name: Production Pipeline Validation

on:
  push:
    paths:
      - 'scripts/**'
      - 'audio/**'
      - 'database/import/**'
      - 'database/migrations/004_level_import_audio.sql'
      - 'requirements.txt'
      - '.github/workflows/production-pipeline-validation.yml'
      - 'content/production/en/Pre-A1/**'
      - 'content/production/en/A1/**'
  pull_request:
    paths:
      - 'scripts/**'
      - 'audio/**'
      - 'database/import/**'
      - 'database/migrations/004_level_import_audio.sql'
      - 'requirements.txt'
      - '.github/workflows/production-pipeline-validation.yml'
      - 'content/production/en/Pre-A1/**'
      - 'content/production/en/A1/**'

jobs:
  validate-production-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile pipeline scripts
        run: |
          python -m py_compile \
            scripts/materialize_level.py \
            scripts/build_audio_manifest.py \
            scripts/generate_audio.py \
            scripts/import_audio_manifest.py \
            database/import/en/pre_a1.py \
            database/import/en/a1.py
      - name: Validate complete level imports without database mutation
        run: |
          python database/import/en/pre_a1.py --dry-run
          python database/import/en/a1.py --dry-run
      - name: Build level audio manifests
        run: |
          mkdir -p audio/manifests/en
          python scripts/build_audio_manifest.py content/production/en/Pre-A1 --level Pre-A1 --output audio/manifests/en/Pre-A1.json
          python scripts/build_audio_manifest.py content/production/en/A1 --level A1 --output audio/manifests/en/A1.json
      - name: Audit audio coverage and character profiles
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for p in [Path('audio/manifests/en/Pre-A1.json'), Path('audio/manifests/en/A1.json')]:
              m=json.loads(p.read_text())
              counts={}
              for item in m['items']:
                  counts[item['category']]=counts.get(item['category'],0)+1
              print(p, counts)
              print('missing_character_profiles=', ','.join(m['missing_character_profiles']) or 'none')
              assert counts.get('lexical',0)>0
              assert counts.get('utterances',0)>0
          PY
      - name: Upload generated manifests
        uses: actions/upload-artifact@v4
        with:
          name: english-audio-manifests
          path: audio/manifests/en/*.json
