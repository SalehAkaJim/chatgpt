name: Generate German B2 Batch

on:
  push:
    branches:
      - main
    paths:
      - '.github/german-b2-batch-trigger'
  workflow_dispatch:
    inputs:
      batch:
        description: 'B2 batch number (1-10 units; final batch may be smaller)'
        required: true
        default: '1'

permissions:
  contents: write

concurrency:
  group: german-b2-content-generation
  cancel-in-progress: false

jobs:
  generate-batch:
    runs-on: ubuntu-latest
    env:
      BATCH: ${{ github.event.inputs.batch || '1' }}
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Generate up to ten B2 units
        run: python scripts/generate_german_b2_batch.py --batch "$BATCH"
      - name: Validate cumulative B2 production
        run: |
          set -euo pipefail
          for f in content/production/de/B2/*.json; do
            python scripts/validate_content.py "$f"
          done
          python scripts/audit_german_b2_content.py --batch "$BATCH"
          python database/import/de/b2.py --dry-run
      - name: Batch summary
        run: |
          python - <<'PY'
          import json, pathlib, collections, os
          root=pathlib.Path('content/production/de/B2')
          files=sorted(root.glob('*.json'))
          counts=collections.Counter(); lessons=set()
          for p in files:
              b=json.loads(p.read_text())
              for i in b['items']:
                  counts[i['kind']]+=1
                  lk=i.get('data',{}).get('lesson_key')
                  if lk: lessons.add(lk)
          print(json.dumps({'batch':int(os.environ['BATCH']),'units':len(files),'lessons':len(lessons),'items':sum(counts.values()),'counts':dict(counts)},ensure_ascii=False,indent=2))
          PY
      - name: Commit German B2 production content
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/production/de/B2
          if git diff --cached --quiet; then
            echo 'No generated content changes.'
          else
            git commit -m "Generate German B2 batch ${BATCH} production content [skip ci]"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
