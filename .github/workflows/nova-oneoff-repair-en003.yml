name: Nova One-off EN-003 JSON Repair

on:
  push:
    paths:
      - '.github/workflows/nova-oneoff-repair-en003.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair MySQL-unsafe JSON newlines
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('nova/courses/en-fa/staging/batch_01/chapter_0003/chapter.sql')
          s = p.read_text(encoding='utf-8')
          needle = r'\n'
          count = s.count(needle)
          if count != 4:
              raise SystemExit(f'Expected exactly 4 literal \\n occurrences in EN-003, found {count}')
          s = s.replace(needle, ' — ')
          p.write_text(s, encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nova/courses/en-fa/staging/batch_01/chapter_0003/chapter.sql
          git rm .github/workflows/nova-oneoff-repair-en003.yml
          git commit -m 'Fix EN-003 MySQL JSON newline escaping'
          git push origin HEAD:main
