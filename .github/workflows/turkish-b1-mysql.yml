name: Turkish B1 MySQL Integration
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/turkish-b1-mysql-trigger']
jobs:
  mysql-9-import:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:9.0.1
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: language_learning
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot" --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      DATABASE_URL: 'mysql://root@127.0.0.1:3306/language_learning'
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          pip install -r requirements.txt
          sudo apt-get update -qq && sudo apt-get install -y default-mysql-client
      - name: Bootstrap schema and Turkish curriculum
        run: |
          set -euo pipefail
          DB="mysql -h127.0.0.1 -P3306 -uroot language_learning"
          for f in database/schema.sql database/migrations/001_curriculum.sql database/migrations/002_multilingual_core.sql database/migrations/003_lesson_item_lexemes.sql database/migrations/004_level_import_audio.sql database/migrations/005_writing_exercises.sql database/seed/cefr.sql database/seed/languages.sql database/seed/skills-topics.sql database/seed/english-a1-curriculum.sql database/seed/language-variants-courses.sql database/seed/turkish-prea1-curriculum.sql database/seed/turkish-a1-curriculum.sql database/seed/turkish-a2-curriculum.sql database/seed/turkish-a2-expansion-batch-06.sql database/seed/turkish-b1-curriculum.sql database/seed/turkish-b1-expansion-batch-02.sql database/seed/turkish-b1-expansion-batch-03.sql database/seed/turkish-b1-expansion-batch-04.sql database/seed/turkish-b1-expansion-batch-05.sql database/seed/turkish-b1-expansion-batch-06.sql; do $DB < "$f"; done
      - name: Validate and derive Turkish B1 expectations
        run: |
          set -euo pipefail
          for f in content/production/tr/B1/*.json; do python scripts/validate_content.py "$f"; done
          python scripts/validate_turkish_b1_cefr_boundary.py
          python database/import/tr/b1.py --dry-run
          python - <<'PY' >> "$GITHUB_ENV"
          import json
          from pathlib import Path
          files=sorted(Path('content/production/tr/B1').glob('*.json'))
          assert files
          lessons=set(); concepts=set(); lexemes=set(); utterances=set(); dialogues=set(); exercises=0
          for f in files:
              b=json.loads(f.read_text(encoding='utf-8'))
              unit=b['curriculum_unit']
              for item in b['items']:
                  d=item.get('data',{}); lk=d.get('lesson_key')
                  if lk: lessons.add(lk)
                  kind=item.get('kind')
                  if kind=='concept': concepts.add((unit,item['external_id']))
                  elif kind=='lexeme': lexemes.add((d.get('language','tr'),d.get('lemma','').strip().casefold()))
                  elif kind=='utterance': utterances.add((unit,item['external_id']))
                  elif kind=='dialogue': dialogues.add((unit,item['external_id']))
                  elif kind=='exercise': exercises += 1
          for k,v in [('EXP_UNITS',len(files)),('EXP_LESSONS',len(lessons)),('EXP_CONCEPTS',len(concepts)),('EXP_LEXEMES',len(lexemes)),('EXP_UTTERANCES',len(utterances)),('EXP_DIALOGUES',len(dialogues)),('EXP_EXERCISES',exercises)]:
              print(f'{k}={v}')
          PY
      - name: Import Turkish course through B1
        run: |
          python database/import/tr/pre_a1.py --allow-unreviewed
          python database/import/tr/a1.py --allow-unreviewed
          python database/import/tr/a2.py --allow-unreviewed
          python database/import/tr/b1.py --allow-unreviewed
      - name: Verify Turkish B1 canonical counts
        run: |
          set -euo pipefail
          q(){ mysql -N -s -h127.0.0.1 -P3306 -uroot language_learning -e "$1"; }
          units=$(q "SELECT COUNT(*) FROM curriculum_units cu JOIN courses c ON c.id=cu.course_id AND c.slug='fa-tr-tr' JOIN cefr_levels lvl ON lvl.id=cu.cefr_level_id AND lvl.code='B1';")
          lessons=$(q "SELECT COUNT(*) FROM lessons le JOIN courses c ON c.id=le.course_id AND c.slug='fa-tr-tr' JOIN cefr_levels lvl ON lvl.id=le.cefr_level_id AND lvl.code='B1';")
          concepts=$(q "SELECT COUNT(DISTINCT li.concept_id) FROM lesson_items li JOIN lessons le ON le.id=li.lesson_id JOIN courses c ON c.id=le.course_id JOIN cefr_levels lvl ON lvl.id=le.cefr_level_id WHERE c.slug='fa-tr-tr' AND lvl.code='B1' AND li.concept_id IS NOT NULL;")
          lexemes=$(q "SELECT COUNT(DISTINCT li.lexeme_id) FROM lesson_items li JOIN lessons le ON le.id=li.lesson_id JOIN courses c ON c.id=le.course_id JOIN cefr_levels lvl ON lvl.id=le.cefr_level_id WHERE c.slug='fa-tr-tr' AND lvl.code='B1' AND li.lexeme_id IS NOT NULL;")
          utterances=$(q "SELECT COUNT(DISTINCT li.utterance_id) FROM lesson_items li JOIN lessons le ON le.id=li.lesson_id JOIN courses c ON c.id=le.course_id JOIN cefr_levels lvl ON lvl.id=le.cefr_level_id WHERE c.slug='fa-tr-tr' AND lvl.code='B1' AND li.utterance_id IS NOT NULL;")
          dialogues=$(q "SELECT COUNT(DISTINCT li.dialogue_id) FROM lesson_items li JOIN lessons le ON le.id=li.lesson_id JOIN courses c ON c.id=le.course_id JOIN cefr_levels lvl ON lvl.id=le.cefr_level_id WHERE c.slug='fa-tr-tr' AND lvl.code='B1' AND li.dialogue_id IS NOT NULL;")
          exercises=$(q "SELECT COUNT(*) FROM exercises e JOIN lessons le ON le.id=e.lesson_id JOIN courses c ON c.id=le.course_id JOIN cefr_levels lvl ON lvl.id=le.cefr_level_id WHERE c.slug='fa-tr-tr' AND lvl.code='B1';")
          echo "actual units=$units lessons=$lessons concepts=$concepts lexemes=$lexemes utterances=$utterances dialogues=$dialogues exercises=$exercises"
          echo "expected units=$EXP_UNITS lessons=$EXP_LESSONS concepts=$EXP_CONCEPTS lexemes=$EXP_LEXEMES utterances=$EXP_UTTERANCES dialogues=$EXP_DIALOGUES exercises=$EXP_EXERCISES"
          test "$units" = "$EXP_UNITS"
          test "$lessons" = "$EXP_LESSONS"
          test "$concepts" = "$EXP_CONCEPTS"
          test "$lexemes" = "$EXP_LEXEMES"
          test "$utterances" = "$EXP_UTTERANCES"
          test "$dialogues" = "$EXP_DIALOGUES"
          test "$exercises" = "$EXP_EXERCISES"
      - name: Verify B1 idempotency
        run: |
          q(){ mysql -N -s -h127.0.0.1 -P3306 -uroot language_learning -e "$1"; }
          snap(){ q "SELECT CONCAT((SELECT COUNT(*) FROM lessons le JOIN courses c ON c.id=le.course_id WHERE c.slug='fa-tr-tr'),'|',(SELECT COUNT(*) FROM exercises e JOIN lessons le ON le.id=e.lesson_id JOIN courses c ON c.id=le.course_id WHERE c.slug='fa-tr-tr'),'|',(SELECT COUNT(*) FROM lesson_items li JOIN lessons le ON le.id=li.lesson_id JOIN courses c ON c.id=le.course_id WHERE c.slug='fa-tr-tr'));"; }
          before=$(snap)
          python database/import/tr/b1.py --allow-unreviewed
          after=$(snap)
          echo "before=$before after=$after"
          test "$before" = "$after"
