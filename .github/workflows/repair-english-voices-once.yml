name: Repair English Character Voices Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-english-voices-once.yml'

permissions:
  contents: write

concurrency:
  group: repair-english-character-voices
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      CONTENT_TTS_CONCURRENCY: '2'
      ELEVENLABS_MODEL_ID: eleven_multilingual_v2
      ELEVENLABS_DIALOGUE_MODEL_ID: eleven_multilingual_v2
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Require ElevenLabs connection
        run: |
          if [ -z "${ELEVENLABS_API_KEY:-}" ]; then
            echo 'ELEVENLABS_API_KEY GitHub secret is missing.' >&2
            exit 2
          fi

      - name: Configure git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Compile voice tooling
        run: |
          python -m py_compile \
            scripts/voice_quality.py \
            scripts/audit_voice_lock.py \
            scripts/resolve_audio_voices.py \
            scripts/generate_audio.py \
            scripts/validate_character_cast.py \
            scripts/audit_audio_voice_consistency.py

      - name: Correct Eli cast metadata and invalidate Eli and Liam locks
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          cast_path = Path('audio/cast/en-US.json')
          cast = json.loads(cast_path.read_text(encoding='utf-8'))
          eli = cast['characters']['eli']
          eli['persona']['voice_presentation'] = 'female'
          eli['persona']['style'] = 'bright_social'
          eli['voice_profile'] = 'female_bright'
          cast_path.write_text(json.dumps(cast, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          lock_path = Path('audio/voices/en-US.lock.json')
          locks = json.loads(lock_path.read_text(encoding='utf-8'))
          for key in list(locks):
              if key.startswith('character:eli:') or key.startswith('character:liam:'):
                  del locks[key]
          lock_path.write_text(json.dumps(locks, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          python scripts/validate_character_cast.py

      - name: Remove legacy mismatched character locks
        run: |
          python scripts/audit_voice_lock.py --repair-legacy

      - name: Rebuild strict manifests for every English level
        run: |
          mkdir -p audio/manifests/en
          python scripts/build_audio_manifest.py content/production/en/Pre-A1 --level Pre-A1 --locale en-US --strict-characters --output audio/manifests/en/Pre-A1.json
          python scripts/build_audio_manifest.py content/production/en/A1 --level A1 --locale en-US --strict-characters --output audio/manifests/en/A1.json
          python scripts/build_audio_manifest.py content/production/en/A2 --level A2 --locale en-US --strict-characters --output audio/manifests/en/A2.json
          python scripts/build_audio_manifest.py content/production/en/B1 --level B1 --locale en-US --strict-characters --output audio/manifests/en/B1.json
          python scripts/build_audio_manifest.py content/production/en/B2 --level B2 --locale en-US --strict-characters --output audio/manifests/en/B2.json
          python scripts/build_audio_manifest.py content/production/en/C1 --level C1 --locale en-US --strict-characters --output audio/manifests/en/C1.json
          python scripts/build_audio_manifest.py content/production/en/C2 --level C2 --locale en-US --strict-characters --output audio/manifests/en/C2.json

      - name: Resolve all persona-compatible character voices before TTS
        run: |
          for level in Pre-A1 A1 A2 B1 B2 C1 C2; do
            python scripts/resolve_audio_voices.py "audio/manifests/en/${level}.json" --write-lock
          done
          python scripts/audit_voice_lock.py --strict
          python scripts/validate_character_cast.py

      - name: Checkpoint cast manifests and voice lock
        run: |
          git add audio/cast/en-US.json audio/voices/en-US.lock.json audio/manifests/en
          if ! git diff --cached --quiet; then
            git commit -m 'Correct English cast and lock persona-compatible voices [skip ci]'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

      - name: Regenerate validate and checkpoint each English level
        shell: bash
        run: |
          set -euo pipefail

          export_sql() {
            case "$1" in
              Pre-A1) out='database/import/en/pre_a1_audio.sql' ;;
              A1) out='database/import/en/a1_audio.sql' ;;
              A2) out='database/import/en/a2_audio.sql' ;;
              B1) out='database/import/en/b1_audio.sql' ;;
              B2) out='database/import/en/b2_audio.sql' ;;
              C1) out='database/import/en/c1_audio.sql' ;;
              C2) out='database/import/en/c2_audio.sql' ;;
              *) echo "Unknown level $1" >&2; return 2 ;;
            esac
            python scripts/export_audio_sql.py "audio/manifests/en/$1.json" --status validated --output "$out"
          }

          generate_with_retry() {
            level="$1"
            for attempt in 1 2 3 4 5; do
              if python scripts/generate_audio.py "audio/manifests/en/${level}.json" \
                --confirm-paid-generation --concurrency 2; then
                return 0
              fi
              if [ "$attempt" -eq 5 ]; then
                echo "Audio generation failed for ${level} after ${attempt} attempts" >&2
                return 1
              fi
              sleep $((attempt * 15))
            done
          }

          for level in Pre-A1 A1 A2 B1 B2 C1 C2; do
            echo "=== Repairing ${level} ==="
            generate_with_retry "$level"
            python scripts/validate_audio_manifest.py "audio/manifests/en/${level}.json" --require-generated
            python scripts/audit_audio_voice_consistency.py "audio/manifests/en/${level}.json"
            export_sql "$level"

            git add audio/generated/en-US audio/voices/en-US.lock.json "audio/manifests/en/${level}.json" database/import/en/*_audio.sql
            if ! git diff --cached --quiet; then
              git commit -m "Repair English ${level} character audio [skip ci]"
              git fetch origin main
              git rebase origin/main
              git push origin HEAD:main
            fi
          done

      - name: Final global cast and effective voice audit
        run: |
          python scripts/validate_character_cast.py
          python scripts/audit_voice_lock.py --strict
          python scripts/audit_audio_voice_consistency.py \
            audio/manifests/en/Pre-A1.json \
            audio/manifests/en/A1.json \
            audio/manifests/en/A2.json \
            audio/manifests/en/B1.json \
            audio/manifests/en/B2.json \
            audio/manifests/en/C1.json \
            audio/manifests/en/C2.json

      - name: Remove one-time workflow after successful repair
        run: |
          git rm .github/workflows/repair-english-voices-once.yml
          git commit -m 'Complete English character voice repair [skip ci]'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
