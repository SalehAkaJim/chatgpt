name: Nova Prototype Preview

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nova-prototype-preview.yml'
      - 'nova/prototype/**'
      - 'nova/courses/**/course.source.json'
      - 'nova/courses/**/lessons/**/lesson.source.json'
      - 'nova/courses/**/lessons/**/audio.manifest.json'
      - 'nova/curriculum/**/factory_validation.json'
      - 'nova/audio/**'
      - 'nova/_assistant/content-system-v1/tools/build_prototype_preview.py'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: nova-prototype-preview
  cancel-in-progress: true

jobs:
  build-preview:
    runs-on: ubuntu-latest
    outputs:
      pages_enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build preview from committed PASS evidence
        run: |
          python nova/_assistant/content-system-v1/tools/build_prototype_preview.py \
            --repo-root . \
            --course en-fa \
            --output _site
          node --check _site/nova/prototype/app.js
          python - <<'PY'
          import json
          from pathlib import Path
          catalog = json.loads(Path('_site/nova/courses/index.json').read_text(encoding='utf-8'))
          meta = json.loads(Path('_site/nova/prototype/preview-meta.json').read_text(encoding='utf-8'))
          assert catalog['preview'] is True
          assert len(catalog['lessons']) == meta['lessonCount'] > 0
          assert catalog['lessons'][-1]['lessonKey'] == meta['lastLesson']
          print(f"Preview contains {meta['lessonCount']} validated Lessons; last={meta['lastLesson']}")
          PY

      - name: Upload private preview bundle
        uses: actions/upload-artifact@v4
        with:
          name: nova-prototype-preview
          path: _site/
          if-no-files-found: error
          retention-days: 14

      - name: Detect existing GitHub Pages configuration
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=$(curl -sS -o /tmp/pages.json -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")
          if [ "$code" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "GitHub Pages is already enabled; the validated preview will be deployed."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "GitHub Pages is not configured; keeping the preview private as an Actions artifact."
          fi

      - name: Configure existing Pages site
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy-pages:
    if: needs.build-preview.outputs.pages_enabled == 'true'
    needs: build-preview
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy latest validated Nova preview
        id: deployment
        uses: actions/deploy-pages@v4
