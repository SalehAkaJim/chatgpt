name: Nova Prototype Preview

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: nova-prototype-preview
  cancel-in-progress: true

jobs:
  build-preview:
    runs-on: ubuntu-latest
    outputs:
      pages_enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate local preview launcher
        run: python -m py_compile nova/prototype/local_preview.py

      - name: Require PASS evidence for the exact Lesson bytes
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path

          root = Path('.')
          factory = json.loads((root / 'nova/curriculum/en-fa/factory_validation.json').read_text(encoding='utf-8'))
          assert factory.get('status') == 'PASS' and factory.get('factoryDesignStatus') == 'PASS'
          reports = sorted((r for r in factory.get('lessonReports', []) if r.get('status') == 'PASS'), key=lambda r: r['sortOrder'])
          assert len(reports) == factory.get('passedPrefixLength')
          for report in reports:
              number = f"{int(report['sortOrder']):04d}"
              lesson_dir = root / 'nova/courses/en-fa/lessons' / number
              source = lesson_dir / 'lesson.source.json'
              evidence = lesson_dir / 'validation.json'
              assert source.is_file() and evidence.is_file(), f'Missing current evidence for Lesson {number}'
              current_hash = hashlib.sha256(source.read_bytes()).hexdigest()
              validation = json.loads(evidence.read_text(encoding='utf-8'))
              assert validation.get('status') == 'PASS', f'Lesson {number} validation is not PASS'
              assert validation.get('lessonKey') == report.get('lessonKey'), f'Lesson {number} evidence key mismatch'
              assert validation.get('sourceHash') == current_hash, f'Lesson {number} changed after its PASS evidence; preview publish blocked'
          print(f'Exact-byte evidence confirmed for {len(reports)} Lessons')
          PY

      - name: Build preview from committed PASS evidence
        run: |
          python nova/_assistant/content-system-v1/tools/build_prototype_preview.py \
            --repo-root . \
            --course en-fa \
            --output _site
          node --check _site/nova/prototype/app.js
          python - <<'PY'
          import json
          from pathlib import Path
          catalog = json.loads(Path('_site/nova/courses/index.json').read_text(encoding='utf-8'))
          meta = json.loads(Path('_site/nova/prototype/preview-meta.json').read_text(encoding='utf-8'))
          assert catalog['preview'] is True
          assert len(catalog['lessons']) == meta['lessonCount'] > 0
          assert catalog['lessons'][-1]['lessonKey'] == meta['lastLesson']
          print(f"Preview contains {meta['lessonCount']} validated Lessons; last={meta['lastLesson']}")
          PY

      - name: Test generated Preview learner experience end to end
        env:
          NOVA_CONTENT_ROOT: _site
          NOVA_PROTOTYPE_DIR: _site/nova/prototype
          NOVA_PREVIEW_MODE: '1'
        run: |
          npm ci --prefix nova/_assistant/content-system-v1/tools --no-audit --no-fund
          node nova/_assistant/content-system-v1/tools/test_prototype.cjs

      - name: Upload private preview bundle
        uses: actions/upload-artifact@v4
        with:
          name: nova-prototype-preview
          path: _site/
          if-no-files-found: error
          retention-days: 14

      - name: Detect existing GitHub Pages configuration
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=$(curl -sS -o /tmp/pages.json -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")
          if [ "$code" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "GitHub Pages is already enabled; the validated preview will be deployed."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "GitHub Pages is not configured; keeping the preview private as an Actions artifact."
          fi

      - name: Configure existing Pages site
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy-pages:
    if: needs.build-preview.outputs.pages_enabled == 'true'
    needs: build-preview
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy latest validated Nova preview
        id: deployment
        uses: actions/deploy-pages@v4
