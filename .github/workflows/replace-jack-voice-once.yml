name: Replace Jack Voice Once

on:
  push:
    paths:
      - '.github/workflows/replace-jack-voice-once.yml'

permissions:
  contents: write

jobs:
  replace-jack-voice:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install audio dependencies
        run: pip install requests mutagen

      - name: Require ElevenLabs connection
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          test -n "$ELEVENLABS_API_KEY" || (echo "ELEVENLABS_API_KEY is required" && exit 2)

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Select a softer natural voice for Jack and build filtered manifests
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path
          import requests

          root = Path('.')
          lock_path = root / 'audio/voices/en-US.lock.json'
          locks = json.loads(lock_path.read_text(encoding='utf-8'))
          key = 'character:jack:male_warm'
          old = locks.get(key)
          if not old:
              raise SystemExit(f'Missing existing lock: {key}')

          params = {
              'page_size': 100,
              'include_total_count': 'false',
              'language': 'en',
              'accent': 'american',
              'high_quality': 'true',
          }
          r = requests.get(
              'https://api.elevenlabs.io/v2/voices',
              headers={'xi-api-key': os.environ['ELEVENLABS_API_KEY']},
              params=params,
              timeout=30,
          )
          r.raise_for_status()
          voices = r.json().get('voices', [])

          reserved = {
              value.get('voice_id')
              for lock_key, value in locks.items()
              if lock_key.startswith('character:') and lock_key != key and value.get('voice_id')
          }
          old_id = old.get('voice_id')

          positive = {
              'soft': 8, 'smooth': 8, 'gentle': 8, 'warm': 5, 'natural': 7,
              'friendly': 6, 'conversational': 8, 'clear': 5, 'relaxed': 6,
              'soothing': 7, 'kind': 5, 'calm': 5, 'youthful': 4, 'young': 4,
              'pleasant': 6, 'casual': 4, 'approachable': 6, 'easygoing': 6,
          }
          negative = {
              'deep': 12, 'raspy': 15, 'rough': 15, 'gritty': 15, 'aggressive': 20,
              'intense': 12, 'authoritative': 10, 'dramatic': 10, 'rugged': 15,
              'gravelly': 20, 'gravel': 20, 'booming': 18, 'baritone': 12,
              'husky': 15, 'growl': 20, 'harsh': 25, 'powerful': 8,
          }

          def tokens(text):
              return set(re.findall(r"[a-z]+", text.casefold()))

          def score(v):
              labels = {str(k).casefold(): str(val).casefold() for k, val in (v.get('labels') or {}).items()}
              text = ' '.join([
                  v.get('name') or '',
                  v.get('description') or '',
                  json.dumps(labels, ensure_ascii=False),
              ])
              ws = tokens(text)
              s = sum(weight for word, weight in positive.items() if word in ws)
              s -= sum(weight for word, weight in negative.items() if word in ws)
              if labels.get('gender') == 'male':
                  s += 10
              if labels.get('age') == 'young':
                  s += 6
              elif labels.get('age') == 'middle_aged':
                  s += 1
              if labels.get('use_case') in {'conversational', 'social_media'}:
                  s += 7
              descriptive = labels.get('descriptive', '')
              if descriptive in {'soft', 'calm', 'gentle', 'warm', 'casual', 'upbeat'}:
                  s += 5
              return s

          candidates = []
          for v in voices:
              labels = {str(k).casefold(): str(val).casefold() for k, val in (v.get('labels') or {}).items()}
              vid = v.get('voice_id')
              if not vid or vid == old_id or vid in reserved:
                  continue
              if labels.get('gender') != 'male':
                  continue
              text = ' '.join([v.get('name') or '', v.get('description') or '', json.dumps(labels)])
              ws = tokens(text)
              if any(word in ws for word in {'raspy','rough','gritty','aggressive','rugged','gravelly','booming','husky','growl','harsh'}):
                  continue
              candidates.append((score(v), v))

          if not candidates:
              raise SystemExit('No suitable unused soft/natural male American voice candidate found for Jack')

          candidates.sort(key=lambda pair: (-pair[0], pair[1].get('name') or '', pair[1].get('voice_id') or ''))
          best_score, chosen = candidates[0]
          chosen_labels = chosen.get('labels') or {}
          locks[key] = {
              'voice_id': chosen['voice_id'],
              'voice_name': chosen.get('name'),
              'description': chosen.get('description'),
              'labels': chosen_labels,
              'source': 'voice_library',
              'public_owner_id': chosen.get('public_owner_id'),
              'requested_voice_name': None,
              'selection_reason': 'Jack replacement: prioritize soft, smooth, gentle, natural, friendly conversational delivery and reject harsh/rough/raspy/gritty voices.',
          }
          lock_path.write_text(json.dumps(locks, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          work = Path('/tmp/jack_voice_replace')
          work.mkdir(parents=True, exist_ok=True)
          usages = []
          levels = []
          for path in sorted((root / 'audio/manifests/en').glob('*.json')):
              manifest = json.loads(path.read_text(encoding='utf-8'))
              items = [item for item in manifest.get('items', []) if item.get('voice_key') == key]
              if not items:
                  continue
              levels.append(manifest.get('level') or path.stem)
              filtered = dict(manifest)
              filtered['items'] = items
              out = work / path.name
              out.write_text(json.dumps(filtered, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
              for item in items:
                  usages.append({
                      'level': manifest.get('level') or path.stem,
                      'audio_key': item['audio_key'],
                      'text': item['text'],
                      'relative_path': item['relative_path'],
                      'entity_refs': item.get('entity_refs', []),
                  })

          if not usages:
              raise SystemExit('No Jack audio usages found in English manifests')

          selection = {
              'voice_key': key,
              'old_voice': old,
              'new_voice': locks[key],
              'selection_score': best_score,
              'usage_count': len(usages),
              'levels': levels,
              'usages': usages,
          }
          Path('/tmp/jack_selection.json').write_text(json.dumps(selection, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps({
              'old_voice': old.get('voice_name'),
              'new_voice': chosen.get('name'),
              'new_voice_id': chosen.get('voice_id'),
              'selection_score': best_score,
              'usage_count': len(usages),
              'levels': levels,
          }, ensure_ascii=False))
          PY

      - name: Regenerate every Jack audio file
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          CONTENT_TTS_CONCURRENCY: '2'
        run: |
          set -euo pipefail
          for manifest in /tmp/jack_voice_replace/*.json; do
            echo "Generating Jack items from $manifest"
            python scripts/generate_audio.py "$manifest" --confirm-paid-generation --concurrency 2
          done

      - name: Verify every Jack file uses exactly the new voice
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          root = Path('.')
          selection = json.loads(Path('/tmp/jack_selection.json').read_text(encoding='utf-8'))
          old_id = selection['old_voice'].get('voice_id')
          new_id = selection['new_voice']['voice_id']
          new_name = selection['new_voice'].get('voice_name')
          seen = []
          by_level = Counter()

          for usage in selection['usages']:
              audio = root / usage['relative_path']
              sidecar = audio.with_suffix(audio.suffix + '.json')
              if not audio.exists():
                  raise SystemExit(f'Missing regenerated Jack audio: {audio}')
              if not sidecar.exists():
                  raise SystemExit(f'Missing Jack sidecar: {sidecar}')
              meta = json.loads(sidecar.read_text(encoding='utf-8'))
              if meta.get('voice_key') != selection['voice_key']:
                  raise SystemExit(f'Wrong voice_key for {audio}: {meta.get("voice_key")}')
              if meta.get('voice_id') != new_id:
                  raise SystemExit(f'Wrong voice_id for {audio}: {meta.get("voice_id")} != {new_id}')
              if meta.get('voice_id') == old_id:
                  raise SystemExit(f'Old Jack voice still present: {audio}')
              seen.append(meta.get('voice_id'))
              by_level[usage['level']] += 1

          if len(set(seen)) != 1:
              raise SystemExit(f'Jack is inconsistent across files: {sorted(set(seen))}')
          if len(seen) != selection['usage_count']:
              raise SystemExit(f'Jack usage verification count mismatch: {len(seen)} != {selection["usage_count"]}')

          report = {
              **selection,
              'verified': True,
              'verified_voice_id': new_id,
              'verified_voice_name': new_name,
              'verified_usage_count': len(seen),
              'usages_by_level': dict(sorted(by_level.items())),
              'all_files_same_voice': True,
              'old_voice_fully_replaced_for_manifested_jack_items': True,
          }
          report_path = root / 'audio/reports/jack-voice-replacement.json'
          report_path.parent.mkdir(parents=True, exist_ok=True)
          report_path.write_text(json.dumps(report, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps({
              'verified': True,
              'new_voice': new_name,
              'voice_id': new_id,
              'usage_count': len(seen),
              'by_level': dict(sorted(by_level.items())),
          }, ensure_ascii=False))
          PY

      - name: Commit Jack voice replacement
        run: |
          git add audio/voices/en-US.lock.json audio/generated/en-US/dialogues audio/reports/jack-voice-replacement.json
          if git diff --cached --quiet; then
            echo "No Jack voice changes to commit"
            exit 1
          fi
          git commit -m "Replace Jack with a softer natural voice [skip ci]"
          git push

      - name: Remove one-time workflow
        run: |
          git rm .github/workflows/replace-jack-voice-once.yml
          git commit -m "Remove one-time Jack voice workflow [skip ci]"
          git push
