name: Nova Lesson Production

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nova-pilot.yml'
      - 'nova/courses/**/course.source.json'
      - 'nova/courses/**/audio_voices.json'
      - 'nova/courses/**/lessons/**/lesson.source.json'
      - 'nova/courses/**/lessons/**/pedagogy.review.json'
      - 'nova/curriculum/**'
      - 'nova/prototype/**'
      - 'nova/calibration/**'
      - 'nova/reference/**'
      - 'nova/reference-snapshots/**'
      - 'nova/_assistant/content-system-v1/lesson.source.schema.json'
      - 'nova/_assistant/content-system-v1/persian_orthography_exceptions.json'
      - 'nova/_assistant/content-system-v1/pedagogy_review_migrations.json'
      - 'nova/_assistant/content-system-v1/content_quality.policy.json'
      - 'nova/_assistant/content-system-v1/tools/**'
      - 'nova/mysql/01_reset_all.sql'
      - 'nova/mysql/02_schema.sql'
      - 'nova/mysql/03_runtime_lesson_query.sql'
      - 'nova/mysql/04_cleanup_orphan_nonword_lexical_items.sql'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

# One writer owns the shared curriculum state, lexical registry and generated outputs.
concurrency:
  group: nova-production-main
  cancel-in-progress: false

jobs:
  validate-production:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:9.0.1
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: nova_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      MYSQL_PWD: root
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Record exact input revision
        run: echo "INPUT_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore reusable local validation cache
        uses: actions/cache@v4
        with:
          path: .cache/nova-validation
          key: nova-validation-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            nova-validation-${{ runner.os }}-
      - name: Install system dependencies
        timeout-minutes: 8
        run: |
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ffmpeg default-mysql-client
      - name: Install Python dependencies
        timeout-minutes: 5
        run: pip install --disable-pip-version-check -r nova/_assistant/content-system-v1/tools/requirements.txt
      - name: Install Node dependencies
        timeout-minutes: 5
        run: npm ci --prefix nova/_assistant/content-system-v1/tools --no-audit --no-fund
      - name: Run regression tests
        run: |
          python nova/_assistant/content-system-v1/tools/test_content_quality.py
          python nova/_assistant/content-system-v1/tools/test_persian_orthography_exceptions.py
          python nova/_assistant/content-system-v1/tools/test_reference_data.py
          python nova/_assistant/content-system-v1/tools/test_reference_catalog.py
          python nova/_assistant/content-system-v1/tools/test_lesson_reference.py
          PYTHONPATH=nova/_assistant/content-system-v1/tools python -m unittest -v test_factory_design
          PYTHONPATH=nova/_assistant/content-system-v1/tools python -m unittest -v test_factory_wave
          python nova/_assistant/content-system-v1/tools/validate_reference_data.py --repo-root . --strict
          python nova/_assistant/content-system-v1/tools/reference_catalog.py --repo-root . --level A1 --limit 3 --recommend > /tmp/nova_reference_smoke.json
          python -c 'import json; p=json.load(open("/tmp/nova_reference_smoke.json")); assert p["count"] > 0'
          python -m unittest discover -s nova/_assistant/content-system-v1/tools -p 'test_pipeline.py' -v
          python -m unittest discover -s nova/_assistant/content-system-v1/tools -p 'test_pedagogy.py' -v
          python nova/_assistant/content-system-v1/tools/validate_calibration.py
          python nova/_assistant/content-system-v1/tools/validate_persian_text.py --exceptions nova/_assistant/content-system-v1/persian_orthography_exceptions.json nova/calibration/en-fa/*.json
          node --check nova/prototype/app.js
          node nova/_assistant/content-system-v1/tools/test_prototype.cjs
      - name: Build source-driven curriculum state and next Lesson spec
        run: |
          python nova/_assistant/content-system-v1/tools/run_curriculum_pipeline.py \
            --repo-root . \
            --course en-fa \
            --config nova/curriculum/en-fa/factory.config.json \
            --workspace-dir nova/curriculum/en-fa
      - name: Run cacheable per-Lesson authoring gates
        run: |
          python nova/_assistant/content-system-v1/tools/validate_factory_incremental.py \
            --repo-root . \
            --config nova/curriculum/en-fa/factory.config.json \
            --cache-dir .cache/nova-validation \
            --output /tmp/nova_incremental_validation.json
      - name: Run uncached full-prefix Reference, Naturalness, Generativity, Story and quality regression
        run: |
          python nova/_assistant/content-system-v1/tools/validate_factory_prefix.py \
            --repo-root . \
            --config nova/curriculum/en-fa/factory.config.json \
            --output nova/curriculum/en-fa/factory_validation.json
      - name: Plan or reuse next parallel authoring wave
        run: |
          NEXT=$(python - <<'PY'
          from pathlib import Path
          root = Path('nova/courses/en-fa/lessons')
          nums = [int(p.name) for p in root.iterdir() if p.is_dir() and p.name.isdigit() and (p / 'lesson.source.json').exists()]
          print(max(nums, default=0) + 1)
          PY
          )
          SIZE=$(python -c 'import json; print(json.load(open("nova/curriculum/en-fa/factory.config.json"))["waveSize"])')
          LEVEL=$(python -c 'import json; print(json.load(open("nova/curriculum/en-fa/factory.config.json"))["level"])')
          LAST=$((NEXT + SIZE - 1))
          WAVE=$(printf 'nova/curriculum/en-fa/waves/en-fa-%s-%04d-%04d/wave.json' "$LEVEL" "$NEXT" "$LAST")
          if [ -f "$WAVE" ]; then
            echo "Reusing existing authoring wave: $WAVE"
          else
            python nova/_assistant/content-system-v1/tools/factory_wave.py plan \
              --repo-root . \
              --config nova/curriculum/en-fa/factory.config.json \
              --workspace-dir nova/curriculum/en-fa \
              --workers "$SIZE"
          fi
      - name: Audit Lesson lexical coverage against reference snapshot
        run: python nova/_assistant/content-system-v1/tools/audit_lesson_reference_coverage.py --repo-root . --output /tmp/nova_reference_lesson_coverage.json
      - name: Build exact text QA evidence for every canonical Lesson
        id: text_build
        run: python nova/_assistant/content-system-v1/tools/build_pilot.py --repo-root . --text-only
      - name: Publish validated text evidence for Prototype testing
        run: |
          git fetch origin main
          if [ "$INPUT_HEAD" != "$(git rev-parse origin/main)" ]; then
            echo "Inputs changed during text QA; a newer queued run will publish the current evidence."
            echo "PUBLISH_HEAD=$INPUT_HEAD" >> "$GITHUB_ENV"
            exit 0
          fi
          git config user.name "nova-production-bot"
          git config user.email "nova-production-bot@users.noreply.github.com"
          git add nova/curriculum/ nova/courses/ nova/_assistant/content-system-v1/text_build_report.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish validated Nova text preview evidence"
            git push origin HEAD:main
          fi
          echo "PUBLISH_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Trigger exact-byte Prototype preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run nova-prototype-preview.yml --ref main
      - name: Build paid audio and SQL after text gates
        id: build
        run: python nova/_assistant/content-system-v1/tools/build_pilot.py --repo-root .
      - name: Import and retrieve all Lessons on MySQL 9.0.1
        run: python nova/_assistant/content-system-v1/tools/validate_runtime.py --repo-root . --database nova_test
      - name: Refresh evidence-based production status
        run: python nova/_assistant/content-system-v1/tools/update_pilot_status.py --repo-root .
      - name: Retain production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nova-production-evidence
          path: |
            nova/_assistant/content-system-v1/build_report.json
            nova/_assistant/content-system-v1/text_build_report.json
            nova/curriculum/en-fa/*.json
            nova/curriculum/en-fa/specs/*.json
            nova/courses/**/lessons/**/*.json
            nova/courses/**/lessons/**/english_audit.md
            nova/courses/**/lessons/**/runtime_smoke.txt
            nova/audio/
      - name: Commit verified audio/runtime outputs for the same text revision
        run: |
          git fetch origin main
          if [ "${PUBLISH_HEAD:-$INPUT_HEAD}" != "$(git rev-parse origin/main)" ]; then
            echo "Inputs changed after text publication; the newer queued run will rebuild runtime outputs."
            exit 0
          fi
          git config user.name "nova-production-bot"
          git config user.email "nova-production-bot@users.noreply.github.com"
          git add nova/courses/ nova/curriculum/ nova/audio/ nova/mysql/ nova/_assistant/content-system-v1/10_status.json nova/_assistant/content-system-v1/build_report.json nova/_assistant/content-system-v1/text_build_report.json
          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git commit -m "Build and validate Nova production lessons"
            git push origin HEAD:main
          fi
      - name: Preserve paid audio checkpoints after a failed audio/runtime build
        if: failure() && steps.build.outcome != 'skipped'
        run: |
          git fetch origin main
          if [ "${PUBLISH_HEAD:-$INPUT_HEAD}" != "$(git rev-parse origin/main)" ]; then
            echo "Inputs changed; audio checkpoints remain available in the evidence artifact."
            exit 0
          fi
          git config user.name "nova-production-bot"
          git config user.email "nova-production-bot@users.noreply.github.com"
          git add nova/audio/ ':(glob)nova/courses/**/audio.manifest.json'
          if ! git diff --cached --quiet; then
            git commit -m "Checkpoint Nova audio after failed production validation"
            git push origin HEAD:main
          fi
