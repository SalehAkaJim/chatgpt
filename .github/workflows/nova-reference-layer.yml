name: Nova Reference Layer

on:
  pull_request:
    branches: [main]
    paths:
      - 'nova/_assistant/content-system-v1/tools/reference_layer.py'
      - 'nova/_assistant/content-system-v1/tools/reference_policy.py'
      - 'nova/_assistant/content-system-v1/tools/curated_supplement.py'
      - 'nova/_assistant/content-system-v1/tools/test_reference_layer.py'
      - 'nova/_assistant/content-system-v1/tools/test_reference_policy.py'
      - 'nova/_assistant/content-system-v1/tools/test_curated_supplement.py'
      - 'nova/reference/**'
      - 'nova/courses/en-fa/lessons/**/lesson.source.json'
      - '.github/workflows/nova-reference-layer.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reference ingestion tests
        run: python nova/_assistant/content-system-v1/tools/test_reference_layer.py
      - name: Production reference policy tests
        run: python nova/_assistant/content-system-v1/tools/test_reference_policy.py
      - name: Curated supplement tests
        run: python nova/_assistant/content-system-v1/tools/test_curated_supplement.py

  live-a1-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Sync Openjam + CEFR-J A1
        run: |
          python nova/_assistant/content-system-v1/tools/reference_layer.py sync \
            --level A1 \
            --output /tmp/reference.a1.raw.json
      - name: Validate raw snapshot
        run: |
          python nova/_assistant/content-system-v1/tools/reference_layer.py validate \
            --snapshot /tmp/reference.a1.raw.json
      - name: Build POS-safe production pool and compare lessons
        run: |
          python nova/_assistant/content-system-v1/tools/reference_policy.py \
            --snapshot /tmp/reference.a1.raw.json \
            --pool-output /tmp/reference.a1.production.json \
            --lessons-root nova/courses/en-fa/lessons \
            --report-output /tmp/a1-lesson-reference-report.json
      - name: Resolve external gaps with Nova curated supplement
        run: |
          set +e
          python nova/_assistant/content-system-v1/tools/curated_supplement.py \
            --pool /tmp/reference.a1.production.json \
            --lessons-root nova/courses/en-fa/lessons \
            --status nova/_assistant/content-system-v1/10_status.json \
            --output /tmp/reference.a1.local-supplement.json \
            --coverage-output /tmp/a1-resolved-coverage.json
          code=$?
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('/tmp/reference.a1.local-supplement.json').read_text(encoding='utf-8'))
          c=json.loads(Path('/tmp/a1-resolved-coverage.json').read_text(encoding='utf-8'))
          print('NOT_ELIGIBLE_SUPPLEMENT_ITEMS')
          for item in s['items']:
              if not item['eligibleForReference']:
                  print(json.dumps(item, ensure_ascii=False))
          print('UNRESOLVED_CANONICAL_ITEMS')
          for item in c['unresolved']:
              print(json.dumps(item, ensure_ascii=False))
          PY
          exit $code
      - name: Prepare versioned production files
        run: |
          mkdir -p nova/reference/snapshots/en-fa/a1 nova/reference/reports/en-fa
          cp /tmp/reference.a1.production.json nova/reference/snapshots/en-fa/a1/lexical.production.json
          cp /tmp/reference.a1.local-supplement.json nova/reference/snapshots/en-fa/a1/local-supplement.production.json
          cp /tmp/a1-lesson-reference-report.json nova/reference/reports/en-fa/a1-current-lessons.json
          cp /tmp/a1-resolved-coverage.json nova/reference/reports/en-fa/a1-resolved-coverage.json
          python - <<'PY'
          import json
          from pathlib import Path
          raw=json.loads(Path('/tmp/reference.a1.raw.json').read_text(encoding='utf-8'))
          out={
            'schemaVersion':'1.0.0',
            'courseCode':'en-fa',
            'level':'A1',
            'sources':raw['sources'],
            'sourcePolicy':raw['sourcePolicy'],
            'grammarTargets':raw['grammarTargets'],
          }
          Path('nova/reference/snapshots/en-fa/a1/grammar.production.json').write_text(
              json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: nova-reference-a1
          path: |
            /tmp/reference.a1.raw.json
            nova/reference/snapshots/en-fa/a1/lexical.production.json
            nova/reference/snapshots/en-fa/a1/local-supplement.production.json
            nova/reference/snapshots/en-fa/a1/grammar.production.json
            nova/reference/reports/en-fa/a1-current-lessons.json
            nova/reference/reports/en-fa/a1-resolved-coverage.json
          retention-days: 14
      - name: Commit validated snapshot to PR branch
        if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]'
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$BRANCH"
          git checkout "$BRANCH"
          git add nova/reference/snapshots/en-fa/a1 nova/reference/reports/en-fa/a1-current-lessons.json nova/reference/reports/en-fa/a1-resolved-coverage.json
          if git diff --cached --quiet; then
            echo "Reference snapshot unchanged."
          else
            git commit -m "Snapshot Nova A1 reference data"
            git push origin "$BRANCH"
          fi
