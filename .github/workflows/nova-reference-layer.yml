name: Nova Reference Layer

on:
  pull_request:
    branches: [main]
    paths:
      - 'nova/_assistant/content-system-v1/tools/reference_layer.py'
      - 'nova/_assistant/content-system-v1/tools/reference_policy.py'
      - 'nova/_assistant/content-system-v1/tools/test_reference_layer.py'
      - 'nova/_assistant/content-system-v1/tools/test_reference_policy.py'
      - 'nova/reference/**'
      - 'nova/courses/en-fa/lessons/**/lesson.source.json'
      - '.github/workflows/nova-reference-layer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reference ingestion tests
        run: python nova/_assistant/content-system-v1/tools/test_reference_layer.py
      - name: Production reference policy tests
        run: python nova/_assistant/content-system-v1/tools/test_reference_policy.py

  live-a1-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Sync Openjam + CEFR-J A1
        run: |
          python nova/_assistant/content-system-v1/tools/reference_layer.py sync \
            --level A1 \
            --output /tmp/reference.a1.raw.json
      - name: Validate raw snapshot
        run: |
          python nova/_assistant/content-system-v1/tools/reference_layer.py validate \
            --snapshot /tmp/reference.a1.raw.json
      - name: Build POS-safe production pool and compare lessons
        run: |
          python nova/_assistant/content-system-v1/tools/reference_policy.py \
            --snapshot /tmp/reference.a1.raw.json \
            --pool-output /tmp/reference.a1.production.json \
            --lessons-root nova/courses/en-fa/lessons \
            --report-output /tmp/a1-lesson-reference-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: nova-reference-a1
          path: |
            /tmp/reference.a1.raw.json
            /tmp/reference.a1.production.json
            /tmp/a1-lesson-reference-report.json
          retention-days: 14
