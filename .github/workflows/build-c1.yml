name: Build English C1 Content

on:
  push:
    branches: [main]
    paths:
      - 'scripts/generate_c1_support.py'
      - 'scripts/generate_c1_01_10.py'
      - 'scripts/generate_c1_11_20.py'
      - 'scripts/generate_c1_21_30.py'
      - 'scripts/generate_c1_31_40.py'
      - 'scripts/generate_c1_41_45.py'
      - 'database/import/en/c1.py'
      - 'database/seed/english-c1-curriculum.sql'
      - '.github/workflows/build-c1.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-english-c1
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate all C1 production units
        env:
          PYTHONPATH: .
        run: |
          python scripts/generate_c1_01_10.py
          python scripts/generate_c1_11_20.py
          python scripts/generate_c1_21_30.py
          python scripts/generate_c1_31_40.py
          python scripts/generate_c1_41_45.py

      - name: Validate all C1 production batches
        run: |
          set -e
          for f in content/production/en/C1/*.json; do
            python scripts/validate_content.py "$f"
          done

      - name: Verify complete C1 curriculum coverage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          expected = [
              'c1-reading-between-lines','c1-complex-anecdotes','c1-precision-reformulation',
              'c1-ambiguity-clarification','c1-tone-subtext','c1-speculation-inference',
              'c1-counterfactual-reasoning','c1-weighing-evidence','c1-qualifying-claims',
              'c1-diplomatic-disagreement','c1-persuasion-concession','c1-negotiating-tradeoffs',
              'c1-chairing-discussions','c1-turn-taking-interruption','c1-conflict-deescalation',
              'c1-critical-feedback','c1-strategic-priorities','c1-risk-contingency',
              'c1-professional-networking','c1-leadership-interviews','c1-academic-discussion',
              'c1-synthesizing-sources','c1-comparing-viewpoints','c1-evaluating-methods',
              'c1-presenting-arguments','c1-formal-proposals','c1-media-framing-bias',
              'c1-news-analysis','c1-tech-ethics','c1-environment-policy','c1-social-change',
              'c1-culture-identity','c1-boundaries-repair','c1-health-decisions',
              'c1-economic-tradeoffs','c1-complex-travel-resolution','c1-bureaucracy-rights',
              'c1-community-policy','c1-art-interpretation','c1-humor-irony',
              'c1-metaphor-idiom','c1-register-shifting','c1-mediating-perspectives',
              'c1-multisource-problem-solving','c1-integrated-capstone',
          ]
          p = Path('content/production/en/C1')
          files = list(p.glob('*.json'))
          units = {}
          for f in files:
              d = json.loads(f.read_text(encoding='utf-8'))
              units[d['curriculum_unit']] = d
              if d.get('cefr') != 'C1':
                  raise SystemExit(f'{f}: expected C1, got {d.get("cefr")}')

          missing = [u for u in expected if u not in units]
          extras = [u for u in units if u not in expected]
          if missing or extras or len(units) != 45:
              raise SystemExit(f'C1 coverage invalid: missing={missing}, extras={extras}, count={len(units)}')

          for slug, d in units.items():
              lessons = {
                  item.get('data', {}).get('lesson_key')
                  for item in d.get('items', [])
                  if item.get('data', {}).get('lesson_key')
              }
              required = {f'{slug}-01', f'{slug}-02', f'{slug}-03'}
              if not required.issubset(lessons):
                  raise SystemExit(f'{slug}: missing lesson coverage {sorted(required - lessons)}')

          print('C1 production coverage: 45/45 units, 135/135 lessons')
          PY

      - name: Validate complete C1 import plan
        run: python database/import/en/c1.py --dry-run

      - name: Build and validate strict C1 audio manifest without TTS
        run: |
          mkdir -p audio/manifests/en
          python scripts/build_audio_manifest.py content/production/en/C1 \
            --level C1 --locale en-US --strict-characters \
            --output audio/manifests/en/C1.json
          python scripts/validate_audio_manifest.py audio/manifests/en/C1.json

      - name: C1 content summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          files = list(Path('content/production/en/C1').glob('*.json'))
          items = 0
          kinds = {}
          for p in files:
              d = json.loads(p.read_text())
              items += len(d['items'])
              for x in d['items']:
                  kinds[x['kind']] = kinds.get(x['kind'], 0) + 1
          manifest = json.loads(Path('audio/manifests/en/C1.json').read_text())
          print('C1 files=', len(files), 'items=', items, 'kinds=', kinds)
          print('C1 audio manifest items=', len(manifest['items']))
          PY

      - name: Commit generated C1 production assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/production/en/C1 audio/manifests/en/C1.json
          if git diff --cached --quiet; then
            echo 'No C1 production changes to commit.'
            exit 0
          fi
          git commit -m 'Complete English C1 production assets [skip ci]'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
