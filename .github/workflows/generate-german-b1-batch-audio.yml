name: Generate German B1 Batch Audio

on:
  push:
    branches:
      - language/german-b1
    paths:
      - '.github/german-b1-batch-audio-trigger'
  workflow_dispatch:
    inputs:
      batch:
        description: 'B1 batch number (10 units per batch)'
        required: true
        default: '2'

permissions:
  contents: write

concurrency:
  group: german-b1-batch-audio
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      CONTENT_TTS_CONCURRENCY: '2'
      ELEVENLABS_MODEL_ID: eleven_multilingual_v2
      ELEVENLABS_DIALOGUE_MODEL_ID: eleven_multilingual_v2
      BATCH: ${{ github.event.inputs.batch || '2' }}

    steps:
      - name: Checkout German B1 branch
        uses: actions/checkout@v4
        with:
          ref: language/german-b1
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Require ElevenLabs connection
        run: |
          if [ -z "${ELEVENLABS_API_KEY:-}" ]; then
            echo 'ELEVENLABS_API_KEY GitHub secret is missing.' >&2
            exit 2
          fi

      - name: Select exactly ten B1 units from this batch specs
        run: |
          set -euo pipefail
          rm -rf build/b1-audio-batch
          mkdir -p build/b1-audio-batch
          python - <<'PY'
          import json, os, pathlib, shutil
          batch=int(os.environ['BATCH'])
          spec_dir=pathlib.Path(f'content/specs/de/B1/batch-{batch:02d}')
          specs=sorted(spec_dir.glob('*.json'))
          if len(specs) != 10:
              raise SystemExit(f'Batch {batch} needs exactly 10 specs, found {len(specs)}')
          out=pathlib.Path('build/b1-audio-batch')
          selected=[]
          for spec_path in specs:
              slug=json.loads(spec_path.read_text(encoding='utf-8'))['slug']
              prod=pathlib.Path('content/production/de/B1') / f'b1-de-{slug}-v1.json'
              if not prod.exists():
                  raise SystemExit(f'Missing production unit for batch {batch}: {prod}')
              shutil.copy2(prod, out/prod.name)
              selected.append(prod.name)
          print({'batch':batch,'selected':selected})
          PY

      - name: Final B1 batch validation before paid generation
        run: |
          set -euo pipefail
          python scripts/audit_german_b1_content.py --batch "$BATCH"
          for f in build/b1-audio-batch/*.json; do
            python scripts/validate_content.py "$f"
          done
          python database/import/de/b1.py --dry-run
          python -m scripts.audit_voice_lock \
            --lock audio/voices/de-DE.lock.json \
            --registry audio/voices/de-DE.json \
            --strict

      - name: Build strict B1 batch manifest
        run: |
          mkdir -p audio/manifests/de
          python scripts/build_audio_manifest.py build/b1-audio-batch \
            --level B1 --locale de-DE --strict-characters \
            --output "audio/manifests/de/B1-batch-${BATCH}.json"

      - name: Confirm every B1 batch voice key is locked
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          batch=os.environ['BATCH']
          manifest=json.loads(Path(f'audio/manifests/de/B1-batch-{batch}.json').read_text())
          locks=json.loads(Path('audio/voices/de-DE.lock.json').read_text())
          needed=sorted({x['voice_key'] for x in manifest['items']})
          missing=[key for key in needed if key not in locks or not locks[key].get('voice_id')]
          print({'batch':batch,'items':len(manifest['items']),'voice_keys':len(needed),'missing':missing})
          if missing:
              raise SystemExit('Unresolved B1 voice locks: '+', '.join(missing))
          PY

      - name: Generate German B1 batch audio
        run: |
          python scripts/generate_audio.py "audio/manifests/de/B1-batch-${BATCH}.json" \
            --confirm-paid-generation --concurrency 2

      - name: Validate generated German B1 batch audio
        run: |
          python scripts/validate_audio_manifest.py "audio/manifests/de/B1-batch-${BATCH}.json" --require-generated
          python scripts/audit_audio_voice_consistency.py \
            "audio/manifests/de/B1-batch-${BATCH}.json" \
            --lock-file audio/voices/de-DE.lock.json

      - name: Export German B1 batch database audio SQL
        run: |
          python scripts/export_audio_sql.py "audio/manifests/de/B1-batch-${BATCH}.json" \
            --status validated --output "database/import/de/b1_batch_${BATCH}_audio.sql"

      - name: German B1 batch audio summary
        run: |
          python - <<'PY'
          import json, os
          from collections import Counter
          from pathlib import Path
          batch=os.environ['BATCH']
          p=Path(f'audio/manifests/de/B1-batch-{batch}.json')
          d=json.loads(p.read_text())
          counts=Counter(x['category'] for x in d['items'])
          generated=sum(Path(x['relative_path']).exists() for x in d['items'])
          print({'batch':batch,'items':len(d['items']),'categories':dict(counts),'generated_mp3':generated})
          if generated != len(d['items']):
              raise SystemExit('Not all B1 batch audio files were generated')
          PY

      - name: Commit generated German B1 batch audio and DB link file
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            audio/generated/de-DE \
            "audio/manifests/de/B1-batch-${BATCH}.json" \
            audio/voices/de-DE.lock.json \
            "database/import/de/b1_batch_${BATCH}_audio.sql"
          if git diff --cached --quiet; then
            echo 'No German B1 batch audio changes to commit.'
            exit 0
          fi
          git commit -m "Generate German B1 batch ${BATCH} production audio [skip ci]"
          git fetch origin language/german-b1
          git rebase origin/language/german-b1
          git push origin HEAD:language/german-b1
