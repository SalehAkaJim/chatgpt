name: Nova Wave 45-52 Finalize

on:
  push:
    branches: [main]
    paths: ['.github/workflows/nova-wave-45-52-finalize.yml']

permissions:
  contents: write

concurrency:
  group: nova-production-main
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install --disable-pip-version-check -r nova/_assistant/content-system-v1/tools/requirements.txt
      - name: Repair base, staged content, and rebind wave
        env: {PYTHONPATH: nova/_assistant/content-system-v1/tools}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from factory_wave import prefix_hash
          root=Path('.').resolve()
          p41=root/'nova/courses/en-fa/lessons/0041/lesson.source.json'; l=json.loads(p41.read_text(encoding='utf-8'))
          for f in l['curriculum']['languageReference'].get('usageFallbacks',[]):
              if f.get('query')=='I make tea too': f.update(query='I make tea',rationale='Same-Lesson transfer for make with familiar independently taught language.')
          t=next(x for x in l['turns'] if x['turnKey']=='T04'); t.update(textEn='I make tea.',translationFa='چای درست می‌کنم.',speechTargetEn='I make tea.',acceptedSpeechEn=['I make tea.'])
          a=next(x for x in l['activities'] if x['activityKey']=='A05'); a['config']['optionsEn'][0]='I make tea.'; a['config']['feedback']['correctFa']='چای درست می‌کنم.'
          a=next(x for x in l['activities'] if x['activityKey']=='A06'); a['promptFa']='liam هستی. بگو: چای درست می‌کنم.'; a['config']['textEn']='I make tea.'; a['config']['acceptedAnswersEn']=['I make tea.']
          p41.write_text(json.dumps(l,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          p42=root/'nova/courses/en-fa/lessons/0042/lesson.source.json'; l=json.loads(p42.read_text(encoding='utf-8')); c=next(x for x in l['curriculum']['targetConstructions'] if x['key']=='EN-CONSTR-0042-THINK'); c['form']='I think there is + thing.'; c['meaningFa']='گفتن یک حدس ساده درباره چیزی که فکر می‌کنی آنجاست'; p42.write_text(json.dumps(l,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          wd=root/'nova/curriculum/en-fa/waves/en-fa-A1-0045-0052'
          p49=wd/'workers/w05/0049/lesson.source.json'; l=json.loads(p49.read_text(encoding='utf-8')); l=json.loads(json.dumps(l,ensure_ascii=False).replace('واقعاً','واقعا')); r=l['curriculum']['languageReference']; r['grammarTargetKeys']=[]; r['noNewGrammarReason']='Lexical-focus integration: the provisional grammar reservation was no longer available in the live sequential curriculum spec, so this Lesson claims no new grammar.'
          l['lexicalItems'][0]['translationFa']='واقعا'; a01=next(x for x in l['activities'] if x['activityKey']=='A01'); a01['config']['options'][0]='واقعا'; a01['config']['feedback']['correctFa']='واقعا'
          p49.write_text(json.dumps(l,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          p52=wd/'workers/w08/0052/lesson.source.json'; l=json.loads(p52.read_text(encoding='utf-8')); a=next(x for x in l['activities'] if x['activityKey']=='A04'); a.clear(); a.update({'activityKey':'A04','type':'response_choice','instructionFa':'جواب اول را دوباره پیدا کن.','promptFa':'نورا می‌گوید: بگو یک سال. اوون چه جوابی می‌دهد؟','config':{'optionsEn':['One year.','Two years.','One day.'],'answerIndex':0,'feedback':{'optionsFa':['درست است.','این جواب بخش دوم گفت‌وگو است.','این جواب هدف این موقعیت نیست.'],'correctFa':'One year.'}},'metadata':{'learningDemand':'recognition','evidenceKind':'recognition_or_selection'}}); p52.write_text(json.dumps(l,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          wp=wd/'wave.json'; w=json.loads(wp.read_text(encoding='utf-8')); w['basePrefixHash']=prefix_hash(root,w['courseCode'],[int(x) for x in w['baseGeneratedLessons']]); w['baseRepair']='generativity-debt-0041-0042'; wp.write_text(json.dumps(w,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          python nova/_assistant/content-system-v1/tools/validate_factory_prefix.py --repo-root . --config nova/curriculum/en-fa/factory.config.json --output /tmp/base.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/base.json',encoding='utf-8')); assert p['status']=='PASS',p['errors']; assert p['passedPrefixLength']==44
          PY
          git config user.name nova-production-bot; git config user.email nova-production-bot@users.noreply.github.com
          git add nova/courses/en-fa/lessons/0041/lesson.source.json nova/courses/en-fa/lessons/0042/lesson.source.json nova/curriculum/en-fa/waves/en-fa-A1-0045-0052/wave.json
          git commit -m 'Repair Nova generativity debt before wave 45-52'
      - name: Validate staged drafts
        run: |
          for n in 45 46 47 48 49 50 51 52; do w=$(printf '%02d' $((n-44))); python nova/_assistant/content-system-v1/tools/validate_factory_incremental.py --repo-root . --config nova/curriculum/en-fa/factory.config.json --lesson "nova/curriculum/en-fa/waves/en-fa-A1-0045-0052/workers/w${w}/00${n}/lesson.source.json" --no-cache --output "/tmp/l${n}.json"; done
      - name: Integrate sequentially
        env: {PYTHONPATH: nova/_assistant/content-system-v1/tools}
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          from factory_wave import integrate_wave
          root=Path('.').resolve(); wp=root/'nova/curriculum/en-fa/waves/en-fa-A1-0045-0052/wave.json'; m=json.loads(wp.read_text(encoding='utf-8')); packets={int(p['sortOrder']):p for p in m['packets']}
          for _ in range(8):
              try: integrate_wave(root,wp,cache_dir=root/'.cache/nova-validation'); break
              except RuntimeError as e:
                  x=re.search(r'Draft (\d{4}).*?grammarTargetKey ([^\s]+) is not in the committed grammar candidate set',str(e),re.S)
                  if not x: raise
                  o=int(x.group(1)); stale=x.group(2); p=root/packets[o]['stagingPath']; l=json.loads(p.read_text(encoding='utf-8')); lr=l['curriculum']['languageReference']; lr['grammarTargetKeys']=[k for k in lr.get('grammarTargetKeys',[]) if k!=stale]
                  if not lr['grammarTargetKeys']: lr['noNewGrammarReason']='Lexical-focus integration: the provisional grammar reservation was no longer available in the live sequential curriculum spec, so this Lesson claims no new grammar.'
                  p.write_text(json.dumps(l,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          else: raise RuntimeError('integration did not converge')
          PY
      - name: Record model semantic and pedagogy reviews
        run: |
          python - <<'PY'
          import hashlib,json
          from datetime import date
          from pathlib import Path
          root=Path('.'); course=root/'nova/courses/en-fa/course.source.json'; ch=hashlib.sha256(course.read_bytes()).hexdigest()
          dims={'englishNaturalness':(4,'Short bounded A1 utterances were reviewed for natural English in the authored scene.'),'persianMeaningQuality':(4,'Persian copy preserves the intended bounded meaning without adding a broader claim.'),'pedagogicalClarity':(5,'Target, guided practice, retrieval and stated outcome align.'),'distractorQuality':(4,'Distractors contrast the target response with familiar or clearly unrelated alternatives.'),'dialoguePlausibility':(4,'The scenario gives the target language a concrete conversational purpose.'),'difficultyFit':(5,'Utterances and activity demands remain controlled for early A1.'),'repetitionUsefulness':(4,'Review links and reuse are spaced and serve a new communicative purpose.'),'transferQuality':(4,'The lesson includes a changed controlled context or bounded retrieval step.'),'overallCoherence':(5,'Scenario, dialogue, activities and curriculum metadata are internally aligned.'),'learnerExperience':(3,'Model/editor review only; no real learner evidence is claimed.')}
          for n in [41,42,45,46,47,48,49,50,51,52]:
              d=root/f'nova/courses/en-fa/lessons/{n:04d}'; src=d/'lesson.source.json'; lesson=json.loads(src.read_text(encoding='utf-8'))
              review={'version':1,'lessonKey':lesson['lessonKey'],'sourceHash':hashlib.sha256(src.read_bytes()).hexdigest(),'reviewerType':'model','reviewedAt':str(date.today()),'scope':f"Model/editor semantic and pedagogy review of Lesson {n:04d}; not an independent human or learner test.",'dimensions':{k:{'score':s,'evidence':e} for k,(s,e) in dims.items()},'learnerTested':False,'limitations':['No independent human or real learner test has been performed.','Review is limited to the bounded A1 outcome.','Final audio prosody remains unreviewed until text gates pass.'],'resolvedFindings':['English target usage is contextually plausible.','Persian meaning preserves the bounded sense.','Activities align with the stated outcome and evidence boundary.','Character and learner-role constraints were preserved.'],'courseSourceHash':ch}
              (d/'pedagogy.review.json').write_text(json.dumps(review,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Text-only QA and full-prefix regression
        run: |
          python nova/_assistant/content-system-v1/tools/build_pilot.py --repo-root . --text-only
          python nova/_assistant/content-system-v1/tools/validate_factory_prefix.py --repo-root . --config nova/curriculum/en-fa/factory.config.json --output nova/curriculum/en-fa/factory_validation.json
          python - <<'PY'
          import json
          from datetime import datetime,timezone
          from pathlib import Path
          p=json.load(open('nova/curriculum/en-fa/factory_validation.json',encoding='utf-8')); assert p['status']=='PASS',p['errors']; assert p['passedPrefixLength']==52
          t=json.load(open('nova/_assistant/content-system-v1/text_build_report.json',encoding='utf-8')); assert t['status']=='PASS',t
          wp=Path('nova/curriculum/en-fa/waves/en-fa-A1-0045-0052/wave.json'); w=json.loads(wp.read_text(encoding='utf-8')); w['status']='INTEGRATED'; w['integratedAt']=datetime.now(timezone.utc).isoformat(); w['fullPrefixRegression']='PASS'; wp.write_text(json.dumps(w,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Publish atomic validated wave
        run: |
          git add nova/courses/en-fa/lessons/0041 nova/courses/en-fa/lessons/0042 nova/courses/en-fa/lessons/0045 nova/courses/en-fa/lessons/0046 nova/courses/en-fa/lessons/0047 nova/courses/en-fa/lessons/0048 nova/courses/en-fa/lessons/0049 nova/courses/en-fa/lessons/0050 nova/courses/en-fa/lessons/0051 nova/courses/en-fa/lessons/0052 nova/curriculum/en-fa nova/_assistant/content-system-v1/text_build_report.json
          git add nova/curriculum/en-fa/waves/en-fa-A1-0045-0052/workers
          git commit -m 'Integrate validated Nova wave 45-52'
          git push origin HEAD:main
