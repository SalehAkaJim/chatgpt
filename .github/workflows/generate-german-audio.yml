name: Generate German Pre-A1 and A1 Audio

on:
  push:
    branches:
      - main
    paths:
      - '.github/german-audio-generation-trigger'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: german-prea1-a1-audio-generation
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      CONTENT_TTS_CONCURRENCY: '2'
      ELEVENLABS_MODEL_ID: eleven_multilingual_v2
      ELEVENLABS_DIALOGUE_MODEL_ID: eleven_multilingual_v2

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Require ElevenLabs connection
        run: |
          if [ -z "${ELEVENLABS_API_KEY:-}" ]; then
            echo 'ELEVENLABS_API_KEY GitHub secret is missing.' >&2
            exit 2
          fi

      - name: Final content validation before paid generation
        run: |
          set -euo pipefail
          test "$(find content/production/de/Pre-A1 -maxdepth 1 -name '*.json' | wc -l)" -eq 17
          python scripts/audit_german_beginner_content.py
          python scripts/audit_prea1_cefr_readiness.py
          for f in content/production/de/Pre-A1/*.json content/production/de/A1/*.json; do python scripts/validate_content.py "$f"; done
          python scripts/validate_character_cast.py --cast audio/cast/de-DE.json
          python database/import/de/pre_a1.py --dry-run
          python database/import/de/a1.py --dry-run

      - name: Rebuild strict German manifests
        run: |
          mkdir -p audio/manifests/de
          python scripts/build_audio_manifest.py content/production/de/Pre-A1 --level Pre-A1 --locale de-DE --strict-characters --output audio/manifests/de/Pre-A1.json
          python scripts/build_audio_manifest.py content/production/de/A1 --level A1 --locale de-DE --strict-characters --output audio/manifests/de/A1.json

      - name: Resolve and lock every required German voice without TTS
        run: |
          python scripts/resolve_audio_voices.py audio/manifests/de/Pre-A1.json --write-lock
          python scripts/resolve_audio_voices.py audio/manifests/de/A1.json --write-lock

      - name: Validate manifests and voice lock before paid generation
        run: |
          python scripts/validate_audio_manifest.py audio/manifests/de/Pre-A1.json
          python scripts/validate_audio_manifest.py audio/manifests/de/A1.json
          python scripts/audit_voice_lock.py --lock audio/voices/de-DE.lock.json --registry audio/voices/de-DE.json --strict

      - name: Remove every existing German Pre-A1 audio asset to force a fresh render
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path('audio/manifests/de/Pre-A1.json').read_text())
          removed=0
          for item in manifest['items']:
              audio=Path(item['relative_path'])
              meta=Path(str(audio)+'.json')
              if audio.exists(): audio.unlink(); removed+=1
              if meta.exists(): meta.unlink()
          print({'prea1_items':len(manifest['items']),'removed_existing_mp3':removed})
          PY

      - name: Generate all German Pre-A1 audio fresh
        run: python scripts/generate_audio.py audio/manifests/de/Pre-A1.json --confirm-paid-generation --concurrency 2

      - name: Generate or reuse unchanged German A1 audio
        run: python scripts/generate_audio.py audio/manifests/de/A1.json --confirm-paid-generation --concurrency 2

      - name: Validate generated German audio
        run: |
          python scripts/validate_audio_manifest.py audio/manifests/de/Pre-A1.json --require-generated
          python scripts/validate_audio_manifest.py audio/manifests/de/A1.json --require-generated
          python scripts/audit_audio_voice_consistency.py audio/manifests/de/Pre-A1.json audio/manifests/de/A1.json --lock-file audio/voices/de-DE.lock.json

      - name: Export database relative-path SQL
        run: |
          python scripts/export_audio_sql.py audio/manifests/de/Pre-A1.json --status validated --output database/import/de/pre_a1_audio.sql
          python scripts/export_audio_sql.py audio/manifests/de/A1.json --status validated --output database/import/de/a1_audio.sql

      - name: Audio generation summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for p in [Path('audio/manifests/de/Pre-A1.json'),Path('audio/manifests/de/A1.json')]:
              d=json.loads(p.read_text()); counts={}
              for x in d['items']: counts[x['category']]=counts.get(x['category'],0)+1
              generated=sum(Path(x['relative_path']).is_file() for x in d['items'])
              print(p,'items=',len(d['items']),'categories=',counts,'manifest_mp3_files=',generated)
          PY

      - name: Commit generated audio and DB link files
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audio/generated/de-DE audio/manifests/de/Pre-A1.json audio/manifests/de/A1.json audio/voices/de-DE.lock.json database/import/de/pre_a1_audio.sql database/import/de/a1_audio.sql
          if git diff --cached --quiet; then echo 'No audio changes to commit.'; exit 0; fi
          git commit -m 'Regenerate German Pre-A1 production audio fresh [skip ci]'
          for attempt in 1 2 3 4 5; do
            echo "Push attempt ${attempt}/5"
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          echo 'Unable to push generated German audio after 5 attempts.' >&2
          exit 1
