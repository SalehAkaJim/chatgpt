name: Nova Wave 45-52 Repair Integration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nova-wave-45-52-repair.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nova-production-main
  cancel-in-progress: false

jobs:
  repair-integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validator dependencies
        run: pip install --disable-pip-version-check -r nova/_assistant/content-system-v1/tools/requirements.txt
      - name: Diagnose staged Lesson 52 local gate
        shell: bash
        run: |
          set +e
          python nova/_assistant/content-system-v1/tools/validate_factory_incremental.py \
            --repo-root . \
            --config nova/curriculum/en-fa/factory.config.json \
            --lesson nova/curriculum/en-fa/waves/en-fa-A1-0045-0052/workers/w08/0052/lesson.source.json \
            --no-cache \
            --output /tmp/lesson52.json
          STATUS=$?
          cat /tmp/lesson52.json
          exit $STATUS
