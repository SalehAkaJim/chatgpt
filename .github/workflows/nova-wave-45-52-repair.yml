name: Nova Wave 45-52 Repair Integration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nova-wave-45-52-repair.yml'

permissions:
  contents: write

concurrency:
  group: nova-production-main
  cancel-in-progress: false

jobs:
  repair-integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check -r nova/_assistant/content-system-v1/tools/requirements.txt
      - name: Patch and diagnose Lesson 52
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('nova/curriculum/en-fa/waves/en-fa-A1-0045-0052/workers/w08/0052/lesson.source.json')
          l=json.loads(p.read_text(encoding='utf-8'))
          a=next(x for x in l['activities'] if x['activityKey']=='A04')
          a['config']['tokensEn']=['One','year','.']
          a['config']['answerTokensEn']=['One','year','.']
          p.write_text(json.dumps(l,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          set +e
          python nova/_assistant/content-system-v1/tools/validate_factory_incremental.py \
            --repo-root . --config nova/curriculum/en-fa/factory.config.json \
            --lesson nova/curriculum/en-fa/waves/en-fa-A1-0045-0052/workers/w08/0052/lesson.source.json \
            --no-cache --output /tmp/l52.json
          s=$?
          cat /tmp/l52.json
          exit $s
