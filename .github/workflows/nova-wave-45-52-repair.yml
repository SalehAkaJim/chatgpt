name: Nova Wave 45-52 Repair Integration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nova-wave-45-52-repair.yml'

permissions:
  contents: write

concurrency:
  group: nova-production-main
  cancel-in-progress: false

jobs:
  repair-integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check -r nova/_assistant/content-system-v1/tools/requirements.txt
      - name: Patch known staged issues
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          wave=Path('nova/curriculum/en-fa/waves/en-fa-A1-0045-0052')
          p49=wave/'workers/w05/0049/lesson.source.json'
          l49=json.loads(p49.read_text(encoding='utf-8'))
          r=l49['curriculum']['languageReference']
          r['grammarTargetKeys']=[]
          r['noNewGrammarReason']='Lexical-focus integration: the provisional grammar reservation was no longer available in the live sequential curriculum spec, so this Lesson claims no new grammar.'
          p49.write_text(json.dumps(l49,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          p52=wave/'workers/w08/0052/lesson.source.json'
          l52=json.loads(p52.read_text(encoding='utf-8'))
          a=next(x for x in l52['activities'] if x['activityKey']=='A04')
          a.clear()
          a.update({'activityKey':'A04','type':'response_choice','instructionFa':'جواب اول را دوباره پیدا کن.','promptFa':'نورا می‌گوید: بگو یک سال. اوون چه جوابی می‌دهد؟','config':{'optionsEn':['One year.','Two years.','One day.'],'answerIndex':0,'feedback':{'optionsFa':['درست است.','این جواب بخش دوم گفت‌وگو است.','این جواب هدف این موقعیت نیست.'],'correctFa':'One year.'}},'metadata':{'learningDemand':'recognition','evidenceKind':'recognition_or_selection'}})
          p52.write_text(json.dumps(l52,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Integrate and expose full prefix report
        run: |
          PYTHONPATH=nova/_assistant/content-system-v1/tools python - <<'PY'
          import json,re,subprocess
          from pathlib import Path
          import factory_wave
          root=Path('.').resolve(); wave=root/'nova/curriculum/en-fa/waves/en-fa-A1-0045-0052/wave.json'
          def verbose_run(cmd, *, cwd):
              p=subprocess.run(cmd,cwd=cwd,text=True,capture_output=True)
              if p.stdout: print(p.stdout,end='')
              if p.stderr: print(p.stderr,end='')
              joined=' '.join(str(x) for x in cmd)
              if 'validate_factory_prefix.py' in joined and '--output' in cmd:
                  out=Path(cmd[cmd.index('--output')+1])
                  if out.exists():
                      payload=json.loads(out.read_text(encoding='utf-8'))
                      print('FULL_PREFIX_REPORT_BEGIN')
                      print(json.dumps(payload,ensure_ascii=False,indent=2))
                      print('FULL_PREFIX_REPORT_END')
              if p.returncode:
                  raise RuntimeError(f"Command failed ({p.returncode}): {joined}\nSTDOUT:\n{p.stdout}\nSTDERR:\n{p.stderr}")
          factory_wave._run=verbose_run
          manifest=json.loads(wave.read_text(encoding='utf-8')); packets={int(p['sortOrder']):p for p in manifest['packets']}
          for _ in range(8):
              try:
                  factory_wave.integrate_wave(root,wave,cache_dir=root/'.cache/nova-validation'); break
              except RuntimeError as exc:
                  m=re.search(r'Draft (\d{4}).*?grammarTargetKey ([^\s]+) is not in the committed grammar candidate set',str(exc),re.S)
                  if not m: raise
                  order=int(m.group(1)); stale=m.group(2); path=root/packets[order]['stagingPath']; lesson=json.loads(path.read_text(encoding='utf-8')); lr=lesson['curriculum']['languageReference']; lr['grammarTargetKeys']=[k for k in lr.get('grammarTargetKeys',[]) if k!=stale]
                  if not lr['grammarTargetKeys']: lr['noNewGrammarReason']='Lexical-focus integration: the provisional grammar reservation was no longer available in the live sequential curriculum spec, so this Lesson claims no new grammar.'
                  path.write_text(json.dumps(lesson,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
