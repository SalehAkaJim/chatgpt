name: Nova Content Quality Remediation

on:
  push:
    branches: [main]
    paths:
      - 'nova/curriculum/en-fa/remediation.request.json'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: nova-production-main
  cancel-in-progress: false

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Record exact input revision
        run: echo "INPUT_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validator dependencies
        timeout-minutes: 5
        run: pip install --disable-pip-version-check -r nova/_assistant/content-system-v1/tools/requirements.txt

      - name: Remediate all canonical content and validate the live prefix
        env:
          PYTHONPATH: nova/_assistant/content-system-v1/tools
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import shutil
          import subprocess
          import sys
          from datetime import datetime, timezone
          from pathlib import Path

          root = Path('.').resolve()
          report_path = root / 'nova/curriculum/en-fa/quality_v2.remediation_ci_report.json'
          request_path = root / 'nova/curriculum/en-fa/remediation.request.json'
          experience_path = root / 'nova/curriculum/en-fa/learner_experience_dependency_report.json'
          repair_path = root / 'nova/curriculum/en-fa/learner_experience_repair_report.json'
          v3_path = root / 'nova/curriculum/en-fa/quality_v3.remediation_report.json'
          lessons_root = root / 'nova/courses/en-fa/lessons'
          current = sorted(
              int(p.name) for p in lessons_root.iterdir()
              if p.is_dir() and p.name.isdigit() and (p / 'lesson.source.json').exists()
          )
          current_prefix = max(current, default=0)
          report = {
              'schemaVersion': 4,
              'status': 'FAIL',
              'stage': 'request',
              'inputHead': os.environ.get('INPUT_HEAD'),
              'checkedAt': datetime.now(timezone.utc).isoformat(),
              'canonicalPrefixAtStart': current_prefix,
              'errors': [],
              'commands': [],
          }

          def save():
              report_path.write_text(json.dumps(report, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          def run(name, cmd):
              completed = subprocess.run(cmd, cwd=root, capture_output=True, text=True)
              report['commands'].append({
                  'name': name,
                  'command': ' '.join(str(x) for x in cmd),
                  'returnCode': completed.returncode,
                  'stdoutTail': completed.stdout[-12000:],
                  'stderrTail': completed.stderr[-12000:],
              })
              return completed

          def stop(stage, message):
              report['stage'] = stage
              report['errors'].append(message)
              for path, key in (
                  (v3_path, 'qualityV3Report'),
                  (experience_path, 'learnerExperienceDependencyReport'),
                  (repair_path, 'learnerExperienceRepairReport'),
                  (root / 'nova/curriculum/en-fa/factory_validation.json', 'factoryValidation'),
              ):
                  if path.exists():
                      try:
                          report[key] = json.loads(path.read_text(encoding='utf-8'))
                      except Exception:
                          pass
              save()
              raise SystemExit(0)

          if not request_path.exists():
              report.update(status='SKIP', stage='request')
              report['errors'].append('No remediation.request.json exists; nothing to remediate.')
              save()
              raise SystemExit(0)

          try:
              request = json.loads(request_path.read_text(encoding='utf-8'))
              report['request'] = request
          except Exception as exc:
              stop('request', f'Invalid remediation request: {exc}')

          if current_prefix <= 0:
              stop('request', 'No canonical Lessons found.')

          for stale_wave in sorted((root / 'nova/curriculum/en-fa/waves').glob('*/wave.json')):
              try:
                  payload = json.loads(stale_wave.read_text(encoding='utf-8'))
              except Exception:
                  continue
              if payload.get('status') in {'PLANNED', 'STAGED'} and payload.get('baseGeneratedLessons') != current:
                  shutil.rmtree(stale_wave.parent)
                  report.setdefault('removedStaleWaves', []).append(str(stale_wave.parent.relative_to(root)))

          steps = [
              ('legacy-remediation', [
                  sys.executable, 'nova/_assistant/content-system-v1/tools/remediate_legacy_quality.py',
                  '--repo-root', '.', '--from', '40', '--to', '84',
              ]),
              ('legacy-naturalness-polish', [
                  sys.executable, 'nova/_assistant/content-system-v1/tools/polish_legacy_quality_v2.py', '--repo-root', '.',
              ]),
              ('learner-experience-repair', [
                  sys.executable, 'nova/_assistant/content-system-v1/tools/repair_learner_experience_dependencies.py', '--repo-root', '.',
              ]),
              ('quality-v3-remediation', [
                  sys.executable, 'nova/_assistant/content-system-v1/tools/remediate_quality_v3.py',
                  '--repo-root', '.', '--course', 'en-fa', '--from', '1', '--to', str(current_prefix),
              ]),
              ('quality-v3-review-refresh', [
                  sys.executable, 'nova/_assistant/content-system-v1/tools/refresh_quality_v3_reviews.py',
                  '--repo-root', '.', '--course', 'en-fa',
              ]),
          ]
          for name, command in steps:
              result = run(name, command)
              if result.returncode:
                  stop(name, f'{name} did not complete successfully.')

          experience = run('learner-experience-dependency-audit', [
              sys.executable,
              'nova/_assistant/content-system-v1/tools/audit_learner_experience_dependencies.py',
              '--repo-root', '.', '--course', 'en-fa', '--through', str(current_prefix),
              '--output', 'nova/curriculum/en-fa/learner_experience_dependency_report.json',
          ])
          if experience.returncode:
              stop('learner-experience-dependencies', 'Learner-visible dependency audit still has hard errors after Quality v3 remediation.')

          text = run('full-text-qa', [
              sys.executable,
              'nova/_assistant/content-system-v1/tools/build_pilot.py',
              '--repo-root', '.', '--text-only', '--text-workers', '4',
          ])
          if text.returncode:
              text_report = root / 'nova/_assistant/content-system-v1/text_build_report.json'
              if text_report.exists():
                  report['textBuildReport'] = json.loads(text_report.read_text(encoding='utf-8'))
              stop('text-qa', 'Full canonical text QA did not pass after Quality v3 remediation.')

          curriculum = run('curriculum-rebuild', [
              sys.executable,
              'nova/_assistant/content-system-v1/tools/run_curriculum_pipeline.py',
              '--repo-root', '.', '--course', 'en-fa',
              '--config', 'nova/curriculum/en-fa/factory.config.json',
              '--workspace-dir', 'nova/curriculum/en-fa',
          ])
          if curriculum.returncode:
              stop('curriculum', 'Curriculum/language-plan rebuild did not pass after Quality v3 remediation.')

          prefix = run('full-prefix-quality-v3', [
              sys.executable,
              'nova/_assistant/content-system-v1/tools/validate_factory_prefix.py',
              '--repo-root', '.',
              '--config', 'nova/curriculum/en-fa/factory.config.json',
              '--output', 'nova/curriculum/en-fa/factory_validation.json',
          ])
          if prefix.returncode:
              stop('full-prefix', 'Full-prefix Quality v3 regression did not pass.')

          release = run('release-readiness', [
              sys.executable,
              'nova/_assistant/content-system-v1/tools/check_release_readiness.py',
              '--repo-root', '.',
          ])
          if release.returncode:
              stop('release-readiness', 'Release-readiness report tool failed unexpectedly.')

          validation = json.loads((root / 'nova/curriculum/en-fa/factory_validation.json').read_text(encoding='utf-8'))
          passed = int(validation.get('passedPrefixLength') or 0)
          if validation.get('status') != 'PASS' or passed != current_prefix:
              stop(
                  'full-prefix',
                  f"Expected canonical PASS through {current_prefix}; got status={validation.get('status')} prefix={passed}",
              )

          remediation_report = root / 'nova/curriculum/en-fa/quality_v2.remediation_report.json'
          polish_report = root / 'nova/curriculum/en-fa/quality_v2.polish_report.json'
          backlog = root / 'nova/curriculum/en-fa/quality_v2.review_backlog.json'
          report.update(
              status='PASS',
              stage='ready-to-publish',
              passedPrefixLength=current_prefix,
              remediationReport=json.loads(remediation_report.read_text(encoding='utf-8')) if remediation_report.exists() else None,
              polishReport=json.loads(polish_report.read_text(encoding='utf-8')) if polish_report.exists() else None,
              reviewBacklog=json.loads(backlog.read_text(encoding='utf-8')) if backlog.exists() else None,
              qualityV3Report=json.loads(v3_path.read_text(encoding='utf-8')) if v3_path.exists() else None,
              learnerExperienceRepairReport=json.loads(repair_path.read_text(encoding='utf-8')) if repair_path.exists() else None,
              learnerExperienceDependencyReport=json.loads(experience_path.read_text(encoding='utf-8')) if experience_path.exists() else None,
              errors=[],
          )
          save()
          PY

      - name: Publish only fully validated remediation
        id: publish
        shell: bash
        run: |
          STATUS=$(python -c 'import json; print(json.load(open("nova/curriculum/en-fa/quality_v2.remediation_ci_report.json"))["status"])')
          git fetch origin main
          git config user.name "nova-production-bot"
          git config user.email "nova-production-bot@users.noreply.github.com"
          git reset

          if [ "$INPUT_HEAD" != "$(git rev-parse origin/main)" ]; then
            git checkout -- .
            git clean -fd
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "Main changed during remediation; no stale write was published."
            exit 0
          fi

          if [ "$STATUS" != "PASS" ]; then
            for file in \
              nova/curriculum/en-fa/quality_v2.remediation_ci_report.json \
              nova/curriculum/en-fa/quality_v2.remediation_report.json \
              nova/curriculum/en-fa/quality_v2.polish_report.json \
              nova/curriculum/en-fa/quality_v2.review_backlog.json \
              nova/curriculum/en-fa/quality_v3.remediation_report.json \
              nova/curriculum/en-fa/learner_experience_repair_report.json \
              nova/curriculum/en-fa/learner_experience_dependency_report.json; do
              if [ -f "$file" ]; then git add "$file"; fi
            done
            if ! git diff --cached --quiet; then
              git commit -m "Record Nova quality-v3 remediation result"
              git push origin HEAD:main
            fi
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git add nova/courses/en-fa/lessons/ \
                  nova/curriculum/en-fa/ \
                  nova/_assistant/content-system-v1/text_build_report.json
          if git diff --cached --quiet; then
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Remediate Nova canonical content for quality v3"
          git push origin HEAD:main
          echo "published=true" >> "$GITHUB_OUTPUT"

      - name: Rebuild production outputs once after green remediation
        if: steps.publish.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run nova-pilot.yml --ref main
