name: Generate Turkish Pre-A1 Batch

on:
  push:
    branches:
      - main
    paths:
      - '.github/turkish-prea1-batch-trigger'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: turkish-prea1-content-generation-v1
  cancel-in-progress: false

jobs:
  generate-batch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Generate all Turkish Pre-A1 units
        run: python scripts/generate_turkish_prea1_batch.py
      - name: Validate complete Turkish Pre-A1 production
        run: |
          set -euo pipefail
          test "$(find content/production/tr/Pre-A1 -maxdepth 1 -name '*.json' | wc -l)" -eq 10
          for f in content/production/tr/Pre-A1/*.json; do
            python scripts/validate_content.py "$f"
          done
          python scripts/validate_character_cast.py \
            --cast audio/cast/tr-TR.json \
            --content-dir content/production/tr/Pre-A1
          python database/import/tr/pre_a1.py --dry-run
      - name: Educational batch summary
        run: |
          python - <<'PY'
          import collections, json
          from pathlib import Path
          counts=collections.Counter(); pairs=[]; lessons=set()
          for p in sorted(Path('content/production/tr/Pre-A1').glob('*.json')):
              b=json.loads(p.read_text())
              for item in b['items']:
                  counts[item['kind']]+=1
                  lk=item.get('data',{}).get('lesson_key')
                  if lk: lessons.add(lk)
                  if item['kind']=='dialogue':
                      chars=tuple(item['data'].get('characters',[])[:2])
                      pairs.append((lk, chars))
          assert len(lessons)==20, len(lessons)
          assert len(set(pairs))==len(pairs), 'duplicate dialogue pair in a lesson'
          print(json.dumps({'units':10,'lessons':len(lessons),'counts':dict(counts)},ensure_ascii=False,indent=2))
          PY
      - name: Commit Turkish Pre-A1 production content
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/specs/tr/Pre-A1/batch-01.json content/production/tr/Pre-A1
          if git diff --cached --quiet; then
            echo 'No generated content changes.'
          else
            git commit -m 'Generate Turkish Pre-A1 batch 1 production content [skip ci]'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
