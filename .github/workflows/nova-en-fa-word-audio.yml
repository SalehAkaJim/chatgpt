name: Nova English Word Audio

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "nova/courses/en-fa/staging/**/chapter.sql"

permissions:
  contents: write

concurrency:
  group: nova-en-fa-word-audio
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      NOVA_COURSE: "en-fa"
      NOVA_WORD_TTS_CONCURRENCY: "2"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run tests
        run: NOVA_COURSE=en-fa python -m unittest discover -s nova/tts/tests -v
      - name: Prepare voices
        id: voices
        continue-on-error: true
        run: python nova/tts/nova_word_tts.py bootstrap-lori --yes
      - name: Validate SQL sources
        if: steps.voices.outcome == 'success'
        run: python nova/tts/nova_word_tts.py validate-sources
      - name: Generate audio
        id: audio
        if: steps.voices.outcome == 'success'
        continue-on-error: true
        run: python nova/tts/nova_word_tts.py generate --yes
      - name: Verify manifest
        run: python nova/tts/nova_word_tts.py verify-manifest
      - name: Commit resumable audio
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -e "nova/tts/word_voice_en_fa.json" ]; then git add -A -- "nova/tts/word_voice_en_fa.json"; fi
          if [ -e "nova/audio/en-fa" ]; then git add -A -- "nova/audio/en-fa"; fi
          if [ -e "nova/audio/words/en-fa" ]; then git add -A -- "nova/audio/words/en-fa"; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Generate Nova en-fa word audio"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            test "$attempt" -eq 5 && exit 1
            sleep $((attempt * 2))
          done
      - name: Fail after preserving progress
        if: always() && (steps.voices.outcome == 'failure' || steps.audio.outcome == 'failure')
        run: exit 2
