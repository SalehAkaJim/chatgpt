name: Nova English Word Audio

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Run type
        required: true
        type: choice
        default: plan
        options: [plan, generate]
  push:
    branches: [main]
    paths:
      - "nova/courses/en-fa/staging/**/chapter.sql"
      - "nova/tts/nova_word_tts.py"
      - "nova/tts/tests/test_nova_word_tts.py"
      - ".github/workflows/nova-en-fa-word-audio.yml"

permissions:
  contents: write

concurrency:
  group: nova-en-fa-word-audio
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      NOVA_COURSE: "en-fa"
      NOVA_WORD_TTS_CONCURRENCY: "2"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run regression tests with canonical defaults
        run: NOVA_COURSE=de-fa python -m unittest discover -s nova/tts/tests -v
      - name: Validate English Word sources
        run: python nova/tts/nova_word_tts.py validate-sources
      - name: Validate pinned Lori for English
        id: lori
        if: github.event_name == 'push' || inputs.mode == 'generate'
        continue-on-error: true
        run: python nova/tts/nova_word_tts.py bootstrap-lori --yes
      - name: Show English Word generation plan
        if: always()
        run: python nova/tts/nova_word_tts.py plan
      - name: Generate missing English Word audio
        id: audio
        if: (github.event_name == 'push' || inputs.mode == 'generate') && steps.lori.outcome == 'success'
        continue-on-error: true
        run: python nova/tts/nova_word_tts.py generate --yes
      - name: Verify English Word audio eligibility
        if: always()
        run: python nova/tts/nova_word_tts.py verify-manifest
      - name: Commit only English Word audio state
        if: always() && (github.event_name == 'push' || inputs.mode == 'generate')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- nova/tts/word_voice_en_fa.json nova/audio/en-fa nova/audio/words/en-fa
          if git diff --cached --quiet; then
            echo "No English Word TTS files changed."
          else
            git commit -m "Generate Nova en-fa word audio"
            for attempt in 1 2 3 4 5
            do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                exit 0
              fi
              if [ "$attempt" -eq 5 ]; then
                echo "English Word audio push failed after 5 fast-forward retries."
                exit 1
              fi
              sleep $((attempt * 2))
            done
          fi
      - name: Fail after preserving resumable progress
        if: always() && (steps.lori.outcome == 'failure' || steps.audio.outcome == 'failure')
        run: exit 2
