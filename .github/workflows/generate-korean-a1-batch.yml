name: Generate Korean C1 Batch
on:
  push:
    branches: [main]
    paths: ['.github/korean-c1-batch-trigger']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate-batch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt
      - run: python scripts/generate_korean_c1_batch.py
      - run: |
          set -euo pipefail
          test "$(find content/production/ko/C1 -maxdepth 1 -name '*.json' | wc -l)" -eq 10
          for f in content/production/ko/C1/*.json; do python scripts/validate_content.py "$f"; done
          python scripts/validate_character_cast.py --cast audio/cast/ko-KR.json
          python database/import/ko/c1.py --dry-run
      - name: Educational batch summary
        run: |
          python - <<'PY'
          import collections,json
          from pathlib import Path
          counts=collections.Counter(); lessons=set(); ordered=[]
          units=json.loads(Path('content/specs/ko/C1/batch-01.json').read_text())['units']
          for unit in units:
              b=json.loads((Path('content/production/ko/C1')/f"c1-ko-{unit['slug']}-v1.json").read_text()); dialogues=[]
              for item in b['items']:
                  counts[item['kind']]+=1; lk=item.get('data',{}).get('lesson_key')
                  if lk: lessons.add(lk)
                  if item['kind']=='dialogue': dialogues.append(item)
              for item in sorted(dialogues,key=lambda x:x['data']['lesson_key']): ordered.append(tuple(item['data'].get('characters',[])[:2]))
          assert len(lessons)==20,len(lessons)
          for p,c in zip(ordered,ordered[1:]): assert set(p)!=set(c),f'consecutive dialogue pair repeated: {p}'
          assert counts['concept']==60 and counts['utterance']==40 and counts['dialogue']==20 and counts['exercise']==100,counts
          print(json.dumps({'units':10,'lessons':len(lessons),'counts':dict(counts)},ensure_ascii=False))
          PY
      - name: Commit production
        run: |
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'; git add content/production/ko/C1
          if ! git diff --cached --quiet; then git commit -m 'Generate Korean C1 batch 1 production content [skip ci]'; git fetch origin main; git rebase origin/main; git push origin HEAD:main; fi
