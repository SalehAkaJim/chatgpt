name: Generate English Pre-A1 and A1 Audio

on:
  push:
    branches: [main]
    paths:
      - '.github/audio-generation-trigger'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: english-prea1-a1-audio-generation
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      CONTENT_TTS_CONCURRENCY: '2'
      ELEVENLABS_MODEL_ID: eleven_multilingual_v2
      ELEVENLABS_DIALOGUE_MODEL_ID: eleven_multilingual_v2
      AUDIO_URL_PREFIX: https://raw.githubusercontent.com/SalehAkaJim/chatgpt/main

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Require ElevenLabs connection
        run: |
          if [ -z "${ELEVENLABS_API_KEY:-}" ]; then
            echo 'ELEVENLABS_API_KEY GitHub secret is missing.' >&2
            exit 2
          fi

      - name: Rebuild strict manifests
        run: |
          mkdir -p audio/manifests/en
          python scripts/build_audio_manifest.py content/production/en/Pre-A1 \
            --level Pre-A1 --locale en-US --strict-characters \
            --output audio/manifests/en/Pre-A1.json
          python scripts/build_audio_manifest.py content/production/en/A1 \
            --level A1 --locale en-US --strict-characters \
            --output audio/manifests/en/A1.json

      - name: Resolve and lock every required voice without TTS
        run: |
          python scripts/resolve_audio_voices.py audio/manifests/en/Pre-A1.json --write-lock
          python scripts/resolve_audio_voices.py audio/manifests/en/A1.json --write-lock

      - name: Generate all Pre-A1 audio
        run: |
          python scripts/generate_audio.py audio/manifests/en/Pre-A1.json \
            --confirm-paid-generation --concurrency 2

      - name: Generate all A1 audio
        run: |
          python scripts/generate_audio.py audio/manifests/en/A1.json \
            --confirm-paid-generation --concurrency 2

      - name: Validate generated audio
        run: |
          python scripts/validate_audio_manifest.py audio/manifests/en/Pre-A1.json --require-generated
          python scripts/validate_audio_manifest.py audio/manifests/en/A1.json --require-generated

      - name: Export database URL SQL without connecting to MySQL
        run: |
          python scripts/export_audio_sql.py audio/manifests/en/Pre-A1.json \
            --url-prefix "$AUDIO_URL_PREFIX" \
            --status validated \
            --output database/import/en/pre_a1_audio.sql
          python scripts/export_audio_sql.py audio/manifests/en/A1.json \
            --url-prefix "$AUDIO_URL_PREFIX" \
            --status validated \
            --output database/import/en/a1_audio.sql

      - name: Audio generation summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for p in [Path('audio/manifests/en/Pre-A1.json'), Path('audio/manifests/en/A1.json')]:
              d = json.loads(p.read_text())
              counts = {}
              for x in d['items']:
                  counts[x['category']] = counts.get(x['category'], 0) + 1
              print(p, 'items=', len(d['items']), 'categories=', counts)
          print('mp3 files=', len(list(Path('audio/generated/en-US').rglob('*.mp3'))))
          PY

      - name: Commit generated audio and DB link files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            audio/generated/en-US \
            audio/manifests/en/Pre-A1.json \
            audio/manifests/en/A1.json \
            audio/voices/en-US.lock.json \
            database/import/en/pre_a1_audio.sql \
            database/import/en/a1_audio.sql
          if git diff --cached --quiet; then
            echo 'No audio changes to commit.'
            exit 0
          fi
          git commit -m 'Generate English Pre-A1 and A1 production audio [skip ci]'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
