# v3.2 repaired-source revalidation
name: Nova English Audio

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "nova/courses/en-fa/staging/**/chapter.sql"
      - ".github/workflows/nova-en-fa-audio.yml"
      - "nova/tts/**"
      - "nova/policies/voice_quality_v3.json"

permissions:
  contents: write

concurrency:
  group: nova-en-fa-audio
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      NOVA_COURSE: "en-fa"
      NOVA_TTS_CONCURRENCY: "2"
      NOVA_WORD_TTS_CONCURRENCY: "2"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Detect source
        id: source
        shell: bash
        run: |
          if find nova/courses/en-fa/staging -name chapter.sql -type f 2>/dev/null | grep -q .; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Run tests
        run: NOVA_COURSE=en-fa python -m unittest discover -s nova/tts/tests -v
      - name: Validate source locators
        if: steps.source.outputs.present == 'true'
        run: |
          python nova/tts/strict_voice_runner.py turn validate-sources
          python nova/tts/strict_voice_runner.py word validate-sources
      - name: Enforce clear target-English character voices
        id: turn_voices
        if: steps.source.outputs.present == 'true'
        continue-on-error: true
        run: python nova/tts/strict_voice_runner.py turn bootstrap-voices --yes
      - name: Generate turn audio
        id: turn_audio
        if: steps.source.outputs.present == 'true' && steps.turn_voices.outcome == 'success'
        continue-on-error: true
        run: python nova/tts/strict_voice_runner.py turn generate --yes
      - name: Prepare Lori word voice
        id: word_voice
        if: steps.source.outputs.present == 'true'
        continue-on-error: true
        run: python nova/tts/strict_voice_runner.py word bootstrap-lori --yes
      - name: Generate word audio
        id: word_audio
        if: steps.source.outputs.present == 'true' && steps.word_voice.outcome == 'success'
        continue-on-error: true
        run: python nova/tts/strict_voice_runner.py word generate --yes
      - name: Verify word manifest
        if: steps.source.outputs.present == 'true' && steps.word_audio.outcome == 'success'
        run: python nova/tts/strict_voice_runner.py word verify-manifest
      - name: Commit resumable audio once
        if: always()
        shell: bash
        run: |
          git checkout -- nova/courses/en-fa/staging || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for p in nova/tts/voice_map_en_fa.json nova/tts/word_voice_en_fa.json nova/audio/en-fa nova/audio/turns/en-fa nova/audio/words/en-fa; do
            [ ! -e "$p" ] || git add -A -- "$p"
          done
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Generate Nova en-fa audio"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            test "$attempt" -eq 5 && exit 1
            sleep $((attempt * 2))
          done
      - name: Fail after preserving progress
        if: always() && steps.source.outputs.present == 'true' && (steps.turn_voices.outcome == 'failure' || steps.turn_audio.outcome == 'failure' || steps.word_voice.outcome == 'failure' || steps.word_audio.outcome == 'failure')
        run: exit 2
