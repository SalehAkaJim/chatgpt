name: Generate Turkish Pre-A1 Audio

on:
  push:
    branches:
      - main
    paths:
      - '.github/turkish-prea1-audio-trigger'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: turkish-prea1-audio-generation-v1
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      CONTENT_TTS_CONCURRENCY: '2'
      ELEVENLABS_MODEL_ID: eleven_multilingual_v2
      ELEVENLABS_DIALOGUE_MODEL_ID: eleven_multilingual_v2
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Require ElevenLabs connection
        run: |
          if [ -z "${ELEVENLABS_API_KEY:-}" ]; then
            echo 'ELEVENLABS_API_KEY GitHub secret is missing.' >&2
            exit 2
          fi
      - name: Final Turkish content validation before paid generation
        run: |
          set -euo pipefail
          test "$(find content/production/tr/Pre-A1 -maxdepth 1 -name '*.json' | wc -l)" -eq 14
          python scripts/audit_turkish_prea1_content.py
          for f in content/production/tr/Pre-A1/*.json; do python scripts/validate_content.py "$f"; done
          python scripts/validate_character_cast.py --cast audio/cast/tr-TR.json
          python database/import/tr/pre_a1.py --dry-run
      - name: Build strict Turkish Pre-A1 manifest
        run: |
          mkdir -p audio/manifests/tr
          python scripts/build_audio_manifest.py content/production/tr/Pre-A1 \
            --level Pre-A1 --locale tr-TR --strict-characters \
            --output audio/manifests/tr/Pre-A1.json
      - name: Resolve and lock every required Turkish voice without TTS
        run: python scripts/resolve_audio_voices.py audio/manifests/tr/Pre-A1.json --write-lock
      - name: Validate manifest and voice lock before paid generation
        run: |
          python scripts/validate_audio_manifest.py audio/manifests/tr/Pre-A1.json
          python scripts/audit_voice_lock.py \
            --lock audio/voices/tr-TR.lock.json \
            --registry audio/voices/tr-TR.json \
            --strict
      - name: Generate all Turkish Pre-A1 production audio
        run: |
          python scripts/generate_audio.py audio/manifests/tr/Pre-A1.json \
            --confirm-paid-generation --concurrency 2
      - name: Validate generated Turkish audio and voice consistency
        run: |
          python scripts/validate_audio_manifest.py audio/manifests/tr/Pre-A1.json --require-generated
          python scripts/audit_audio_voice_consistency.py \
            audio/manifests/tr/Pre-A1.json \
            --lock-file audio/voices/tr-TR.lock.json
      - name: Export database relative-path SQL
        run: |
          python scripts/export_audio_sql.py audio/manifests/tr/Pre-A1.json \
            --status validated --output database/import/tr/pre_a1_audio.sql
      - name: Verify expected audio categories
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('audio/manifests/tr/Pre-A1.json')
          d=json.loads(p.read_text())
          counts={}
          for x in d['items']:
              counts[x['category']]=counts.get(x['category'],0)+1
          required={'lexical','utterances','dialogues'}
          missing=required-set(counts)
          if missing: raise SystemExit('Missing audio categories: '+','.join(sorted(missing)))
          generated=len(list(Path('audio/generated/tr-TR').rglob('*.mp3')))
          if generated != len(d['items']):
              raise SystemExit(f'Expected {len(d["items"])} MP3 files, found {generated}')
          print(json.dumps({'items':len(d['items']),'categories':counts,'mp3_files':generated},ensure_ascii=False,indent=2))
          PY
      - name: Commit generated Turkish audio and DB link files
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            audio/generated/tr-TR \
            audio/manifests/tr/Pre-A1.json \
            audio/voices/tr-TR.lock.json \
            database/import/tr/pre_a1_audio.sql
          if git diff --cached --quiet; then
            echo 'No audio changes to commit.'
            exit 0
          fi
          git commit -m 'Generate Turkish Pre-A1 production audio [skip ci]'
          for attempt in 1 2 3 4 5; do
            echo "Push attempt ${attempt}/5"
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo 'Unable to push generated Turkish audio after 5 attempts.' >&2
          exit 1
