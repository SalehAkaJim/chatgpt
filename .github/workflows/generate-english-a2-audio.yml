name: Generate English A2 Audio

on:
  push:
    branches: [main]
    paths:
      - '.github/a2-audio-trigger'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: english-a2-audio-generation
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      CONTENT_TTS_CONCURRENCY: '2'
      ELEVENLABS_MODEL_ID: eleven_multilingual_v2
      ELEVENLABS_DIALOGUE_MODEL_ID: eleven_multilingual_v2

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Require ElevenLabs connection
        run: |
          if [ -z "${ELEVENLABS_API_KEY:-}" ]; then
            echo 'ELEVENLABS_API_KEY GitHub secret is missing.' >&2
            exit 2
          fi

      - name: Extend explicit cast for A2 characters
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('audio/cast/en-US.json')
          d = json.loads(p.read_text(encoding='utf-8'))
          extras = {
              'chloe': {
                  'display_name': 'Chloe',
                  'persona': {'voice_presentation':'female','style':'professional_neutral','target_accent':'general_american'},
                  'voice_profile': 'female_professional'
              },
              'nia': {
                  'display_name': 'Nia',
                  'persona': {'voice_presentation':'female','style':'calm_clear','target_accent':'general_american'},
                  'voice_profile': 'female_calm'
              },
              'yusuf': {
                  'display_name': 'Yusuf',
                  'persona': {'voice_presentation':'male','style':'professional_neutral','target_accent':'general_american'},
                  'voice_profile': 'male_professional'
              }
          }
          d.setdefault('characters', {}).update(extras)
          p.write_text(json.dumps(d, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print('A2 cast additions:', ', '.join(sorted(extras)))
          PY

      - name: Validate complete A2 content import plan
        run: python database/import/en/a2.py --dry-run

      - name: Build strict A2 audio manifest
        run: |
          mkdir -p audio/manifests/en
          python scripts/build_audio_manifest.py content/production/en/A2 \
            --level A2 --locale en-US --strict-characters \
            --output audio/manifests/en/A2.json

      - name: Resolve and lock every required voice without TTS
        run: python scripts/resolve_audio_voices.py audio/manifests/en/A2.json --write-lock

      - name: Generate all A2 audio
        run: |
          python scripts/generate_audio.py audio/manifests/en/A2.json \
            --confirm-paid-generation --concurrency 2

      - name: Validate generated A2 audio
        run: python scripts/validate_audio_manifest.py audio/manifests/en/A2.json --require-generated

      - name: Export database relative-path SQL without connecting to MySQL
        run: |
          python scripts/export_audio_sql.py audio/manifests/en/A2.json \
            --status validated \
            --output database/import/en/a2_audio.sql

      - name: A2 audio summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('audio/manifests/en/A2.json')
          d = json.loads(p.read_text())
          counts = {}
          for x in d['items']:
              counts[x['category']] = counts.get(x['category'], 0) + 1
          print(p, 'items=', len(d['items']), 'categories=', counts)
          print('all en-US mp3 files=', len(list(Path('audio/generated/en-US').rglob('*.mp3'))))
          PY

      - name: Commit generated A2 audio and DB link file
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            audio/cast/en-US.json \
            audio/generated/en-US \
            audio/manifests/en/A2.json \
            audio/voices/en-US.lock.json \
            database/import/en/a2_audio.sql
          if git diff --cached --quiet; then
            echo 'No A2 audio changes to commit.'
            exit 0
          fi
          git commit -m 'Generate English A2 production audio [skip ci]'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
