name: Generate French A1 Audio
on:
  push:
    branches: [main]
    paths: ['.github/french-a1-audio-trigger']
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: french-a1-audio-generation-v1, cancel-in-progress: false}
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      CONTENT_TTS_CONCURRENCY: '2'
      ELEVENLABS_MODEL_ID: eleven_multilingual_v2
      ELEVENLABS_DIALOGUE_MODEL_ID: eleven_multilingual_v2
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt
      - name: Require ElevenLabs connection
        run: test -n "${ELEVENLABS_API_KEY:-}" || { echo 'ELEVENLABS_API_KEY GitHub secret is missing.' >&2; exit 2; }
      - name: Final French A1 content validation before paid generation
        run: |
          set -euo pipefail
          test "$(find content/production/fr/A1 -maxdepth 1 -name '*.json' | wc -l)" -eq 10
          for f in content/production/fr/A1/*.json; do python scripts/validate_content.py "$f"; done
          python scripts/validate_character_cast.py --cast audio/cast/fr-FR.json
          python database/import/fr/a1.py --dry-run
      - name: Build strict French A1 manifest
        run: |
          mkdir -p audio/manifests/fr
          python scripts/build_audio_manifest.py content/production/fr/A1 --level A1 --locale fr-FR --strict-characters --output audio/manifests/fr/A1.json
      - name: Resolve and lock every required French voice without TTS
        run: python scripts/resolve_audio_voices.py audio/manifests/fr/A1.json --write-lock
      - name: Validate manifest and voice lock before paid generation
        run: |
          python scripts/validate_audio_manifest.py audio/manifests/fr/A1.json
          python scripts/audit_voice_lock.py --lock audio/voices/fr-FR.lock.json --registry audio/voices/fr-FR.json --strict
      - name: Generate all French A1 production audio
        run: python scripts/generate_audio.py audio/manifests/fr/A1.json --confirm-paid-generation --concurrency 2
      - name: Validate generated French A1 audio and voice consistency
        run: |
          python scripts/validate_audio_manifest.py audio/manifests/fr/A1.json --require-generated
          python scripts/audit_audio_voice_consistency.py audio/manifests/fr/A1.json --lock-file audio/voices/fr-FR.lock.json
      - name: Export database relative-path SQL
        run: python scripts/export_audio_sql.py audio/manifests/fr/A1.json --status validated --output database/import/fr/a1_audio.sql
      - name: Verify expected audio categories and files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('audio/manifests/fr/A1.json').read_text()); counts={}
          for x in d['items']: counts[x['category']]=counts.get(x['category'],0)+1
          missing={'lexical','utterances','dialogues'}-set(counts)
          if missing: raise SystemExit('Missing audio categories: '+','.join(sorted(missing)))
          roots=[Path(x['relative_path']) for x in d['items']]
          absent=[str(p) for p in roots if not p.exists()]
          if absent: raise SystemExit(f'Missing generated files: {len(absent)}')
          if len(set(map(str,roots))) != len(roots): raise SystemExit('Manifest relative paths are not unique')
          print(json.dumps({'items':len(d['items']),'categories':counts,'files_verified':len(roots)},ensure_ascii=False,indent=2))
          PY
      - name: Commit French A1 audio and DB link files
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audio/generated/fr-FR audio/manifests/fr/A1.json audio/voices/fr-FR.lock.json database/import/fr/a1_audio.sql
          if git diff --cached --quiet; then echo 'No audio changes to commit.'; else
            git commit -m 'Generate French A1 production audio [skip ci]'
            git fetch origin main; git rebase origin/main; git push origin HEAD:main
          fi
