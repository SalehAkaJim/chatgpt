name: Refresh audio for approved English content fixes

on:
  push:
    branches: [main]
    paths:
      - '.github/english-quality-audio-request.json'

permissions:
  contents: write

concurrency:
  group: english-quality-audio-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      CONTENT_TTS_CONCURRENCY: '2'
      ELEVENLABS_MODEL_ID: eleven_multilingual_v2
      ELEVENLABS_DIALOGUE_MODEL_ID: eleven_multilingual_v2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Generate changed and missing audio, validate and export links
        run: python scripts/refresh_english_audio.py
      - name: Commit refreshed audio and SQL
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audio/generated/en-US audio/manifests/en audio/reports/english-quality-refresh.json audio/voices/en-US.lock.json database/import/en/*_audio.sql database/import/en/educational_content_updates.sql
          if git diff --cached --quiet; then
            echo 'Audio is already current.'
            exit 0
          fi
          git commit -m 'Refresh audio for approved English educational fixes [skip ci]'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
