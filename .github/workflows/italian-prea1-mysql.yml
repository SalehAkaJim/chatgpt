name: Italian Pre-A1 MySQL Integration

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/italian-prea1-mysql-trigger']

jobs:
  mysql-9-import:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:9.0.1
        env: {MYSQL_ROOT_PASSWORD: rootpass, MYSQL_DATABASE: language_learning}
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -h 127.0.0.1 -prootpass" --health-interval=10s --health-timeout=5s --health-retries=10
    env: {DATABASE_URL: 'mysql://root:rootpass@127.0.0.1:3306/language_learning', MYSQL_PWD: rootpass}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt && sudo apt-get update -qq && sudo apt-get install -y default-mysql-client
      - name: Bootstrap
        run: |
          DB="mysql -h127.0.0.1 -P3306 -uroot language_learning"
          for f in database/schema.sql database/migrations/001_curriculum.sql database/migrations/002_multilingual_core.sql database/migrations/003_lesson_item_lexemes.sql database/migrations/004_level_import_audio.sql database/migrations/005_writing_exercises.sql database/seed/cefr.sql database/seed/languages.sql database/seed/skills-topics.sql database/seed/english-a1-curriculum.sql database/seed/language-variants-courses.sql database/seed/italian-course.sql database/seed/italian-prea1-curriculum.sql; do $DB < "$f"; done
      - name: Validate and import Italian Pre-A1
        run: |
          for f in content/production/it/Pre-A1/*.json; do python scripts/validate_content.py "$f"; done
          python scripts/validate_character_cast.py --cast audio/cast/it-IT.json
          python database/import/it/pre_a1.py --dry-run
          python database/import/it/pre_a1.py --allow-unreviewed
      - name: Verify counts and idempotency
        run: |
          q(){ mysql -N -s -h127.0.0.1 -P3306 -uroot language_learning -e "$1"; }
          units=$(q "SELECT COUNT(*) FROM curriculum_units cu JOIN courses c ON c.id=cu.course_id AND c.slug='fa-it-it' JOIN cefr_levels l ON l.id=cu.cefr_level_id AND l.code='Pre-A1';")
          lessons=$(q "SELECT COUNT(*) FROM lessons le JOIN courses c ON c.id=le.course_id AND c.slug='fa-it-it' JOIN cefr_levels l ON l.id=le.cefr_level_id AND l.code='Pre-A1';")
          exercises=$(q "SELECT COUNT(*) FROM exercises e JOIN lessons le ON le.id=e.lesson_id JOIN cefr_levels l ON l.id=le.cefr_level_id JOIN courses c ON c.id=le.course_id WHERE c.slug='fa-it-it' AND l.code='Pre-A1';")
          test "$units" = 10; test "$lessons" = 20; test "$exercises" = 100
          before=$(q "SELECT CONCAT((SELECT COUNT(*) FROM lessons le JOIN courses c ON c.id=le.course_id WHERE c.slug='fa-it-it'),'|',(SELECT COUNT(*) FROM exercises e JOIN lessons le ON le.id=e.lesson_id JOIN courses c ON c.id=le.course_id WHERE c.slug='fa-it-it'));")
          python database/import/it/pre_a1.py --allow-unreviewed
          after=$(q "SELECT CONCAT((SELECT COUNT(*) FROM lessons le JOIN courses c ON c.id=le.course_id WHERE c.slug='fa-it-it'),'|',(SELECT COUNT(*) FROM exercises e JOIN lessons le ON le.id=e.lesson_id JOIN courses c ON c.id=le.course_id WHERE c.slug='fa-it-it'));")
          test "$before" = "$after"
          echo "Italian Pre-A1 counts: units=$units lessons=$lessons exercises=$exercises idempotent=$after"
