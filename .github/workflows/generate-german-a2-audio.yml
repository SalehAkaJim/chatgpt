name: Generate German A2 Audio

on:
  push:
    branches:
      - language/german-a2
    paths:
      - '.github/german-a2-audio-generation-trigger'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: german-a2-audio-generation
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      CONTENT_TTS_CONCURRENCY: '2'
      ELEVENLABS_MODEL_ID: eleven_multilingual_v2
      ELEVENLABS_DIALOGUE_MODEL_ID: eleven_multilingual_v2

    steps:
      - name: Checkout German A2 branch
        uses: actions/checkout@v4
        with:
          ref: language/german-a2
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Require ElevenLabs connection
        run: |
          if [ -z "${ELEVENLABS_API_KEY:-}" ]; then
            echo 'ELEVENLABS_API_KEY GitHub secret is missing.' >&2
            exit 2
          fi

      - name: Final A2 validation before paid generation
        run: |
          set -euo pipefail
          python scripts/audit_german_a2_content.py
          for f in content/production/de/A2/*.json; do
            python scripts/validate_content.py "$f"
          done
          python database/import/de/a2.py --dry-run
          python -m scripts.audit_voice_lock \
            --lock audio/voices/de-DE.lock.json \
            --registry audio/voices/de-DE.json \
            --strict

      - name: Rebuild strict German A2 manifest
        run: |
          mkdir -p audio/manifests/de
          python scripts/build_audio_manifest.py content/production/de/A2 \
            --level A2 --locale de-DE --strict-characters \
            --output audio/manifests/de/A2.json

      - name: Confirm every A2 voice key is locked
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path('audio/manifests/de/A2.json').read_text())
          locks=json.loads(Path('audio/voices/de-DE.lock.json').read_text())
          needed=sorted({x['voice_key'] for x in manifest['items']})
          missing=[key for key in needed if key not in locks or not locks[key].get('voice_id')]
          print({'items':len(manifest['items']),'voice_keys':len(needed),'missing':missing})
          if missing:
              raise SystemExit('Unresolved A2 voice locks: '+', '.join(missing))
          PY

      - name: Generate all German A2 audio
        run: |
          python scripts/generate_audio.py audio/manifests/de/A2.json \
            --confirm-paid-generation --concurrency 2

      - name: Validate generated German A2 audio
        run: |
          python scripts/validate_audio_manifest.py audio/manifests/de/A2.json --require-generated
          python scripts/audit_audio_voice_consistency.py \
            audio/manifests/de/A2.json \
            --lock-file audio/voices/de-DE.lock.json

      - name: Export German A2 database audio SQL
        run: |
          python scripts/export_audio_sql.py audio/manifests/de/A2.json \
            --status validated --output database/import/de/a2_audio.sql

      - name: German A2 audio summary
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          p=Path('audio/manifests/de/A2.json')
          d=json.loads(p.read_text())
          counts=Counter(x['category'] for x in d['items'])
          generated=[]
          for item in d['items']:
              path=Path(item['relative_path'])
              if path.exists(): generated.append(path)
          print({'items':len(d['items']),'categories':dict(counts),'generated_mp3':len(generated)})
          PY

      - name: Commit generated German A2 audio and DB link file
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            audio/generated/de-DE \
            audio/manifests/de/A2.json \
            audio/voices/de-DE.lock.json \
            database/import/de/a2_audio.sql
          if git diff --cached --quiet; then
            echo 'No German A2 audio changes to commit.'
            exit 0
          fi
          git commit -m 'Generate German A2 production audio [skip ci]'
          git fetch origin language/german-a2
          git rebase origin/language/german-a2
          git push origin HEAD:language/german-a2
