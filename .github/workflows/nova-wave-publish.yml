name: Nova Wave Preflight Publish

on:
  push:
    branches: [main]
    paths:
      - 'nova/curriculum/en-fa/wave.publish.request.json'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

# Wave publication and production share one writer queue. Content/preflight
# failures are recorded as data and keep the Actions run green, avoiding noisy
# failure notifications while still blocking canonical publication.
concurrency:
  group: nova-production-main
  cancel-in-progress: false

jobs:
  preflight-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Record exact input revision
        run: echo "INPUT_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validator dependencies
        timeout-minutes: 5
        run: pip install --disable-pip-version-check -r nova/_assistant/content-system-v1/tools/requirements.txt

      - name: Run atomic wave text preflight
        env:
          PYTHONPATH: nova/_assistant/content-system-v1/tools
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          import sys
          from datetime import datetime, timezone
          from pathlib import Path

          root = Path('.').resolve()
          request_path = root / 'nova/curriculum/en-fa/wave.publish.request.json'
          report_path = root / 'nova/curriculum/en-fa/wave_preflight_report.json'
          report = {
              'schemaVersion': 1,
              'status': 'FAIL',
              'stage': 'request',
              'inputHead': os.environ.get('INPUT_HEAD'),
              'checkedAt': datetime.now(timezone.utc).isoformat(),
              'errors': [],
              'commands': [],
          }

          def save_report():
              report_path.write_text(json.dumps(report, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          def run(cmd):
              completed = subprocess.run(cmd, cwd=root, capture_output=True, text=True)
              report['commands'].append({
                  'command': ' '.join(str(x) for x in cmd),
                  'returnCode': completed.returncode,
                  'stdoutTail': completed.stdout[-6000:],
                  'stderrTail': completed.stderr[-6000:],
              })
              return completed

          def last_json_line(text):
              for line in reversed((text or '').splitlines()):
                  line = line.strip()
                  if not line.startswith('{'):
                      continue
                  try:
                      return json.loads(line)
                  except Exception:
                      pass
              return None

          if not request_path.exists():
              report.update(status='SKIP', stage='request')
              report['errors'].append('No wave.publish.request.json exists; nothing to publish.')
              save_report()
              raise SystemExit(0)

          try:
              request = json.loads(request_path.read_text(encoding='utf-8'))
              wave_rel = request['wavePath']
              report['request'] = request
          except Exception as exc:
              report['errors'].append(f'Invalid publish request: {exc}')
              save_report()
              raise SystemExit(0)

          wave_path = root / wave_rel
          if not wave_path.exists():
              report['errors'].append(f'Wave manifest does not exist: {wave_rel}')
              save_report()
              raise SystemExit(0)

          try:
              wave = json.loads(wave_path.read_text(encoding='utf-8'))
              report['waveKey'] = wave.get('waveKey')
              report['expectedPrefix'] = wave.get('lastSortOrder')
          except Exception as exc:
              report['errors'].append(f'Invalid wave manifest: {exc}')
              save_report()
              raise SystemExit(0)

          # Validate every staged draft locally before sequential integration.
          # This catches independent schema/content/product-quality failures for
          # the whole wave in one run instead of revealing one Lesson per retry.
          staging_failures = []
          for packet in wave.get('packets') or []:
              staging_rel = packet.get('stagingPath')
              staging = root / str(staging_rel or '')
              if not staging_rel or not staging.exists():
                  staging_failures.append({
                      'lessonKey': packet.get('lessonKey'),
                      'sortOrder': packet.get('sortOrder'),
                      'errors': [f'Missing staged draft: {staging_rel}'],
                  })
                  continue
              local = run([
                  sys.executable,
                  'nova/_assistant/content-system-v1/tools/validate_factory_incremental.py',
                  '--repo-root', '.',
                  '--config', 'nova/curriculum/en-fa/factory.config.json',
                  '--lesson', staging_rel,
                  '--cache-dir', '.cache/nova-validation',
                  '--no-cache',
              ])
              if local.returncode:
                  detail = last_json_line(local.stdout) or {}
                  lesson_errors = detail.get('lessonErrors') or []
                  if lesson_errors:
                      staging_failures.extend(lesson_errors)
                  else:
                      staging_failures.append({
                          'lessonKey': packet.get('lessonKey'),
                          'sortOrder': packet.get('sortOrder'),
                          'errors': [f'Local staged validation failed with return code {local.returncode}'],
                      })

          if staging_failures:
              report['stage'] = 'staging-local-precheck'
              report['stagingLocalFailures'] = staging_failures
              report['errors'].append(
                  f'{len(staging_failures)} staged Lesson(s) have local validation errors; repair them together before integration.'
              )
              save_report()
              raise SystemExit(0)

          integrated = run([
              sys.executable,
              'nova/_assistant/content-system-v1/tools/factory_wave.py',
              'integrate', '--repo-root', '.', '--wave', wave_rel,
          ])
          if integrated.returncode:
              report['stage'] = 'integration'
              report['errors'].append('Ordered single-writer integration did not pass.')
              save_report()
              raise SystemExit(0)

          # Semantic evidence is authored by the model before the request is sent.
          # The workflow only binds that reviewed evidence to exact post-integration bytes.
          course_path = root / f"nova/courses/{wave['courseCode']}/course.source.json"
          course_hash = hashlib.sha256(course_path.read_bytes()).hexdigest()
          for packet in wave.get('packets') or []:
              canonical = root / packet['canonicalPath']
              staging = root / packet['stagingPath']
              template_path = staging.parent / 'pedagogy.review.template.json'
              if not canonical.exists():
                  report['stage'] = 'semantic-review'
                  report['errors'].append(f"Missing canonical source after integration: {packet['canonicalPath']}")
                  continue
              if not template_path.exists():
                  report['stage'] = 'semantic-review'
                  report['errors'].append(f"Missing semantic review template: {template_path.relative_to(root)}")
                  continue
              try:
                  review = json.loads(template_path.read_text(encoding='utf-8'))
                  lesson = json.loads(canonical.read_text(encoding='utf-8'))
                  review['version'] = int(review.get('version', 1))
                  review['lessonKey'] = lesson['lessonKey']
                  review['sourceHash'] = hashlib.sha256(canonical.read_bytes()).hexdigest()
                  review['courseSourceHash'] = course_hash
                  canonical.parent.joinpath('pedagogy.review.json').write_text(
                      json.dumps(review, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
                  )
              except Exception as exc:
                  report['stage'] = 'semantic-review'
                  report['errors'].append(f"Invalid semantic review template for {packet.get('lessonKey')}: {exc}")

          if report['errors']:
              save_report()
              raise SystemExit(0)

          text = run([
              sys.executable,
              'nova/_assistant/content-system-v1/tools/build_pilot.py',
              '--repo-root', '.', '--text-only',
          ])
          if text.returncode:
              report['stage'] = 'text-qa'
              report['errors'].append('Full canonical text QA did not pass.')
              text_report = root / 'nova/_assistant/content-system-v1/text_build_report.json'
              if text_report.exists():
                  report['textBuildReport'] = json.loads(text_report.read_text(encoding='utf-8'))
              save_report()
              raise SystemExit(0)

          prefix = run([
              sys.executable,
              'nova/_assistant/content-system-v1/tools/validate_factory_prefix.py',
              '--repo-root', '.',
              '--config', 'nova/curriculum/en-fa/factory.config.json',
              '--output', 'nova/curriculum/en-fa/factory_validation.json',
          ])
          if prefix.returncode:
              report['stage'] = 'full-prefix'
              report['errors'].append('Uncached full-prefix regression did not pass.')
              save_report()
              raise SystemExit(0)

          factory_report = json.loads((root / 'nova/curriculum/en-fa/factory_validation.json').read_text(encoding='utf-8'))
          expected = int(wave['lastSortOrder'])
          if factory_report.get('status') != 'PASS' or factory_report.get('passedPrefixLength') != expected:
              report['stage'] = 'full-prefix'
              report['errors'].append(
                  f"Expected PASS through {expected}; got status={factory_report.get('status')} "
                  f"prefix={factory_report.get('passedPrefixLength')}"
              )
              save_report()
              raise SystemExit(0)

          wave = json.loads(wave_path.read_text(encoding='utf-8'))
          wave['status'] = 'INTEGRATED'
          wave['integratedAt'] = datetime.now(timezone.utc).isoformat()
          wave['fullPrefixRegression'] = 'PASS'
          wave['publishRequest'] = request.get('requestKey')
          wave_path.write_text(json.dumps(wave, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          report.update(
              status='PASS',
              stage='ready-to-publish',
              passedPrefixLength=expected,
              errors=[],
          )
          save_report()
          PY

      - name: Publish only a fully green wave
        id: publish
        shell: bash
        run: |
          STATUS=$(python -c 'import json; print(json.load(open("nova/curriculum/en-fa/wave_preflight_report.json"))["status"])')
          git fetch origin main
          if [ "$INPUT_HEAD" != "$(git rev-parse origin/main)" ]; then
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "Main changed during preflight; leave this request for a later retry."
            exit 0
          fi

          git config user.name "nova-production-bot"
          git config user.email "nova-production-bot@users.noreply.github.com"
          git reset

          if [ "$STATUS" != "PASS" ]; then
            git add nova/curriculum/en-fa/wave_preflight_report.json
            if ! git diff --cached --quiet; then
              git commit -m "Record Nova wave preflight result"
              git push origin HEAD:main
            fi
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "Wave was not published because text preflight did not pass."
            exit 0
          fi

          git add nova/courses/en-fa/lessons/ \
                  nova/curriculum/en-fa/ \
                  nova/_assistant/content-system-v1/text_build_report.json
          if git diff --cached --quiet; then
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "No canonical wave changes to publish."
            exit 0
          fi
          git commit -m "Integrate validated Nova authoring wave"
          git push origin HEAD:main
          echo "published=true" >> "$GITHUB_OUTPUT"

      - name: Trigger production only after green canonical publication
        if: steps.publish.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run nova-pilot.yml --ref main
