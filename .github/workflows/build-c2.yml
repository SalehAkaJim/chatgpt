name: Build English C2 Content

on:
  push:
    branches: [main]
    paths:
      - 'scripts/generate_c2_support.py'
      - 'scripts/generate_c2_01_10.py'
      - 'scripts/generate_c2_11_20.py'
      - 'scripts/generate_c2_21_30.py'
      - 'scripts/generate_c2_31_40.py'
      - 'scripts/generate_c2_41_45.py'
      - 'database/import/en/c2.py'
      - 'database/seed/english-c2-curriculum.sql'
      - '.github/workflows/build-c2.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-english-c2
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate all C2 production units
        env:
          PYTHONPATH: .
        run: |
          python scripts/generate_c2_01_10.py
          python scripts/generate_c2_11_20.py
          python scripts/generate_c2_21_30.py
          python scripts/generate_c2_31_40.py
          python scripts/generate_c2_41_45.py

      - name: Validate all C2 production batches
        run: |
          set -e
          for f in content/production/en/C2/*.json; do
            python scripts/validate_content.py "$f" --write-status
          done

      - name: Verify complete C2 curriculum coverage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          expected = [
              'c2-implicit-stance','c2-layered-narrative','c2-lexical-precision',
              'c2-strategic-ambiguity','c2-pragmatic-meaning','c2-evidential-reasoning',
              'c2-causal-complexity','c2-argument-diagnostics','c2-qualification-scope',
              'c2-rhetorical-concession','c2-persuasive-framing','c2-high-stakes-negotiation',
              'c2-facilitating-complex-discussion','c2-spontaneous-interaction','c2-conflict-repair',
              'c2-expert-feedback','c2-strategy-scenarios','c2-crisis-response',
              'c2-executive-networking','c2-leadership-judgment','c2-seminar-discourse',
              'c2-synthesizing-complex-sources','c2-comparative-theory','c2-methodological-critique',
              'c2-sustained-argument','c2-policy-briefing','c2-framing-propaganda',
              'c2-breaking-news-uncertainty','c2-ai-governance','c2-climate-systems',
              'c2-social-institutions','c2-identity-discourse','c2-relationship-nuance',
              'c2-medical-communication','c2-economic-policy','c2-cross-border-travel-resolution',
              'c2-legal-administrative-language','c2-public-consultation','c2-literary-interpretation',
              'c2-comedy-wordplay','c2-figurative-language','c2-register-voice',
              'c2-mediation-reframing','c2-complex-decision-matrix','c2-integrated-mastery',
          ]
          p = Path('content/production/en/C2')
          files = list(p.glob('*.json'))
          units = {}
          for f in files:
              d = json.loads(f.read_text(encoding='utf-8'))
              units[d['curriculum_unit']] = d
              if d.get('cefr') != 'C2':
                  raise SystemExit(f'{f}: expected C2, got {d.get("cefr")}')

          missing = [u for u in expected if u not in units]
          extras = [u for u in units if u not in expected]
          if missing or extras or len(units) != 45:
              raise SystemExit(f'C2 coverage invalid: missing={missing}, extras={extras}, count={len(units)}')

          for slug, d in units.items():
              lessons = {
                  item.get('data', {}).get('lesson_key')
                  for item in d.get('items', [])
                  if item.get('data', {}).get('lesson_key')
              }
              required = {f'{slug}-01', f'{slug}-02', f'{slug}-03'}
              if not required.issubset(lessons):
                  raise SystemExit(f'{slug}: missing lesson coverage {sorted(required - lessons)}')

          print('C2 production coverage: 45/45 units, 135/135 lessons')
          PY

      - name: Validate complete C2 import plan
        run: python database/import/en/c2.py --dry-run

      - name: Build and validate strict C2 audio manifest without TTS
        run: |
          mkdir -p audio/manifests/en
          python scripts/build_audio_manifest.py content/production/en/C2 \
            --level C2 --locale en-US --strict-characters \
            --output audio/manifests/en/C2.json
          python scripts/validate_audio_manifest.py audio/manifests/en/C2.json

      - name: C2 content summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          files = list(Path('content/production/en/C2').glob('*.json'))
          items = 0
          kinds = {}
          for p in files:
              d = json.loads(p.read_text())
              items += len(d['items'])
              for x in d['items']:
                  kinds[x['kind']] = kinds.get(x['kind'], 0) + 1
          manifest = json.loads(Path('audio/manifests/en/C2.json').read_text())
          print('C2 files=', len(files), 'items=', items, 'kinds=', kinds)
          print('C2 audio manifest items=', len(manifest['items']))
          PY

      - name: Commit generated C2 production assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/production/en/C2 audio/manifests/en/C2.json
          if git diff --cached --quiet; then
            echo 'No C2 production changes to commit.'
            exit 0
          fi
          git commit -m 'Complete English C2 production assets [skip ci]'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
