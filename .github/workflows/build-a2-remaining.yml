name: Build English A2 Remaining Content

on:
  push:
    branches: [main]
    paths:
      - 'scripts/generate_a2_remaining.py'
      - '.github/a2-generation-trigger'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-english-a2-remaining
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate A2 units 17-36
        run: python scripts/generate_a2_remaining.py

      - name: Validate all A2 production batches
        run: |
          for f in content/production/en/A2/*.json; do
            python scripts/validate_content.py "$f"
          done

      - name: Verify all 36 curriculum units have production batches
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('content/production/en/A2')
          units = {}
          for f in p.glob('*.json'):
              d = json.loads(f.read_text(encoding='utf-8'))
              units[d['curriculum_unit']] = f.name
          expected = [
              'a2-catching-up','a2-personal-background','a2-family-relationships','a2-home-neighborhood',
              'a2-routines-frequency','a2-last-weekend','a2-past-events','a2-sequencing-time',
              'a2-future-arrangements','a2-going-to-plans','a2-invitations','a2-seasons-weather-plans',
              'a2-food-quantities','a2-cooking-recipes','a2-restaurant-service','a2-clothes-sizes',
              'a2-compare-products','a2-best-choice','a2-trip-planning','a2-tickets-timetables',
              'a2-accommodation','a2-travel-problems','a2-detailed-directions','a2-work-duties',
              'a2-study-habits','a2-abilities-skills','a2-symptoms-pharmacy','a2-appointments-advice',
              'a2-personality-appearance','a2-describe-places','a2-experiences','a2-phone-messages',
              'a2-online-communication','a2-opinions-reasons','a2-everyday-problems','a2-integrated-capstone'
          ]
          missing = [u for u in expected if u not in units]
          if missing:
              raise SystemExit('Missing A2 production units: ' + ', '.join(missing))
          print('A2 production coverage: 36/36')
          PY

      - name: Commit generated production batches
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/production/en/A2
          if git diff --cached --quiet; then
            echo 'No A2 content changes to commit.'
            exit 0
          fi
          git commit -m 'Complete English A2 production content [skip ci]'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
