name: Nova One-off EN-002 JSON Repair

on:
  push:
    paths:
      - '.github/workflows/nova-oneoff-repair-en002-json.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair multiline MySQL JSON and add regression gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          chapter = Path('nova/courses/en-fa/staging/batch_01/chapter_0002/chapter.sql')
          s = chapter.read_text(encoding='utf-8')

          # Two JSON reading configs contain a literal backslash followed by a physical newline.
          if s.count('\\\n') != 2:
              raise SystemExit(f'Expected exactly 2 backslash-newline sequences, found {s.count(chr(92)+chr(10))}')
          s = s.replace('\\\n', ' — ')

          # Their learner-facing prompts are also physical multiline SQL strings; keep them single-line too.
          prompt_repairs = {
              "Maya: Where are you from?\nArman: I''m from Iran.": "Maya: Where are you from? — Arman: I''m from Iran.",
              "Daniel: Do you speak English?\nArman: A little. I speak Persian too.": "Daniel: Do you speak English? — Arman: A little. I speak Persian too.",
          }
          for old, new in prompt_repairs.items():
              if s.count(old) != 1:
                  raise SystemExit(f'Expected one multiline prompt {old!r}, found {s.count(old)}')
              s = s.replace(old, new)
          chapter.write_text(s, encoding='utf-8')

          validator = Path('nova/validation/validate_content_v3.py')
          v = validator.read_text(encoding='utf-8')
          anchor = '    if re.search(r"placeholder|todo|anders\\d",sql,re.I): errors.append("placeholder-like content found")\n'
          addition = '''    # MySQL consumes escapes before CAST(... AS JSON); physical newlines inside JSON string literals are unsafe.\n    for m in re.finditer(r"CAST\\s*\\(\\s*'(?:''|[^'])*'\\s+AS\\s+JSON\\s*\\)", sql, re.I|re.S):\n        if "\\n" in m.group(0):\n            errors.append("MySQL-unsafe physical newline inside CAST(... AS JSON); use JSON_OBJECT/JSON_ARRAY or single-line JSON")\n            break\n'''
          if addition not in v:
              if anchor not in v:
                  raise SystemExit('Validator insertion anchor not found')
              v = v.replace(anchor, anchor + addition)
              validator.write_text(v, encoding='utf-8')

          if '\\\n' in chapter.read_text(encoding='utf-8'):
              raise SystemExit('Backslash-newline remains in EN-002')
          PY
          python3 nova/validation/validate_content_v3.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nova/courses/en-fa/staging/batch_01/chapter_0002/chapter.sql nova/validation/validate_content_v3.py
          git rm .github/workflows/nova-oneoff-repair-en002-json.yml
          git commit -m 'Fix EN-002 MySQL JSON encoding and add regression gate'
          git push origin HEAD:main
