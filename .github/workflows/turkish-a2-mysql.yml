name: Turkish A2 MySQL Integration

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/turkish-a2-mysql-trigger']

jobs:
  mysql-9-import:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:9.0.1
        env:
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_DATABASE: language_learning
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -prootpass"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      DATABASE_URL: mysql://root:rootpass@127.0.0.1:3306/language_learning
      MYSQL_PWD: rootpass
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          sudo apt-get update -qq && sudo apt-get install -y default-mysql-client
      - name: Bootstrap schema and Turkish curriculum
        run: |
          set -euo pipefail
          DB="mysql -h127.0.0.1 -P3306 -uroot language_learning"
          $DB < database/schema.sql
          $DB < database/migrations/001_curriculum.sql
          $DB < database/migrations/002_multilingual_core.sql
          $DB < database/migrations/003_lesson_item_lexemes.sql
          $DB < database/migrations/004_level_import_audio.sql
          $DB < database/migrations/005_writing_exercises.sql
          $DB < database/seed/cefr.sql
          $DB < database/seed/languages.sql
          $DB < database/seed/skills-topics.sql
          $DB < database/seed/english-a1-curriculum.sql
          $DB < database/seed/language-variants-courses.sql
          $DB < database/seed/turkish-prea1-curriculum.sql
          $DB < database/seed/turkish-a1-curriculum.sql
          $DB < database/seed/turkish-a2-curriculum.sql
      - name: Derive cumulative Turkish A2 expectations
        id: expected
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          specs=[]
          for p in sorted(Path('content/specs/tr/A2').glob('batch-*.json')):
              payload=json.loads(p.read_text(encoding='utf-8'))
              specs.extend(payload.get('units',[]))
          files=sorted(Path('content/production/tr/A2').glob('*.json'))
          if len(files) != len(specs):
              raise SystemExit(f'spec/production unit mismatch: specs={len(specs)} production={len(files)}')
          lessons=set(); exercises=0
          for p in files:
              payload=json.loads(p.read_text(encoding='utf-8'))
              for item in payload.get('items',[]):
                  data=item.get('data',{})
                  if data.get('lesson_key'):
                      lessons.add(data['lesson_key'])
                  if item.get('kind') == 'exercise':
                      exercises += 1
          if not files or not lessons or not exercises:
              raise SystemExit('Turkish A2 expectations resolved to an empty level')
          print(f'units={len(files)}')
          print(f'lessons={len(lessons)}')
          print(f'exercises={exercises}')
          PY
      - name: Validate and dry-run cumulative Turkish A2
        run: |
          set -euo pipefail
          actual_files=$(find content/production/tr/A2 -maxdepth 1 -name '*.json' | wc -l | tr -d ' ')
          test "$actual_files" = "${{ steps.expected.outputs.units }}"
          for f in content/production/tr/A2/*.json; do python scripts/validate_content.py "$f"; done
          python database/import/tr/a2.py --dry-run
      - name: Import Turkish course through A2
        run: |
          python database/import/tr/pre_a1.py --allow-unreviewed
          python database/import/tr/a1.py --allow-unreviewed
          python database/import/tr/a2.py --allow-unreviewed
      - name: Verify Turkish A2 cumulative counts
        run: |
          set -euo pipefail
          q(){ mysql -N -s -h127.0.0.1 -P3306 -uroot language_learning -e "$1"; }
          units=$(q "SELECT COUNT(*) FROM curriculum_units cu JOIN courses c ON c.id=cu.course_id AND c.slug='fa-tr-tr' JOIN cefr_levels lvl ON lvl.id=cu.cefr_level_id AND lvl.code='A2';")
          lessons=$(q "SELECT COUNT(*) FROM lessons le JOIN courses c ON c.id=le.course_id AND c.slug='fa-tr-tr' JOIN cefr_levels lvl ON lvl.id=le.cefr_level_id AND lvl.code='A2';")
          concepts=$(q "SELECT COUNT(DISTINCT li.concept_id) FROM lesson_items li JOIN lessons le ON le.id=li.lesson_id JOIN courses c ON c.id=le.course_id JOIN cefr_levels lvl ON lvl.id=le.cefr_level_id WHERE c.slug='fa-tr-tr' AND lvl.code='A2' AND li.concept_id IS NOT NULL;")
          lexemes=$(q "SELECT COUNT(DISTINCT li.lexeme_id) FROM lesson_items li JOIN lessons le ON le.id=li.lesson_id JOIN courses c ON c.id=le.course_id JOIN cefr_levels lvl ON lvl.id=le.cefr_level_id WHERE c.slug='fa-tr-tr' AND lvl.code='A2' AND li.lexeme_id IS NOT NULL;")
          utterances=$(q "SELECT COUNT(DISTINCT li.utterance_id) FROM lesson_items li JOIN lessons le ON le.id=li.lesson_id JOIN courses c ON c.id=le.course_id JOIN cefr_levels lvl ON lvl.id=le.cefr_level_id WHERE c.slug='fa-tr-tr' AND lvl.code='A2' AND li.utterance_id IS NOT NULL;")
          dialogues=$(q "SELECT COUNT(DISTINCT li.dialogue_id) FROM lesson_items li JOIN lessons le ON le.id=li.lesson_id JOIN courses c ON c.id=le.course_id JOIN cefr_levels lvl ON lvl.id=le.cefr_level_id WHERE c.slug='fa-tr-tr' AND lvl.code='A2' AND li.dialogue_id IS NOT NULL;")
          exercises=$(q "SELECT COUNT(*) FROM exercises e JOIN lessons le ON le.id=e.lesson_id JOIN courses c ON c.id=le.course_id JOIN cefr_levels lvl ON lvl.id=le.cefr_level_id WHERE c.slug='fa-tr-tr' AND lvl.code='A2';")
          echo "units=$units lessons=$lessons concepts=$concepts lexemes=$lexemes utterances=$utterances dialogues=$dialogues exercises=$exercises"
          test "$units" = "${{ steps.expected.outputs.units }}"
          test "$lessons" = "${{ steps.expected.outputs.lessons }}"
          test "$exercises" = "${{ steps.expected.outputs.exercises }}"
          test "$concepts" -gt 0; test "$lexemes" -gt 0; test "$utterances" -gt 0; test "$dialogues" -gt 0
      - name: Verify A2 idempotency
        run: |
          set -euo pipefail
          q(){ mysql -N -s -h127.0.0.1 -P3306 -uroot language_learning -e "$1"; }
          snap(){ q "SELECT CONCAT((SELECT COUNT(*) FROM lessons le JOIN courses c ON c.id=le.course_id WHERE c.slug='fa-tr-tr'),'|',(SELECT COUNT(*) FROM exercises e JOIN lessons le ON le.id=e.lesson_id JOIN courses c ON c.id=le.course_id WHERE c.slug='fa-tr-tr'),'|',(SELECT COUNT(*) FROM lesson_items li JOIN lessons le ON le.id=li.lesson_id JOIN courses c ON c.id=le.course_id WHERE c.slug='fa-tr-tr'));"; }
          before=$(snap); python database/import/tr/a2.py --allow-unreviewed; after=$(snap)
          echo "before=$before after=$after"; test "$before" = "$after"
