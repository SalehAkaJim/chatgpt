name: Nova Turn Audio

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Run type
        required: true
        type: choice
        default: plan
        options:
          - plan
          - initial
          - after_series
      confirm_paid_generation:
        description: Confirm ElevenLabs quota usage
        required: true
        type: boolean
        default: false
  push:
    branches:
      - main
    paths:
      - "nova/archive/series_001_080_fixed/extracted/*series*_v9*.sql"
      - "nova/staging/**/chapter.sql"

permissions:
  contents: write

concurrency:
  group: nova-turn-audio
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      NOVA_TTS_CONCURRENCY: "2"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest discover -s nova/tts/tests -v

      - name: Validate repository SQL sources
        run: python nova/tts/nova_tts.py validate-sources

      - name: Validate paid-run confirmation
        if: github.event_name == 'workflow_dispatch' && inputs.mode != 'plan' && !inputs.confirm_paid_generation
        run: |
          echo "Paid generation was not confirmed."
          exit 2

      - name: Assign distinct profile-matched German voices
        id: voices
        if: github.event_name == 'push' || inputs.mode != 'plan'
        continue-on-error: true
        run: python nova/tts/nova_tts.py bootstrap-voices --yes

      - name: Show generation plan
        if: always()
        run: python nova/tts/nova_tts.py plan

      - name: Generate missing or stale audio
        id: audio
        if: (github.event_name == 'push' || inputs.mode != 'plan') && steps.voices.outcome == 'success'
        continue-on-error: true
        run: python nova/tts/nova_tts.py generate --yes

      - name: Commit resumable voices, audio, manifest, and update SQL
        if: always() && (github.event_name == 'push' || inputs.mode != 'plan')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- nova/tts/voice_map.json nova/audio
          if git diff --cached --quiet; then
            echo "No TTS files changed."
          else
            git commit -m "Generate Nova turn audio"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Fail after preserving resumable progress
        if: always() && (github.event_name == 'push' || inputs.mode != 'plan') && (steps.voices.outcome == 'failure' || steps.audio.outcome == 'failure')
        run: |
          echo "Voice assignment or audio generation was incomplete. Successful progress was committed; re-run to resume."
          exit 2
