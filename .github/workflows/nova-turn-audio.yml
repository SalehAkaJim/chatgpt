name: Nova German Turn Audio

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "nova/courses/de-fa/staging/**/chapter.sql"
      - ".github/workflows/nova-turn-audio.yml"

permissions:
  contents: write

concurrency:
  group: nova-de-fa-turn-audio
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      NOVA_COURSE: "de-fa"
      NOVA_TTS_CONCURRENCY: "2"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run tests
        run: NOVA_COURSE=de-fa python -m unittest discover -s nova/tts/tests -v
      - name: Normalize v3 source locators
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          root = Path("nova/courses/de-fa/staging")
          for path in root.glob("batch_*/chapter_*/chapter.sql"):
              text = path.read_text(encoding="utf-8")
              if re.search(r"(?im)^--\s*SERIES\s+\d+\s*$", text[:1200]):
                  continue
              match = re.fullmatch(r"chapter_(\d+)", path.parent.name)
              if not match:
                  raise SystemExit(f"Cannot infer Series from {path}")
              series = int(match.group(1))
              path.write_text(f"-- SERIES {series}\n{text}", encoding="utf-8")
              print(f"Injected temporary TTS locator for {path}: SERIES {series}")
          PY
      - name: Validate SQL sources
        run: python nova/tts/nova_tts.py validate-sources
      - name: Prepare voices
        id: voices
        continue-on-error: true
        run: python nova/tts/nova_tts.py bootstrap-voices --yes
      - name: Generate audio
        id: audio
        if: steps.voices.outcome == 'success'
        continue-on-error: true
        run: python nova/tts/nova_tts.py generate --yes
      - name: Commit resumable audio
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -e "nova/tts/voice_map_de_fa.json" ]; then git add -A -- "nova/tts/voice_map_de_fa.json"; fi
          if [ -e "nova/audio/de-fa" ]; then git add -A -- "nova/audio/de-fa"; fi
          if [ -e "nova/audio/turns/de-fa" ]; then git add -A -- "nova/audio/turns/de-fa"; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Generate Nova de-fa turn audio"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            test "$attempt" -eq 5 && exit 1
            sleep $((attempt * 2))
          done
      - name: Fail after preserving progress
        if: always() && (steps.voices.outcome == 'failure' || steps.audio.outcome == 'failure')
        run: exit 2
