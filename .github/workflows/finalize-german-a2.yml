name: Finalize German A2 Content

on:
  push:
    branches:
      - language/german-a2
    paths:
      - '.github/german-a2-build-trigger'

permissions:
  contents: write

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      mysql:
        image: mysql:9.0.1
        env:
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_DATABASE: language_learning
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -prootpass"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    env:
      DATABASE_URL: mysql://root:rootpass@127.0.0.1:3306/language_learning
      MYSQL_PWD: rootpass
    steps:
      - name: Checkout A2 branch
        uses: actions/checkout@v4
        with:
          ref: language/german-a2
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y default-mysql-client

      - name: Generate German A2 production content
        run: python .staging/german-a2/generate.py

      - name: Validate all A2 batches and cross-batch QA
        run: |
          set -euo pipefail
          python scripts/audit_german_a2_content.py
          for f in content/production/de/A2/*.json; do
            echo "===== $f ====="
            python scripts/validate_content.py "$f"
          done
          python database/import/de/a2.py --dry-run

      - name: Confirm educational release gate remains active
        run: |
          set +e
          python database/import/de/a2.py --dry-run --require-approved
          rc=$?
          set -e
          test "$rc" -ne 0

      - name: Bootstrap MySQL and German A2 curriculum
        run: |
          set -euo pipefail
          DB="mysql -h127.0.0.1 -P3306 -uroot language_learning"
          $DB < database/schema.sql
          $DB < database/migrations/001_curriculum.sql
          $DB < database/migrations/002_multilingual_core.sql
          $DB < database/migrations/003_lesson_item_lexemes.sql
          $DB < database/migrations/004_level_import_audio.sql
          $DB < database/migrations/005_writing_exercises.sql
          $DB < database/seed/cefr.sql
          $DB < database/seed/languages.sql
          $DB < database/seed/skills-topics.sql
          $DB < database/seed/language-variants-courses.sql
          $DB < database/seed/german-prea1-curriculum.sql
          $DB < database/seed/german-a1-curriculum.sql
          $DB < database/seed/german-a2-curriculum.sql
          a2=$($DB -Nse "SELECT COUNT(*) FROM curriculum_units cu JOIN courses c ON c.id=cu.course_id JOIN cefr_levels l ON l.id=cu.cefr_level_id WHERE c.slug='fa-de-de' AND l.code='A2'")
          echo "German A2 units: $a2"
          test "$a2" = 36

      - name: Import A2 review build and verify idempotency
        run: |
          set -euo pipefail
          DB="mysql -h127.0.0.1 -P3306 -uroot language_learning"
          python database/import/de/a2.py --allow-unreviewed
          before=$($DB -Nse "SELECT CONCAT((SELECT COUNT(*) FROM lessons le JOIN courses c ON c.id=le.course_id JOIN cefr_levels l ON l.id=le.cefr_level_id WHERE c.slug='fa-de-de' AND l.code='A2'),':',(SELECT COUNT(*) FROM exercises e JOIN lessons le ON le.id=e.lesson_id JOIN cefr_levels l ON l.id=le.cefr_level_id JOIN courses c ON c.id=le.course_id WHERE c.slug='fa-de-de' AND l.code='A2'))")
          python database/import/de/a2.py --allow-unreviewed
          after=$($DB -Nse "SELECT CONCAT((SELECT COUNT(*) FROM lessons le JOIN courses c ON c.id=le.course_id JOIN cefr_levels l ON l.id=le.cefr_level_id WHERE c.slug='fa-de-de' AND l.code='A2'),':',(SELECT COUNT(*) FROM exercises e JOIN lessons le ON le.id=e.lesson_id JOIN cefr_levels l ON l.id=le.cefr_level_id JOIN courses c ON c.id=le.course_id WHERE c.slug='fa-de-de' AND l.code='A2'))")
          echo "before=$before after=$after"
          test "$before" = "$after"

      - name: Commit finalized A2 source content
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/production/de/A2 database/seed/german-a2-curriculum.sql
          if git diff --cached --quiet; then
            echo 'No generated A2 changes to commit.'
            exit 0
          fi
          git commit -m 'Complete German A2 production content [skip ci]'
          git fetch origin language/german-a2
          git rebase origin/language/german-a2
          git push origin HEAD:language/german-a2
