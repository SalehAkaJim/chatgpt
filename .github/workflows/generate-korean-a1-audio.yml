name: Generate Korean A2 Audio
on:
  push:
    branches: [main]
    paths: ['.github/korean-a2-audio-trigger']
  workflow_dispatch:
permissions: {contents: write}
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env: {ELEVENLABS_API_KEY: '${{ secrets.ELEVENLABS_API_KEY }}', CONTENT_TTS_CONCURRENCY: '2', ELEVENLABS_MODEL_ID: eleven_multilingual_v2, ELEVENLABS_DIALOGUE_MODEL_ID: eleven_multilingual_v2}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt
      - run: test -n "${ELEVENLABS_API_KEY:-}" || exit 2
      - name: Validate content
        run: |
          for f in content/production/ko/A2/*.json; do python scripts/validate_content.py "$f"; done
          python scripts/validate_character_cast.py --cast audio/cast/ko-KR.json
          python database/import/ko/a2.py --dry-run
      - name: Build and preflight manifest
        run: |
          mkdir -p audio/manifests/ko
          python scripts/build_audio_manifest.py content/production/ko/A2 --level A2 --locale ko-KR --strict-characters --output audio/manifests/ko/A2.json
          python scripts/resolve_audio_voices.py audio/manifests/ko/A2.json --write-lock
          python scripts/validate_audio_manifest.py audio/manifests/ko/A2.json
          python scripts/audit_voice_lock.py --lock audio/voices/ko-KR.lock.json --registry audio/voices/ko-KR.json --strict
      - name: Generate and validate
        run: |
          python scripts/generate_audio.py audio/manifests/ko/A2.json --confirm-paid-generation --concurrency 2
          python scripts/validate_audio_manifest.py audio/manifests/ko/A2.json --require-generated
          python scripts/audit_audio_voice_consistency.py audio/manifests/ko/A2.json --lock-file audio/voices/ko-KR.lock.json
          python scripts/export_audio_sql.py audio/manifests/ko/A2.json --status validated --output database/import/ko/a2_audio.sql
      - name: Verify categories
        run: |
          python - <<'PY'
          import collections,json
          d=json.load(open('audio/manifests/ko/A2.json'))
          counts=collections.Counter(x['category'] for x in d['items'])
          assert counts['dialogues']==80,counts
          assert counts['utterances']==40,counts
          assert counts['lexical']==58,counts
          assert len(d['items'])==178,counts
          print(json.dumps({'items':len(d['items']),'categories':dict(counts)},ensure_ascii=False))
          PY
      - name: Commit audio
        run: |
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'; git add audio/generated/ko-KR audio/manifests/ko/A2.json audio/voices/ko-KR.lock.json database/import/ko/a2_audio.sql
          if ! git diff --cached --quiet; then git commit -m 'Generate Korean A2 production audio [skip ci]'; git fetch origin main; git rebase origin/main; git push origin HEAD:main; fi
