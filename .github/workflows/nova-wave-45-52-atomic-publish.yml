name: Nova Wave 45-52 Atomic Publish

on:
  push:
    branches: [main]
    paths: ['.github/workflows/nova-wave-45-52-atomic-publish.yml']

permissions:
  contents: write

concurrency:
  group: nova-production-main
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install --disable-pip-version-check -r nova/_assistant/content-system-v1/tools/requirements.txt

      - name: Prepare repaired immutable snapshot
        env: {PYTHONPATH: nova/_assistant/content-system-v1/tools}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from factory_wave import prefix_hash
          root=Path('.').resolve()

          p41=root/'nova/courses/en-fa/lessons/0041/lesson.source.json'
          l=json.loads(p41.read_text(encoding='utf-8'))
          for f in l['curriculum']['languageReference'].get('usageFallbacks',[]):
              if f.get('query')=='I make tea too':
                  f['query']='I make tea'
                  f['rationale']='Same-Lesson transfer for make with familiar independently taught language.'
          t=next(x for x in l['turns'] if x['turnKey']=='T04')
          t.update(textEn='I make tea.',translationFa='چای درست می‌کنم.',speechTargetEn='I make tea.',acceptedSpeechEn=['I make tea.'])
          a=next(x for x in l['activities'] if x['activityKey']=='A05')
          a['config']['optionsEn'][0]='I make tea.'; a['config']['feedback']['correctFa']='چای درست می‌کنم.'
          a=next(x for x in l['activities'] if x['activityKey']=='A06')
          a['promptFa']='liam هستی. بگو: چای درست می‌کنم.'; a['config']['textEn']='I make tea.'; a['config']['acceptedAnswersEn']=['I make tea.']
          p41.write_text(json.dumps(l,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          p42=root/'nova/courses/en-fa/lessons/0042/lesson.source.json'
          l=json.loads(p42.read_text(encoding='utf-8'))
          c=next(x for x in l['curriculum']['targetConstructions'] if x['key']=='EN-CONSTR-0042-THINK')
          c['form']='I think there is + thing.'
          c['meaningFa']='گفتن یک حدس ساده درباره چیزی که فکر می‌کنی آنجاست'
          p42.write_text(json.dumps(l,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          wd=root/'nova/curriculum/en-fa/waves/en-fa-A1-0045-0052'
          p49=wd/'workers/w05/0049/lesson.source.json'
          l=json.loads(p49.read_text(encoding='utf-8'))
          text=json.dumps(l,ensure_ascii=False).replace('واقعاً','واقعا').replace('تأکید','تاکید')
          l=json.loads(text)
          lr=l['curriculum']['languageReference']
          lr['grammarTargetKeys']=[]
          lr['noNewGrammarReason']='Lexical-focus integration: the provisional grammar reservation was no longer available in the live sequential curriculum spec, so this Lesson claims no new grammar.'
          p49.write_text(json.dumps(l,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          p52=wd/'workers/w08/0052/lesson.source.json'
          l=json.loads(p52.read_text(encoding='utf-8'))
          a=next(x for x in l['activities'] if x['activityKey']=='A04')
          a.clear()
          a.update({'activityKey':'A04','type':'response_choice','instructionFa':'جواب اول را دوباره پیدا کن.','promptFa':'نورا می‌گوید: بگو یک سال. اوون چه جوابی می‌دهد؟','config':{'optionsEn':['One year.','Two years.','One day.'],'answerIndex':0,'feedback':{'optionsFa':['درست است.','این جواب بخش دوم گفت‌وگو است.','این جواب هدف این موقعیت نیست.'],'correctFa':'One year.'}},'metadata':{'learningDemand':'recognition','evidenceKind':'recognition_or_selection'}})
          p52.write_text(json.dumps(l,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          wp=wd/'wave.json'
          w=json.loads(wp.read_text(encoding='utf-8'))
          w['basePrefixHash']=prefix_hash(root,w['courseCode'],[int(x) for x in w['baseGeneratedLessons']])
          w['baseRepair']='generativity-debt-0041-0042'
          wp.write_text(json.dumps(w,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

          python nova/_assistant/content-system-v1/tools/validate_persian_text.py --exceptions nova/_assistant/content-system-v1/persian_orthography_exceptions.json nova/curriculum/en-fa/waves/en-fa-A1-0045-0052/workers/w05/0049/lesson.source.json
          python nova/_assistant/content-system-v1/tools/validate_factory_prefix.py --repo-root . --config nova/curriculum/en-fa/factory.config.json --output /tmp/base.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/base.json',encoding='utf-8'))
          assert p['status']=='PASS',p['errors']
          assert p['passedPrefixLength']==44
          PY

          for n in 45 46 47 48 49 50 51 52; do
            w=$(printf '%02d' $((n-44)))
            python nova/_assistant/content-system-v1/tools/validate_factory_incremental.py --repo-root . --config nova/curriculum/en-fa/factory.config.json --lesson "nova/curriculum/en-fa/waves/en-fa-A1-0045-0052/workers/w${w}/00${n}/lesson.source.json" --no-cache --output "/tmp/l${n}.json"
          done

          git config user.name nova-production-bot
          git config user.email nova-production-bot@users.noreply.github.com
          git add nova/courses/en-fa/lessons/0041/lesson.source.json \
                  nova/courses/en-fa/lessons/0042/lesson.source.json \
                  nova/curriculum/en-fa/waves/en-fa-A1-0045-0052/wave.json \
                  nova/curriculum/en-fa/waves/en-fa-A1-0045-0052/workers/w05/0049/lesson.source.json \
                  nova/curriculum/en-fa/waves/en-fa-A1-0045-0052/workers/w08/0052/lesson.source.json
          git commit -m 'Prepare validated Nova wave 45-52 repairs'

      - name: Integrate ordered single writer
        env: {PYTHONPATH: nova/_assistant/content-system-v1/tools}
        run: |
          python - <<'PY'
          from pathlib import Path
          from factory_wave import integrate_wave
          root=Path('.').resolve()
          integrate_wave(root,root/'nova/curriculum/en-fa/waves/en-fa-A1-0045-0052/wave.json',cache_dir=root/'.cache/nova-validation')
          PY

      - name: Record semantic pedagogy evidence
        run: |
          python - <<'PY'
          import hashlib,json
          from datetime import date
          from pathlib import Path
          root=Path('.')
          course=root/'nova/courses/en-fa/course.source.json'
          ch=hashlib.sha256(course.read_bytes()).hexdigest()
          dims={
            'englishNaturalness':(4,'Short bounded A1 utterances are natural in the authored scene.'),
            'persianMeaningQuality':(4,'Persian copy preserves the intended bounded meaning.'),
            'pedagogicalClarity':(5,'Target, guided practice, retrieval and outcome align.'),
            'distractorQuality':(4,'Distractors are distinct and appropriate for the target.'),
            'dialoguePlausibility':(4,'The scenario gives the language a concrete conversational purpose.'),
            'difficultyFit':(5,'Utterance length and activity load remain controlled for early A1.'),
            'repetitionUsefulness':(4,'Reuse is spaced and serves a new communicative purpose.'),
            'transferQuality':(4,'Changed controlled retrieval or transfer is present.'),
            'overallCoherence':(5,'Scenario, dialogue, activities and outcome align.'),
            'learnerExperience':(3,'Model/editor review only; no learner test is claimed.')}
          for n in [41,42,45,46,47,48,49,50,51,52]:
            d=root/f'nova/courses/en-fa/lessons/{n:04d}'
            src=d/'lesson.source.json'
            lesson=json.loads(src.read_text(encoding='utf-8'))
            review={
              'version':1,'lessonKey':lesson['lessonKey'],
              'sourceHash':hashlib.sha256(src.read_bytes()).hexdigest(),
              'reviewerType':'model','reviewedAt':str(date.today()),
              'scope':f'Model/editor semantic and pedagogy review of Lesson {n:04d}; not an independent human or learner test.',
              'dimensions':{k:{'score':s,'evidence':e} for k,(s,e) in dims.items()},
              'learnerTested':False,
              'limitations':['No independent human or real learner test has been performed.','Review is limited to the bounded A1 outcome.','Final audio prosody remains unreviewed until text gates pass.'],
              'resolvedFindings':['English target usage is contextually plausible.','Persian meaning preserves the bounded sense.','Activities align with the stated outcome and evidence boundary.','Character and learner-role constraints were preserved.'],
              'courseSourceHash':ch}
            (d/'pedagogy.review.json').write_text(json.dumps(review,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Require text QA and full-prefix PASS
        run: |
          python nova/_assistant/content-system-v1/tools/build_pilot.py --repo-root . --text-only
          python nova/_assistant/content-system-v1/tools/validate_factory_prefix.py --repo-root . --config nova/curriculum/en-fa/factory.config.json --output nova/curriculum/en-fa/factory_validation.json
          python - <<'PY'
          import json
          from datetime import datetime,timezone
          from pathlib import Path
          t=json.load(open('nova/_assistant/content-system-v1/text_build_report.json',encoding='utf-8'))
          assert t['status']=='PASS',t
          p=json.load(open('nova/curriculum/en-fa/factory_validation.json',encoding='utf-8'))
          assert p['status']=='PASS',p['errors']
          assert p['passedPrefixLength']==52,p['passedPrefixLength']
          wp=Path('nova/curriculum/en-fa/waves/en-fa-A1-0045-0052/wave.json')
          w=json.loads(wp.read_text(encoding='utf-8'))
          w['status']='INTEGRATED'; w['integratedAt']=datetime.now(timezone.utc).isoformat(); w['fullPrefixRegression']='PASS'
          wp.write_text(json.dumps(w,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Publish only after PASS
        run: |
          git add nova/courses/en-fa/lessons/0041 nova/courses/en-fa/lessons/0042 \
                  nova/courses/en-fa/lessons/0045 nova/courses/en-fa/lessons/0046 \
                  nova/courses/en-fa/lessons/0047 nova/courses/en-fa/lessons/0048 \
                  nova/courses/en-fa/lessons/0049 nova/courses/en-fa/lessons/0050 \
                  nova/courses/en-fa/lessons/0051 nova/courses/en-fa/lessons/0052 \
                  nova/curriculum/en-fa nova/_assistant/content-system-v1/text_build_report.json
          git commit -m 'Integrate validated Nova wave 45-52'
          git push origin HEAD:main
