name: Generate Turkish B1 Batch
on:
  push:
    branches: [main]
    paths: ['.github/turkish-b1-batch-trigger']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: turkish-b1-content-generation-v2
  cancel-in-progress: false
jobs:
  generate-batch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt
      - name: Generate cumulative Turkish B1 content
        run: python scripts/generate_turkish_b1_batch.py
      - name: Validate Turkish B1 production and CEFR boundary
        run: |
          set -euo pipefail
          for f in content/production/tr/B1/*.json; do python scripts/validate_content.py "$f"; done
          python scripts/validate_character_cast.py --cast audio/cast/tr-TR.json
          python scripts/validate_turkish_b1_cefr_boundary.py
          python database/import/tr/b1.py --dry-run
      - name: Cumulative educational QA
        run: |
          python - <<'PY'
          import collections,json
          from pathlib import Path
          files=sorted(Path('content/production/tr/B1').glob('*.json'))
          assert files, 'no Turkish B1 production files'
          counts=collections.Counter(); lessons=set(); ordered=[]
          production_units=0
          for f in files:
              b=json.loads(f.read_text(encoding='utf-8'))
              assert b.get('cefr')=='B1', f
              unit_lessons=set(); dialogues=[]; open_write=[]; personalized=[]
              for item in b['items']:
                  counts[item['kind']]+=1
                  data=item.get('data',{}); lk=data.get('lesson_key')
                  if lk:
                      lessons.add(lk); unit_lessons.add(lk)
                  if item['kind']=='dialogue': dialogues.append(item)
                  if item['kind']=='exercise' and data.get('exercise_type')=='writing' and data.get('prompt',{}).get('personalized'): open_write.append(item)
                  if item['kind']=='exercise' and data.get('exercise_type')=='speaking' and data.get('prompt',{}).get('personalized'): personalized.append(item)
              assert len(unit_lessons)>=3, f'{f.name}: needs at least 3 substantive lessons, got {sorted(unit_lessons)}'
              last=sorted(unit_lessons)[-1]
              assert any(x['data']['lesson_key']==last for x in open_write), f'{f.name}: final lesson missing open writing'
              assert any(x['data']['lesson_key']==last for x in personalized), f'{f.name}: final lesson missing personalized speaking'
              production_units += 1
              for item in sorted(dialogues,key=lambda x:x['data']['lesson_key']):
                  chars=tuple(sorted(item['data'].get('characters',[])[:2])); ordered.append((item['data']['lesson_key'],chars))
          for (lk1,p1),(lk2,p2) in zip(ordered,ordered[1:]):
              assert p1!=p2, f'consecutive dialogue pair repeated: {lk1}/{lk2}: {p1}'
          assert counts['dialogue'] >= production_units*3
          assert counts['utterance'] >= production_units*6
          assert counts['exercise'] >= production_units*17
          print({'units':len(files),'lessons':len(lessons),'production_units':production_units,'counts':dict(counts)})
          PY
      - name: Commit Turkish B1 production content
        run: |
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/production/tr/B1
          if git diff --cached --quiet; then echo 'No generated content changes.'; else
            git commit -m 'Retrofit Turkish B1 third production lessons [skip ci]'
            git fetch origin main; git rebase origin/main; git push origin HEAD:main
          fi
