name: Nova Open Dialogue Corpus Sync

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/nova-open-corpus-sync.yml'
      - 'nova/reference/en-fa/sources.lock.json'
      - 'nova/_assistant/content-system-v1/tools/sync_open_dialogue_corpus.py'
      - 'nova/_assistant/content-system-v1/tools/validate_open_dialogue_corpus.py'
      - 'nova/_assistant/content-system-v1/tools/open_dialogue_catalog.py'
      - 'nova/_assistant/content-system-v1/tools/open_corpus_wave.py'
      - 'nova/_assistant/content-system-v1/tools/test_open_dialogue_corpus.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/nova-open-corpus-sync.yml'
      - 'nova/reference/en-fa/sources.lock.json'
      - 'nova/_assistant/content-system-v1/tools/sync_open_dialogue_corpus.py'
      - 'nova/_assistant/content-system-v1/tools/validate_open_dialogue_corpus.py'
      - 'nova/_assistant/content-system-v1/tools/open_dialogue_catalog.py'
      - 'nova/_assistant/content-system-v1/tools/open_corpus_wave.py'
  schedule:
    - cron: '19 5 * * 1'

permissions:
  contents: write

concurrency:
  group: nova-open-dialogue-corpus-main
  cancel-in-progress: false

jobs:
  test-open-corpus-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile open-corpus tools
        run: |
          python -m py_compile \
            nova/_assistant/content-system-v1/tools/sync_open_dialogue_corpus.py \
            nova/_assistant/content-system-v1/tools/validate_open_dialogue_corpus.py \
            nova/_assistant/content-system-v1/tools/open_dialogue_catalog.py \
            nova/_assistant/content-system-v1/tools/open_corpus_wave.py
      - name: Run deterministic parser/catalog tests
        env:
          PYTHONPATH: nova/_assistant/content-system-v1/tools
        run: python -m unittest nova/_assistant/content-system-v1/tools/test_open_dialogue_corpus.py

  sync-open-corpus:
    if: github.event_name != 'pull_request'
    needs: test-open-corpus-tools
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Sync pinned Taskmaster and Schema-Guided Dialogue data
        run: |
          PYTHONPATH=nova/_assistant/content-system-v1/tools \
          python nova/_assistant/content-system-v1/tools/sync_open_dialogue_corpus.py \
            --repo-root . --course en-fa --shard-size 250
      - name: Validate corpus, licenses, hashes, and provenance
        run: |
          PYTHONPATH=nova/_assistant/content-system-v1/tools \
          python nova/_assistant/content-system-v1/tools/validate_open_dialogue_corpus.py \
            --repo-root . --course en-fa
      - name: Commit compressed authoring snapshot
        run: |
          git config user.name "nova-open-corpus-bot"
          git config user.email "nova-open-corpus-bot@users.noreply.github.com"
          git add nova/reference/en-fa/dialogue
          if git diff --cached --quiet; then
            echo "Open dialogue corpus unchanged."
          else
            git commit -m "Sync Nova open dialogue corpus"
          fi
      - name: Rebase and revalidate against latest main
        run: |
          git fetch origin main
          git rebase origin/main
          PYTHONPATH=nova/_assistant/content-system-v1/tools \
          python nova/_assistant/content-system-v1/tools/sync_open_dialogue_corpus.py \
            --repo-root . --course en-fa --shard-size 250
          PYTHONPATH=nova/_assistant/content-system-v1/tools \
          python nova/_assistant/content-system-v1/tools/validate_open_dialogue_corpus.py \
            --repo-root . --course en-fa
          git add nova/reference/en-fa/dialogue
          if ! git diff --cached --quiet; then
            if git log -1 --pretty=%B | grep -q '^Sync Nova open dialogue corpus$'; then
              git commit --amend --no-edit
            else
              git commit -m "Sync Nova open dialogue corpus"
            fi
          fi
      - name: Push validated corpus snapshot
        run: git push origin HEAD:main
