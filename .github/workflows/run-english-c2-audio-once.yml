name: Run English C2 Audio Once

on:
  push:
    paths:
      - '.github/workflows/run-english-c2-audio-once.yml'

permissions:
  contents: write

concurrency:
  group: english-c2-audio-generation
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      CONTENT_TTS_CONCURRENCY: '2'
      ELEVENLABS_MODEL_ID: eleven_multilingual_v2
      ELEVENLABS_DIALOGUE_MODEL_ID: eleven_multilingual_v2

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Require ElevenLabs connection
        run: |
          if [ -z "${ELEVENLABS_API_KEY:-}" ]; then
            echo 'ELEVENLABS_API_KEY GitHub secret is missing.' >&2
            exit 2
          fi

      - name: Validate complete C2 content import plan and explicit cast
        run: python database/import/en/c2.py --dry-run

      - name: Build strict C2 audio manifest
        run: |
          mkdir -p audio/manifests/en
          python scripts/build_audio_manifest.py content/production/en/C2 \
            --level C2 --locale en-US --strict-characters \
            --output audio/manifests/en/C2.json

      - name: Resolve and lock every required voice without TTS
        run: python scripts/resolve_audio_voices.py audio/manifests/en/C2.json --write-lock

      - name: Generate all C2 audio
        run: |
          python scripts/generate_audio.py audio/manifests/en/C2.json \
            --confirm-paid-generation --concurrency 2

      - name: Validate generated C2 audio
        run: python scripts/validate_audio_manifest.py audio/manifests/en/C2.json --require-generated

      - name: Export database relative-path SQL without connecting to MySQL
        run: |
          python scripts/export_audio_sql.py audio/manifests/en/C2.json \
            --status validated \
            --output database/import/en/c2_audio.sql

      - name: C2 audio summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('audio/manifests/en/C2.json')
          d = json.loads(p.read_text())
          counts = {}
          for x in d['items']:
              counts[x['category']] = counts.get(x['category'], 0) + 1
          print(p, 'items=', len(d['items']), 'categories=', counts)
          print('all en-US mp3 files=', len(list(Path('audio/generated/en-US').rglob('*.mp3'))))
          PY

      - name: Commit generated C2 audio and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/run-english-c2-audio-once.yml
          git add -A \
            audio/cast/en-US.json \
            audio/generated/en-US \
            audio/manifests/en/C2.json \
            audio/voices/en-US.lock.json \
            database/import/en/c2_audio.sql \
            .github/workflows/run-english-c2-audio-once.yml
          git commit -m 'Generate English C2 production audio [skip ci]'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
