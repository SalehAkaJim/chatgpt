name: Generate Turkish A1 Audio

on:
  push:
    branches: [main]
    paths: ['.github/turkish-a1-audio-trigger']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: turkish-a1-audio-generation-v3
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      CONTENT_TTS_CONCURRENCY: '2'
      ELEVENLABS_MODEL_ID: eleven_multilingual_v2
      ELEVENLABS_DIALOGUE_MODEL_ID: eleven_multilingual_v2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Require ElevenLabs connection
        run: |
          test -n "${ELEVENLABS_API_KEY:-}" || { echo 'ELEVENLABS_API_KEY GitHub secret is missing.' >&2; exit 2; }
      - name: Final cumulative Turkish A1 content validation before paid generation
        run: |
          set -euo pipefail
          test "$(find content/production/tr/A1 -maxdepth 1 -name '*.json' | wc -l)" -eq 30
          for f in content/production/tr/A1/*.json; do python scripts/validate_content.py "$f"; done
          python scripts/validate_character_cast.py --cast audio/cast/tr-TR.json
          python database/import/tr/a1.py --dry-run
      - name: Build strict cumulative Turkish A1 manifest
        run: |
          mkdir -p audio/manifests/tr
          python scripts/build_audio_manifest.py content/production/tr/A1 --level A1 --locale tr-TR --strict-characters --output audio/manifests/tr/A1.json
      - name: Resolve and lock every required Turkish voice without TTS
        run: python scripts/resolve_audio_voices.py audio/manifests/tr/A1.json --write-lock
      - name: Validate manifest and voice lock before paid generation
        run: |
          python scripts/validate_audio_manifest.py audio/manifests/tr/A1.json
          python scripts/audit_voice_lock.py --lock audio/voices/tr-TR.lock.json --registry audio/voices/tr-TR.json --strict
      - name: Generate all cumulative Turkish A1 production audio
        run: python scripts/generate_audio.py audio/manifests/tr/A1.json --confirm-paid-generation --concurrency 2
      - name: Validate generated Turkish A1 audio and voice consistency
        run: |
          python scripts/validate_audio_manifest.py audio/manifests/tr/A1.json --require-generated
          python scripts/audit_audio_voice_consistency.py audio/manifests/tr/A1.json --lock-file audio/voices/tr-TR.lock.json
      - name: Export cumulative database relative-path SQL
        run: python scripts/export_audio_sql.py audio/manifests/tr/A1.json --status validated --output database/import/tr/a1_audio.sql
      - name: Verify cumulative manifest outputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('audio/manifests/tr/A1.json').read_text())
          counts={}
          for x in d['items']:
              counts[x['category']]=counts.get(x['category'],0)+1
          missing={'lexical','utterances','dialogues'}-set(counts)
          if missing:
              raise SystemExit('Missing audio categories: '+','.join(sorted(missing)))
          if counts.get('dialogues') != 240:
              raise SystemExit(f"Expected 240 dialogue-turn audio items, got {counts.get('dialogues')}")
          if counts.get('utterances') != 120:
              raise SystemExit(f"Expected 120 utterance audio items, got {counts.get('utterances')}")
          if not 145 <= counts.get('lexical',0) <= 180:
              raise SystemExit(f"Unexpected cumulative lexical audio count: {counts.get('lexical')}")
          if len(d['items']) != sum(counts.values()):
              raise SystemExit('Manifest category total mismatch')
          if d.get('locale')!='tr-TR' or d.get('missing_character_profiles'):
              raise SystemExit('Turkish locale or character profile gate failed')
          generated=Path('audio/generated/tr-TR')
          if not generated.exists():
              raise SystemExit('Turkish generated-audio directory is missing')
          print(json.dumps({'items':len(d['items']),'categories':counts},ensure_ascii=False,indent=2))
          PY
      - name: Commit Turkish A1 batch 3 cumulative audio and DB link files
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audio/generated/tr-TR audio/manifests/tr/A1.json audio/voices/tr-TR.lock.json database/import/tr/a1_audio.sql
          if git diff --cached --quiet; then echo 'No audio changes to commit.'; else
            git commit -m 'Generate Turkish A1 batch 3 cumulative production audio [skip ci]'
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then exit 0; fi
              sleep $((attempt * 2))
            done
            exit 1
          fi
