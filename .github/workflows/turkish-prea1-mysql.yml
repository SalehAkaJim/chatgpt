name: Turkish Pre-A1 MySQL Integration

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/turkish-prea1-mysql-trigger'
      - 'database/seed/turkish-prea1-curriculum.sql'
      - 'database/import/tr/**'
      - 'content/production/tr/Pre-A1/**'
      - 'audio/cast/tr-TR.json'
      - 'audio/voices/tr-TR.json'
      - 'scripts/audit_turkish_prea1_content.py'
      - 'scripts/materialize_level.py'
      - 'scripts/sync_character_cast.py'
      - 'scripts/validate_content.py'
      - '.github/workflows/turkish-prea1-mysql.yml'
      - 'requirements.txt'

jobs:
  mysql-9-import:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:9.0.1
        env:
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_DATABASE: language_learning
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -prootpass"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    env:
      DATABASE_URL: mysql://root:rootpass@127.0.0.1:3306/language_learning
      MYSQL_PWD: rootpass
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y default-mysql-client
      - name: Verify MySQL 9.0.1
        run: |
          v=$(mysql -h127.0.0.1 -P3306 -uroot -Nse 'SELECT VERSION();')
          echo "Server version: $v"
          [[ "$v" == 9.0.1* ]]
      - name: Bootstrap multilingual schema and Turkish Pre-A1 curriculum
        run: |
          set -euo pipefail
          DB="mysql -h127.0.0.1 -P3306 -uroot language_learning"
          $DB < database/schema.sql
          $DB < database/migrations/001_curriculum.sql
          $DB < database/migrations/002_multilingual_core.sql
          $DB < database/migrations/003_lesson_item_lexemes.sql
          $DB < database/migrations/004_level_import_audio.sql
          $DB < database/migrations/005_writing_exercises.sql
          $DB < database/seed/cefr.sql
          $DB < database/seed/languages.sql
          $DB < database/seed/skills-topics.sql
          $DB < database/seed/english-a1-curriculum.sql
          $DB < database/seed/language-variants-courses.sql
          $DB < database/seed/turkish-prea1-curriculum.sql
      - name: Validate Turkish content and dry-run import
        run: |
          set -euo pipefail
          test "$(find content/production/tr/Pre-A1 -maxdepth 1 -name '*.json' | wc -l)" -eq 14
          python scripts/audit_turkish_prea1_content.py
          for f in content/production/tr/Pre-A1/*.json; do python scripts/validate_content.py "$f"; done
          python scripts/validate_character_cast.py --cast audio/cast/tr-TR.json
          python database/import/tr/pre_a1.py --dry-run
      - name: Confirm educational release gate remains active
        run: |
          set -euo pipefail
          set +e
          python database/import/tr/pre_a1.py --dry-run --require-approved
          rc=$?
          set -e
          test "$rc" -ne 0
      - name: Import Turkish Pre-A1 review build
        run: python database/import/tr/pre_a1.py --allow-unreviewed
      - name: Verify canonical counts and course isolation
        run: |
          set -euo pipefail
          units=$(mysql -N -s -h127.0.0.1 -P3306 -uroot language_learning -e "SELECT COUNT(*) FROM curriculum_units cu JOIN courses c ON c.id=cu.course_id AND c.slug='fa-tr-tr' JOIN cefr_levels lvl ON lvl.id=cu.cefr_level_id AND lvl.code='Pre-A1';")
          lessons=$(mysql -N -s -h127.0.0.1 -P3306 -uroot language_learning -e "SELECT COUNT(*) FROM lessons l JOIN courses c ON c.id=l.course_id AND c.slug='fa-tr-tr' JOIN cefr_levels lvl ON lvl.id=l.cefr_level_id AND lvl.code='Pre-A1';")
          concepts=$(mysql -N -s -h127.0.0.1 -P3306 -uroot language_learning -e "SELECT COUNT(DISTINCT li.concept_id) FROM lesson_items li JOIN lessons le ON le.id=li.lesson_id JOIN courses c ON c.id=le.course_id WHERE c.slug='fa-tr-tr' AND li.concept_id IS NOT NULL;")
          lexemes=$(mysql -N -s -h127.0.0.1 -P3306 -uroot language_learning -e "SELECT COUNT(DISTINCT li.lexeme_id) FROM lesson_items li JOIN lessons le ON le.id=li.lesson_id JOIN courses c ON c.id=le.course_id WHERE c.slug='fa-tr-tr' AND li.lexeme_id IS NOT NULL;")
          utterances=$(mysql -N -s -h127.0.0.1 -P3306 -uroot language_learning -e "SELECT COUNT(DISTINCT li.utterance_id) FROM lesson_items li JOIN lessons le ON le.id=li.lesson_id JOIN courses c ON c.id=le.course_id WHERE c.slug='fa-tr-tr' AND li.utterance_id IS NOT NULL;")
          dialogues=$(mysql -N -s -h127.0.0.1 -P3306 -uroot language_learning -e "SELECT COUNT(DISTINCT li.dialogue_id) FROM lesson_items li JOIN lessons le ON le.id=li.lesson_id JOIN courses c ON c.id=le.course_id WHERE c.slug='fa-tr-tr' AND li.dialogue_id IS NOT NULL;")
          exercises=$(mysql -N -s -h127.0.0.1 -P3306 -uroot language_learning -e "SELECT COUNT(*) FROM exercises e JOIN lessons le ON le.id=e.lesson_id JOIN courses c ON c.id=le.course_id WHERE c.slug='fa-tr-tr';")
          echo "units=$units lessons=$lessons concepts=$concepts lexemes=$lexemes utterances=$utterances dialogues=$dialogues exercises=$exercises"
          test "$units" = "14"
          test "$lessons" = "27"
          test "$concepts" = "68"
          test "$lexemes" = "55"
          test "$utterances" = "56"
          test "$dialogues" = "23"
          test "$exercises" = "120"
      - name: Verify Turkish Pre-A1 idempotency
        run: |
          set -euo pipefail
          lesson_sql="SELECT COUNT(*) FROM lessons le JOIN courses c ON c.id=le.course_id WHERE c.slug='fa-tr-tr';"
          concept_sql="SELECT COUNT(DISTINCT li.concept_id) FROM lesson_items li JOIN lessons le ON le.id=li.lesson_id JOIN courses c ON c.id=le.course_id WHERE c.slug='fa-tr-tr' AND li.concept_id IS NOT NULL;"
          lexeme_sql="SELECT COUNT(DISTINCT li.lexeme_id) FROM lesson_items li JOIN lessons le ON le.id=li.lesson_id JOIN courses c ON c.id=le.course_id WHERE c.slug='fa-tr-tr' AND li.lexeme_id IS NOT NULL;"
          utterance_sql="SELECT COUNT(DISTINCT li.utterance_id) FROM lesson_items li JOIN lessons le ON le.id=li.lesson_id JOIN courses c ON c.id=le.course_id WHERE c.slug='fa-tr-tr' AND li.utterance_id IS NOT NULL;"
          dialogue_sql="SELECT COUNT(DISTINCT li.dialogue_id) FROM lesson_items li JOIN lessons le ON le.id=li.lesson_id JOIN courses c ON c.id=le.course_id WHERE c.slug='fa-tr-tr' AND li.dialogue_id IS NOT NULL;"
          exercise_sql="SELECT COUNT(*) FROM exercises e JOIN lessons le ON le.id=e.lesson_id JOIN courses c ON c.id=le.course_id WHERE c.slug='fa-tr-tr';"
          q() { mysql -N -s -h127.0.0.1 -P3306 -uroot language_learning -e "$1"; }
          before="$(q "$lesson_sql")|$(q "$concept_sql")|$(q "$lexeme_sql")|$(q "$utterance_sql")|$(q "$dialogue_sql")|$(q "$exercise_sql")"
          python database/import/tr/pre_a1.py --allow-unreviewed
          after="$(q "$lesson_sql")|$(q "$concept_sql")|$(q "$lexeme_sql")|$(q "$utterance_sql")|$(q "$dialogue_sql")|$(q "$exercise_sql")"
          echo "before=$before after=$after"
          test "$before" = "$after"
