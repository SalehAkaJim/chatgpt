name: MySQL Production Test Once
on:
  push:
    paths:
      - '.github/workflows/mysql-production-test-once.yml'

jobs:
  mysql-production-test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:9.0.1
        env:
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_DATABASE: language_learning
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -prootpass"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    env:
      DATABASE_URL: mysql://root:rootpass@127.0.0.1:3306/language_learning
      MYSQL_PWD: rootpass
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y default-mysql-client
      - name: Verify MySQL 9.0.1
        run: |
          v=$(mysql -h127.0.0.1 -P3306 -uroot -Nse 'SELECT VERSION();')
          echo "Server version: $v"
          [[ "$v" == 9.0.1* ]]
      - name: Verify SQL coverage
        run: |
          count=$(find database -type f -name '*.sql' | wc -l)
          echo "SQL files in database/: $count"
          test "$count" -eq 28
      - name: Run bootstrap SQL one by one
        run: |
          set -euo pipefail
          run_sql(){ echo "===== $1 ====="; mysql -h127.0.0.1 -P3306 -uroot --show-warnings language_learning < "$1"; }
          run_sql database/schema.sql
          run_sql database/migrations/001_curriculum.sql
          run_sql database/migrations/002_multilingual_core.sql
          run_sql database/migrations/003_lesson_item_lexemes.sql
          run_sql database/migrations/004_level_import_audio.sql
          run_sql database/migrations/005_writing_exercises.sql
          run_sql database/seed/cefr.sql
          run_sql database/seed/languages.sql
          run_sql database/seed/skills-topics.sql
          run_sql database/seed/english-a1-curriculum.sql
          run_sql database/seed/language-variants-courses.sql
          run_sql database/seed/english-prea1-curriculum.sql
          run_sql database/seed/english-a2-curriculum.sql
          run_sql database/seed/english-b1-curriculum.sql
          run_sql database/seed/english-b2-curriculum.sql
          run_sql database/seed/english-c1-curriculum.sql
          run_sql database/seed/english-c2-curriculum.sql
          run_sql database/seed/arabic-msa-prea1-curriculum.sql
          run_sql database/seed/german-a1-curriculum.sql
      - name: Check release approval gate
        run: |
          set +e
          blocked=0
          for x in pre_a1 a1 a2 b1 b2 c1 c2; do
            python database/import/en/$x.py --dry-run --require-approved >/tmp/$x-approval.log 2>&1
            rc=$?
            if [ $rc -ne 0 ]; then
              blocked=$((blocked+1))
              echo "$x: BLOCKED by educational review gate"
            else
              echo "$x: APPROVED"
            fi
          done
          set -e
          echo "blocked_levels=$blocked" | tee /tmp/release-gate.txt
      - name: Import English levels one by one
        run: |
          set -euo pipefail
          for x in pre_a1 a1 a2 b1 b2 c1 c2; do
            echo "===== IMPORT $x ====="
            python database/import/en/$x.py --allow-unreviewed
          done
      - name: Run update SQL one by one
        run: |
          set -euo pipefail
          for f in database/import/en/educational_content_updates.sql database/import/en/educational_quality_updates.sql; do
            echo "===== $f ====="
            mysql -h127.0.0.1 -P3306 -uroot --show-warnings language_learning < "$f"
          done
          python scripts/test_english_database_fixes.py
      - name: Run audio SQL one by one
        run: |
          set -euo pipefail
          for f in database/import/en/pre_a1_audio.sql database/import/en/a1_audio.sql database/import/en/a2_audio.sql database/import/en/b1_audio.sql database/import/en/b2_audio.sql database/import/en/c1_audio.sql database/import/en/c2_audio.sql; do
            echo "===== $f ====="
            mysql -h127.0.0.1 -P3306 -uroot --show-warnings language_learning < "$f"
          done
      - name: Verify final database and voice metadata
        run: |
          set -euo pipefail
          mysql -h127.0.0.1 -P3306 -uroot language_learning -e "
            SELECT COUNT(*) lessons FROM lessons;
            SELECT COUNT(*) exercises FROM exercises;
            SELECT COUNT(*) audio_assets FROM audio_assets;
            SELECT COUNT(*) wrong_jack FROM audio_assets WHERE voice_key='character:jack:male_warm' AND status<>'archived' AND JSON_UNQUOTE(JSON_EXTRACT(metadata,'$.voice_name'))<>'Mark - ConvoAI';
            SELECT COUNT(*) wrong_eli FROM audio_assets WHERE voice_key='character:eli:female_bright' AND status<>'archived' AND JSON_UNQUOTE(JSON_EXTRACT(metadata,'$.voice_labels.gender'))<>'female';
            SELECT COUNT(DISTINCT JSON_UNQUOTE(JSON_EXTRACT(metadata,'$.voice_id'))) liam_voice_ids FROM audio_assets WHERE voice_key='character:liam:male_bright' AND status<>'archived';
          "
          test "$(mysql -h127.0.0.1 -P3306 -uroot -Nse "SELECT COUNT(*) FROM audio_assets WHERE voice_key='character:jack:male_warm' AND status<>'archived' AND JSON_UNQUOTE(JSON_EXTRACT(metadata,'$.voice_name'))<>'Mark - ConvoAI'" language_learning)" = 0
          test "$(mysql -h127.0.0.1 -P3306 -uroot -Nse "SELECT COUNT(*) FROM audio_assets WHERE voice_key='character:eli:female_bright' AND status<>'archived' AND JSON_UNQUOTE(JSON_EXTRACT(metadata,'$.voice_labels.gender'))<>'female'" language_learning)" = 0
          test "$(mysql -h127.0.0.1 -P3306 -uroot -Nse "SELECT COUNT(DISTINCT JSON_UNQUOTE(JSON_EXTRACT(metadata,'$.voice_id'))) FROM audio_assets WHERE voice_key='character:liam:male_bright' AND status<>'archived'" language_learning)" -le 1
      - name: Verify idempotent re-import
        run: |
          set -euo pipefail
          before=$(mysql -h127.0.0.1 -P3306 -uroot -Nse "SELECT CONCAT((SELECT COUNT(*) FROM lessons),':',(SELECT COUNT(*) FROM exercises),':',(SELECT COUNT(*) FROM audio_assets))" language_learning)
          for x in pre_a1 a1 a2 b1 b2 c1 c2; do python database/import/en/$x.py --allow-unreviewed >/dev/null; done
          for f in database/import/en/educational_content_updates.sql database/import/en/educational_quality_updates.sql database/import/en/pre_a1_audio.sql database/import/en/a1_audio.sql database/import/en/a2_audio.sql database/import/en/b1_audio.sql database/import/en/b2_audio.sql database/import/en/c1_audio.sql database/import/en/c2_audio.sql; do mysql -h127.0.0.1 -P3306 -uroot language_learning < "$f"; done
          after=$(mysql -h127.0.0.1 -P3306 -uroot -Nse "SELECT CONCAT((SELECT COUNT(*) FROM lessons),':',(SELECT COUNT(*) FROM exercises),':',(SELECT COUNT(*) FROM audio_assets))" language_learning)
          echo "before=$before after=$after"
          test "$before" = "$after"
