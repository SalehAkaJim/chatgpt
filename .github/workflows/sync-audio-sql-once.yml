name: Sync Audio SQL Once
on:
  push:
    paths:
      - '.github/workflows/sync-audio-sql-once.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Re-export validated audio SQL
        run: |
          set -euo pipefail
          for level in Pre-A1 A1 A2 B1 B2 C1 C2; do
            case "$level" in
              Pre-A1) out=pre_a1_audio.sql ;;
              A1) out=a1_audio.sql ;;
              A2) out=a2_audio.sql ;;
              B1) out=b1_audio.sql ;;
              B2) out=b2_audio.sql ;;
              C1) out=c1_audio.sql ;;
              C2) out=c2_audio.sql ;;
            esac
            python scripts/validate_audio_manifest.py "audio/manifests/en/$level.json" --require-generated
            python scripts/export_audio_sql.py "audio/manifests/en/$level.json" --output "database/import/en/$out"
          done
      - name: Commit updated SQL exports
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add database/import/en/*_audio.sql
          if git diff --cached --quiet; then
            echo 'Audio SQL exports already current.'
          else
            git commit -m 'Sync audio SQL exports with current audio [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
