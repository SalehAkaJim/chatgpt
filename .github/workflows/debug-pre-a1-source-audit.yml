name: German Pre-A1 source audit

on:
  push:
    branches: [main]
    paths:
      - 'database/**'
      - '.github/workflows/debug-pre-a1-source-audit.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:9.0.1
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: language_app
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot --silent"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - name: Build final database state
        run: |
          set -euo pipefail
          db='docker run --rm --network host -i mysql:9.0.1 mysql --show-warnings -h127.0.0.1 -uroot -proot language_app'
          $db < database/schema.sql
          shopt -s nullglob
          for f in database/migrations/*.sql; do $db < "$f"; done
          for i in 1 2; do
            $db < database/seed_reference.sql
            for f in database/plans/*.sql; do $db < "$f"; done
            for f in database/content/*.sql; do $db < "$f"; done
          done
      - name: Export active source inventory
        run: |
          set -euo pipefail
          sql() { docker run --rm --network host mysql:9.0.1 mysql -N -s -h127.0.0.1 -uroot -proot language_app -e "$1"; }
          active_items="SELECT ls.source_item_id FROM lesson_sources ls JOIN lessons l ON l.id=ls.lesson_id WHERE l.public_id LIKE 'de_pre_a1_l%' UNION SELECT acs.source_item_id FROM activity_sources acs JOIN activities a ON a.id=acs.activity_id JOIN lessons l ON l.id=a.lesson_id WHERE l.public_id LIKE 'de_pre_a1_l%' UNION SELECT ais.source_item_id FROM activity_item_sources ais JOIN activity_items ai ON ai.id=ais.activity_item_id JOIN activities a ON a.id=ai.activity_id JOIN lessons l ON l.id=a.lesson_id WHERE l.public_id LIKE 'de_pre_a1_l%' UNION SELECT ds.source_item_id FROM dialogue_sources ds JOIN dialogues d ON d.id=ds.dialogue_id WHERE d.public_id LIKE 'de_pre_a1_dlg_%' UNION SELECT dts.source_item_id FROM dialogue_turn_sources dts JOIN dialogue_turns dt ON dt.id=dts.dialogue_turn_id JOIN dialogues d ON d.id=dt.dialogue_id WHERE d.public_id LIKE 'de_pre_a1_dlg_%' UNION SELECT ls.source_item_id FROM lexeme_sources ls JOIN lexemes lx ON lx.id=ls.lexeme_id JOIN lesson_lexemes ll ON ll.lexeme_id=lx.id JOIN lessons l ON l.id=ll.lesson_id WHERE l.public_id LIKE 'de_pre_a1_l%' UNION SELECT gns.source_item_id FROM grammar_note_sources gns JOIN grammar_notes gn ON gn.id=gns.grammar_note_id JOIN lesson_grammar_notes lgn ON lgn.grammar_note_id=gn.id JOIN lessons l ON l.id=lgn.lesson_id WHERE l.public_id LIKE 'de_pre_a1_l%' UNION SELECT ct.source_item_id FROM curriculum_targets ct JOIN language_levels ll ON ll.id=ct.language_level_id JOIN languages lang ON lang.id=ll.language_id JOIN cefr_levels c ON c.id=ll.cefr_level_id WHERE lang.code='de' AND c.code='Pre-A1' AND ct.source_item_id IS NOT NULL"
          {
            echo '=== ACTIVE_SOURCES ==='
            sql "SELECT DISTINCT s.public_id,s.title,s.organization_or_author,s.source_type,COALESCE(s.base_url,''),COALESCE(s.license_name,''),COALESCE(s.license_url,''),s.reuse_status,COALESCE(s.attribution_text,'') FROM sources s JOIN source_items si ON si.source_id=s.id JOIN ($active_items) x ON x.source_item_id=si.id ORDER BY s.public_id;"
            echo '=== ACTIVE_SOURCE_ITEMS ==='
            sql "SELECT DISTINCT s.public_id,si.public_id,COALESCE(si.title,''),COALESCE(si.locator,''),COALESCE(si.item_url,''),COALESCE(si.content_sha256,'') FROM source_items si JOIN sources s ON s.id=si.source_id JOIN ($active_items) x ON x.source_item_id=si.id ORDER BY s.public_id,si.public_id;"
            echo '=== SOURCE_METADATA_GAPS ==='
            sql "SELECT DISTINCT s.public_id,s.reuse_status,COALESCE(s.base_url,''),COALESCE(s.license_name,''),COALESCE(s.license_url,''),COALESCE(s.attribution_text,'') FROM sources s JOIN source_items si ON si.source_id=s.id JOIN ($active_items) x ON x.source_item_id=si.id WHERE s.base_url IS NULL OR s.base_url='' OR s.license_name IS NULL OR s.license_name='' OR s.reuse_status IN ('analysis_only','needs_review') OR (s.reuse_status='reuse_with_attribution' AND (s.attribution_text IS NULL OR s.attribution_text='')) ORDER BY s.public_id;"
          } | tee /tmp/pre-a1-source-audit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: pre-a1-source-audit
          path: /tmp/pre-a1-source-audit.txt
          retention-days: 1
