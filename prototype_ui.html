<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prototype</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f2;color:#18201d;font:14px Tahoma,Arial}button,input{font:inherit}button{cursor:pointer}.hide{display:none!important}header{height:64px;padding:0 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #e1e5df;background:#f5f6f2;position:sticky;top:0;z-index:3}.tag,.muted{color:#737b77;font-size:10px}.layout{display:grid;grid-template-columns:280px 1fr;min-height:calc(100vh - 64px)}aside{padding:12px;border-left:1px solid #e1e5df;background:#fafbf8}.list{display:grid;gap:5px}.lesson{display:grid;grid-template-columns:30px 1fr;gap:8px;width:100%;padding:8px;text-align:right;border:1px solid transparent;border-radius:11px;background:transparent}.lesson:hover,.lesson.on{background:#fff;border-color:#dfe5df}.lesson.on{background:#e0f1eb}.num{width:30px;height:30px;display:grid;place-items:center;background:#eef1ed;border-radius:8px;font-weight:bold}.lesson small{display:block;color:#7a817d;font-size:8px;direction:ltr;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}main{padding:24px}.player{max-width:800px;margin:auto}.head{display:flex;justify-content:space-between;gap:12px}.head h2{font-size:27px;margin:4px 0}.progress{display:flex;justify-content:space-between;margin:18px 0 6px;color:#737b77;font-size:10px}.track{height:5px;background:#e9ede8;border-radius:9px;overflow:hidden}.bar{height:100%;background:#176b57}.card{margin-top:14px;min-height:420px;padding:19px;background:#fff;border:1px solid #e1e5df;border-radius:18px;box-shadow:0 12px 34px #0000000d}.activity-head{display:flex;gap:11px;align-items:center;border-bottom:1px solid #e8ebe7;padding-bottom:13px;margin-bottom:16px}.icon{width:42px;height:42px;display:grid;place-items:center;background:#e0f1eb;border-radius:13px}.activity-head h3{margin:3px 0}.code{direction:ltr;color:#7b817e;font-size:8px}.content{display:grid;gap:11px}.nav{display:flex;justify-content:space-between;margin-top:13px}.btn,.primary{padding:9px 13px;border-radius:10px;border:1px solid #dfe4df;font-weight:bold}.btn{background:#fff}.primary{background:#176b57;color:#fff;border-color:#176b57}.turn{display:flex;gap:8px;margin:9px 0}.turn.me{flex-direction:row-reverse}.avatar{width:34px;height:34px;display:grid;place-items:center;background:#eef1ed;border-radius:50%;font-size:9px}.turn.me .avatar{background:#176b57;color:#fff}.bubble{max-width:82%;padding:10px 12px;background:#eef1ed;border-radius:13px}.turn.me .bubble{background:#e0f1eb}.target{direction:ltr;text-align:left;font-size:17px;font-weight:bold;line-height:1.5}.translation{color:#747b77;font-size:10px;margin-top:4px}.mini{padding:5px 7px;margin-top:5px;border:1px solid #dfe4df;background:#fff;border-radius:7px;font-size:9px}.prompt,.row,.feedback{padding:11px;border:1px solid #e1e5df;border-radius:11px;background:#fafbf9}.choices,.column{display:grid;gap:7px}.choice,.match,.token,.tf{padding:9px;border:1px solid #dfe4df;border-radius:9px;background:#fff}.choice{direction:ltr;text-align:left}.choice.good,.feedback.good{background:#e0f1eb;border-color:#176b57}.choice.bad,.feedback.bad{background:#fdebea;border-color:#a43e36}.matching{display:grid;grid-template-columns:1fr 1fr;gap:8px}.match.left{direction:ltr;text-align:left}.match.selected{outline:3px solid #e0f1eb}.match.done{opacity:.35}.answer,.tokens{display:flex;flex-wrap:wrap;gap:6px;direction:ltr}.answer{min-height:58px;padding:9px;background:#eef1ed;border-radius:10px}.tfrow{display:grid;grid-template-columns:1fr auto;gap:7px;align-items:center;padding:9px;border:1px solid #e1e5df;border-radius:10px}.tf.on{background:#e0f1eb;border-color:#176b57}.form{display:grid;grid-template-columns:1fr 1fr;gap:8px}.field{display:grid;gap:4px}.field label{direction:ltr;text-align:left;font-size:9px;color:#737b77}.field input{padding:9px;border:1px solid #dfe4df;border-radius:9px}.big{direction:ltr;text-align:center;font-size:25px;font-weight:bold;padding:22px;border:1px solid #e1e5df;border-radius:13px}.actions{display:flex;gap:7px;flex-wrap:wrap}.drawer{position:fixed;inset:64px 0 0 auto;width:min(430px,95vw);padding:15px;background:#fff;overflow:auto;z-index:5;box-shadow:-15px 0 40px #0002}.drawer pre{direction:ltr;text-align:left;white-space:pre-wrap;overflow-wrap:anywhere;background:#eef1ed;padding:8px;border-radius:8px;font-size:9px}@media(max-width:760px){.layout{display:block}aside{border:0;border-bottom:1px solid #e1e5df}.list{display:flex;overflow:auto}.lesson{min-width:220px;background:#fff;border-color:#e1e5df}main{padding:14px 11px 70px}.form{grid-template-columns:1fr}.drawer{width:100%}}
</style></head><body><header><div><b>آزمایشگاه درس‌ها</b><div class="tag">PYTHON PROTOTYPE</div></div><span id="status" class="tag">در حال خواندن…</span></header><div class="layout"><aside><b>Deutsch · Pre-A1</b><div id="lessons" class="list"></div></aside><main><div id="empty"><h2>یک درس را انتخاب کن</h2><p class="muted">activityها مستقیم از SQL خوانده می‌شوند.</p></div><article id="player" class="player hide"><div class="head"><div><div id="kicker" class="tag"></div><h2 id="title"></h2><div id="topic" class="muted"></div></div><button id="details" class="btn">جزئیات</button></div><div class="progress"><span id="step"></span><span id="type"></span></div><div class="track"><div id="bar" class="bar"></div></div><section id="card" class="card"></section><div class="nav"><button id="prev" class="btn">قبلی</button><button id="next" class="primary">بعدی</button></div></article></main></div><aside id="drawer" class="drawer hide"><button id="close" class="btn">× بستن</button><div id="inspect"></div></aside><script>
const S={model:null,lesson:null,index:0,state:{},done:new Set()},$=q=>document.querySelector(q),esc=x=>String(x??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;'),fa=n=>new Intl.NumberFormat('fa-IR').format(n),icons={conversation_speaking:'💬',listen_choose:'🎧',multiple_choice:'◉',choose_response:'↪',word_order:'↕',fill_blank:'▱',matching:'⌁',listen_repeat:'🔁',pronunciation_read:'🎙',grammar_focus:'Aa',comprehension:'◎',true_false:'✓',review:'↺',form_fill:'▤',guided_writing:'✎'};
const state=a=>S.state[a.public_id]??={},feedback=s=>s.message?`<div class="feedback ${s.ok?'good':'bad'}">${esc(s.message)}</div>`:'';function speak(t){if(!t||!window.speechSynthesis)return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='de-DE';u.rate=.86;speechSynthesis.speak(u)}
function lessonList(){let box=$('#lessons');box.innerHTML=S.model.lessons.map(l=>`<button class="lesson ${S.lesson?.public_id===l.public_id?'on':''}" data-id="${l.public_id}"><span class="num">${fa(l.sequence_number)}</span><span><b>${esc(l.title_fa)}</b><small>${esc(l.activities.map(a=>a.type_code).join(' › '))}</small></span></button>`).join('');box.querySelectorAll('button').forEach(b=>b.onclick=()=>{S.lesson=S.model.lessons.find(l=>l.public_id===b.dataset.id);S.index=0;$('#empty').classList.add('hide');$('#player').classList.remove('hide');lessonList();render()})}
function activityHead(a){return `<div class="activity-head"><div class="icon">${icons[a.type_code]||'•'}</div><div><div class="code">${esc(a.type_code)}</div><h3>${esc(a.instruction_fa||a.type_label)}</h3></div></div>`}function opts(a){let x=(a.items||[]).filter(i=>i.item_role==='option'||i.is_correct===true||i.is_correct===false||i.is_correct===1||i.is_correct===0);return x.length?x:(a.items||[]).filter(i=>i.text_target||i.text_fa)}function prompt(a){let p=a.payload?.promptTarget||(a.items||[]).find(i=>['prompt','question','stem'].includes(i.item_role))?.text_target;return p?`<div class="prompt"><div class="target">${esc(p)}</div></div>`:''}
function conversation(a){return `<div>${(a.dialogue_turns||[]).map(t=>`<div class="turn ${t.learner_turn?'me':''}"><div class="avatar">${t.learner_turn?'تو':esc((t.character_name||'?').slice(0,1))}</div><div class="bubble"><small>${esc(t.learner_turn?'نوبت تو':t.character_name)}</small><div class="target">${esc(t.text_target)}</div><div class="translation">${esc(t.translation_fa)}</div><button class="mini speak" data-text="${esc(t.text_target)}">🔊 پخش</button>${t.learner_turn?'<button class="mini finish">✓ خواندم</button>':''}</div></div>`).join('')}</div>`}
function choices(a,audio=false){let s=state(a),o=opts(a),p=audio?`<div class="prompt"><button class="btn audio" data-text="${esc((o.find(x=>x.is_correct===1||x.is_correct===true)||o[0])?.text_target)}">🔊 پخش</button><p class="muted">به صدا گوش کن و انتخاب کن.</p></div>`:prompt(a);return p+`<div class="choices">${o.map(x=>`<button class="choice ${s.pick===x.position?(x.is_correct===1||x.is_correct===true?'good':x.is_correct===0||x.is_correct===false?'bad':''):''}" data-pos="${x.position}" data-ok="${x.is_correct===1||x.is_correct===true?'1':x.is_correct===0||x.is_correct===false?'0':''}">${esc(x.text_target||x.text_fa)}${x.text_target&&x.text_fa?`<small>${esc(x.text_fa)}</small>`:''}</button>`).join('')}</div>${feedback(s)}`}
function matching(a){let s=state(a);s.pairs??=[];let rows=(a.items||[]).filter(x=>x.text_target||x.text_fa),key=x=>x.group_key||String(x.position),right=[...rows].reverse();return `<div class="matching"><div class="column">${rows.map(x=>`<button class="match left ${s.L===x.position?'selected':''} ${s.pairs.includes(key(x))?'done':''}" data-side="L" data-pos="${x.position}" data-key="${esc(key(x))}">${esc(x.text_target||'—')}</button>`).join('')}</div><div class="column">${right.map(x=>`<button class="match right ${s.R===x.position?'selected':''} ${s.pairs.includes(key(x))?'done':''}" data-side="R" data-pos="${x.position}" data-key="${esc(key(x))}">${esc(x.text_fa||x.group_key||'—')}</button>`).join('')}</div></div>${feedback(s)}`}
function wordOrder(a){let s=state(a);s.order??=[];let t=(a.items||[]).filter(x=>x.item_role==='token'||x.text_target);return `<div class="answer">${s.order.map(p=>`<button class="token remove" data-pos="${p}">${esc(t.find(x=>x.position===p)?.text_target)}</button>`).join('')||'<span class="muted">تکه‌ها را انتخاب کن.</span>'}</div><div class="tokens">${t.map(x=>`<button class="token add" data-pos="${x.position}" ${s.order.includes(x.position)?'disabled':''}>${esc(x.text_target)}</button>`).join('')}</div><div class="actions"><button class="primary check-order">بررسی</button><button class="btn reset-order">از نو</button></div>${feedback(s)}`}
function trueFalse(a){let s=state(a);s.answers??={};let rows=(a.items||[]).filter(x=>x.item_role==='statement'||x.text_fa||x.text_target);return `<div class="content">${rows.map(x=>`<div class="tfrow"><span>${esc(x.text_fa||x.text_target)}</span><span><button class="tf ${s.answers[x.position]===true?'on':''}" data-pos="${x.position}" data-val="1">درست</button> <button class="tf ${s.answers[x.position]===false?'on':''}" data-pos="${x.position}" data-val="0">غلط</button></span></div>`).join('')}<button class="primary check-tf">بررسی همه</button>${feedback(s)}</div>`}
function form(a){let s=state(a);s.fields??={};let fs=Array.isArray(a.payload?.fields)?a.payload.fields:[];return `<div class="form">${fs.map(f=>`<div class="field"><label>${esc(f)}</label><input data-field="${esc(f)}" value="${esc(s.fields[f]||'')}"></div>`).join('')||'<div class="feedback">فیلدی در payload وجود ندارد.</div>'}</div><button class="primary check-form">ثبت</button>${feedback(s)}<p class="muted">این مقادیر فقط در همین صفحه نگه داشته می‌شوند.</p>`}
function target(a){return a.payload?.targetText||(a.items||[]).find(x=>x.item_role==='prompt')?.text_target||(a.items||[]).find(x=>x.text_target)?.text_target||''}function pronunciation(a){let s=state(a),t=target(a);return `<div class="big">${esc(t||'—')}</div><div class="actions"><button class="btn audio" data-text="${esc(t)}">🔊 نمونه</button><button class="primary record">🎙 میکروفن</button><button class="btn finish">✓ خواندم</button></div>${s.heard?`<div class="prompt"><small>شنیده‌شده</small><div class="target">${esc(s.heard)}</div></div>`:''}${feedback(s)}`}
function generic(a){return (a.items||[]).map(x=>`<div class="row"><span class="code">${esc(x.item_role)}</span>${x.text_target?`<div class="target">${esc(x.text_target)}</div>`:''}${x.text_fa?`<div>${esc(x.text_fa)}</div>`:''}</div>`).join('')||'<div class="feedback">این activity دادهٔ مستقیم ندارد؛ payload را در جزئیات ببین.</div>'}function review(a){if(a.payload?.fields)return form(a);if((a.items||[]).some(x=>x.item_role==='statement'))return trueFalse(a);if((a.items||[]).some(x=>x.group_key||x.item_role==='match'))return matching(a);if(opts(a).some(x=>x.is_correct!==null&&x.is_correct!==undefined))return choices(a);return generic(a)}
function body(a){switch(a.type_code){case'conversation_speaking':return conversation(a);case'listen_choose':return choices(a,true);case'multiple_choice':case'choose_response':case'comprehension':case'fill_blank':return choices(a);case'matching':return matching(a);case'word_order':return wordOrder(a);case'true_false':return trueFalse(a);case'form_fill':case'guided_writing':return form(a);case'pronunciation_read':case'listen_repeat':return pronunciation(a);case'review':return review(a);default:return generic(a)}}
function render(){let l=S.lesson,a=l.activities[S.index];$('#kicker').textContent=`Deutsch · Pre-A1 · درس ${fa(l.sequence_number)}`;$('#title').textContent=l.title_fa;$('#topic').textContent=l.unit_or_topic||'';$('#step').textContent=`مرحله ${fa(S.index+1)} از ${fa(l.activities.length)}`;$('#type').textContent=a.type_label;$('#bar').style.width=`${100*(S.index+1)/l.activities.length}%`;$('#prev').disabled=S.index===0;$('#next').textContent=S.index===l.activities.length-1?'پایان درس':'بعدی';$('#card').innerHTML=activityHead(a)+`<div class="content">${body(a)}</div>`;bind(a);inspect()}
function complete(a,msg='انجام شد.'){let s=state(a);s.ok=true;s.message=msg;S.done.add(a.public_id);render()}function bind(a){document.querySelectorAll('.speak,.audio').forEach(b=>b.onclick=()=>speak(b.dataset.text));document.querySelectorAll('.finish').forEach(b=>b.onclick=()=>complete(a));document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{let s=state(a);s.pick=Number(b.dataset.pos);if(b.dataset.ok==='1'){s.ok=true;s.message='درست است.';S.done.add(a.public_id)}else if(b.dataset.ok==='0'){s.ok=false;s.message='این گزینه درست نیست.'}else{s.ok=true;s.message='انتخاب ثبت شد.';S.done.add(a.public_id)}render()});document.querySelectorAll('.match').forEach(b=>b.onclick=()=>{let s=state(a);if(s.pairs.includes(b.dataset.key))return;s[b.dataset.side]=Number(b.dataset.pos);let L=document.querySelector(`.match.left[data-pos="${s.L}"]`),R=document.querySelector(`.match.right[data-pos="${s.R}"]`);if(L&&R){s.ok=L.dataset.key===R.dataset.key;s.message=s.ok?'جفت درست است.':'این جفت درست نیست.';if(s.ok){s.pairs.push(L.dataset.key);if(s.pairs.length===(a.items||[]).filter(x=>x.text_target||x.text_fa).length)S.done.add(a.public_id)}s.L=s.R=null}render()});document.querySelectorAll('.add').forEach(b=>b.onclick=()=>{state(a).order.push(Number(b.dataset.pos));render()});document.querySelectorAll('.remove').forEach(b=>b.onclick=()=>{let s=state(a);s.order=s.order.filter(x=>x!==Number(b.dataset.pos));render()});$('.reset-order')?.addEventListener('click',()=>{state(a).order=[];render()});$('.check-order')?.addEventListener('click',()=>{let s=state(a),t=(a.items||[]).filter(x=>x.item_role==='token'||x.text_target),built=s.order.map(p=>t.find(x=>x.position===p)?.text_target||'').join(' ').replace(/\s+/g,' ').trim(),canon=String(a.payload?.canonicalText||t.slice().sort((x,y)=>(x.metadata?.correctPosition??x.position)-(y.metadata?.correctPosition??y.position)).map(x=>x.text_target).join(' ')).replace(/\s+/g,' ').trim();s.ok=built===canon;s.message=s.ok?'ترتیب درست است.':'ترتیب هنوز درست نیست.';if(s.ok)S.done.add(a.public_id);render()});document.querySelectorAll('.tf').forEach(b=>b.onclick=()=>{state(a).answers[Number(b.dataset.pos)]=b.dataset.val==='1';render()});$('.check-tf')?.addEventListener('click',()=>{let s=state(a),rows=(a.items||[]).filter(x=>x.item_role==='statement'||x.text_fa||x.text_target);if(rows.some(x=>!(x.position in s.answers))){s.ok=false;s.message='برای همه پاسخ بده.'}else{let n=rows.filter(x=>Boolean(x.is_correct)===s.answers[x.position]).length;s.ok=n===rows.length;s.message=s.ok?'همه درست هستند.':`${fa(n)} از ${fa(rows.length)} درست بود.`;if(s.ok)S.done.add(a.public_id)}render()});document.querySelectorAll('[data-field]').forEach(i=>i.oninput=()=>state(a).fields[i.dataset.field]=i.value);$('.check-form')?.addEventListener('click',()=>{let s=state(a),fs=Array.isArray(a.payload?.fields)?a.payload.fields:[],n=fs.filter(f=>String(s.fields[f]||'').trim()).length;s.ok=n>0;s.message=s.ok?`${fa(n)} فیلد ثبت شد.`:'حداقل یک فیلد را پر کن.';if(s.ok)S.done.add(a.public_id);render()});$('.record')?.addEventListener('click',()=>recognize(a))}
function recognize(a){let R=window.SpeechRecognition||window.webkitSpeechRecognition,s=state(a);if(!R){s.ok=false;s.message='Speech Recognition در این مرورگر در دسترس نیست؛ «خواندم» را بزن.';render();return}let r=new R();r.lang='de-DE';r.onresult=x=>{s.heard=x.results[0][0].transcript;let norm=x=>String(x).toLowerCase().replace(/[^a-zäöüß0-9]+/gi,' ').trim(),t=norm(target(a)),h=norm(s.heard);s.ok=h===t||h.includes(t)||t.includes(h);s.message=s.ok?'تشخیص گفتار نزدیک به متن هدف بود.':'یک بار دیگر امتحان کن.';if(s.ok)S.done.add(a.public_id);render()};r.onerror=()=>{s.message='میکروفن یا تشخیص گفتار موفق نبود.';render()};r.start()}
function inspect(){let a=S.lesson.activities[S.index];$('#inspect').innerHTML=`<h3>${esc(S.lesson.public_id)}</h3><p>${esc(S.lesson.activity_count_rationale||'')}</p><p>${esc(S.lesson.sequence_rationale||'')}</p><hr><h3>${esc(a.public_id)}</h3><p>${esc(a.selection_reason||'')}</p><details><summary>payload</summary><pre>${esc(JSON.stringify(a.payload,null,2))}</pre></details><details><summary>transformations</summary><pre>${esc(JSON.stringify(a.transformations,null,2))}</pre></details><details><summary>items</summary><pre>${esc(JSON.stringify(a.items,null,2))}</pre></details><details><summary>dialogue</summary><pre>${esc(JSON.stringify(a.dialogue_turns,null,2))}</pre></details><p class="muted">آخرین فایل مؤثر: ${esc(a.origin_file||'—')}</p>`}
$('#prev').onclick=()=>{if(S.index){S.index--;render()}};$('#next').onclick=()=>{if(S.index<S.lesson.activities.length-1){S.index++;render()}else $('#card').innerHTML=`<div><h2>درس تمام شد ✓</h2><p>${fa(S.lesson.activities.filter(a=>S.done.has(a.public_id)).length)} از ${fa(S.lesson.activities.length)} activity تکمیل شد.</p><button class="primary" onclick="S.index=0;render()">از اول</button></div>`};$('#details').onclick=()=>$('#drawer').classList.remove('hide');$('#close').onclick=()=>$('#drawer').classList.add('hide');fetch('/api/model').then(r=>r.json()).then(m=>{S.model=m;$('#status').textContent=`${fa(m.lessons.length)} درس · ${fa(Object.values(m.activity_type_counts).reduce((a,b)=>a+b,0))} activity`;lessonList()}).catch(e=>$('#status').textContent='خطا: '+e.message)
</script></body></html>
